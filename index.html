re."],"explanationEasy":"Un locataire peut faire de petits travaux décoratifs : peinture, papier peint, étagères. Pour les gros travaux, il faut l'accord du propriétaire.","whyEasy":["Abattre une cloison change la structure du logement. C'est un gros travail.","La chaudière appartient au propriétaire.","Agrandir une fenêtre change le gros œuvre (la structure du bâtiment)."]},{"id":217,"question":"Quel mariage est reconnu légalement ?","answers":["Le mariage civil (célébré à la mairie)"],"distractors":["Le mariage religieux seul","Le mariage coutumier célébré en famille","Le mariage par simple signature des époux devant témoins"],"explanation":"En France, seul le mariage civil, célébré en mairie par un officier d'état civil, a valeur légale.","why":["Le mariage religieux seul n'a pas de valeur légale.","Le mariage coutumier n'est pas reconnu.","Il faut une cérémonie en mairie."],"explanationEasy":"Seul le mariage civil a une valeur légale. Il a lieu en mairie. Un officier d'état civil le célèbre.","whyEasy":["Le mariage religieux seul n'a pas de valeur légale.","L'État ne reconnaît pas le mariage coutumier.","Il faut une cérémonie en mairie. Une simple signature ne suffit pas."]},{"id":218,"question":"Le stationnement sur une place réservée aux personnes handicapées :","answers":["Est réservé aux personnes en situation de handicap titulaires d'une carte « mobilité inclusion » (CMI)","Est interdit, sauf pour les titulaires de la carte spécifique (CMI)"],"distractors":["Est autorisé pour tous si le moteur est coupé","Est autorisé pour tous le dimanche et les jours fériés","Est réservé aux personnes de plus de 65 ans"],"explanation":"Les places réservées sont pour les titulaires de la carte mobilité inclusion (CMI) ; s'y garer sans carte est sanctionné.","why":["Même moteur coupé, c'est interdit.","Les jours fériés non plus.","Il n'y a pas de limite d'âge : c'est la carte qui compte."],"explanationEasy":"Les places pour personnes handicapées sont réservées aux titulaires de la carte mobilité inclusion (CMI). Sans carte, on reçoit une sanction.","whyEasy":["Même avec le moteur coupé, c'est interdit.","C'est aussi interdit le dimanche et les jours fériés.","Il n'y a pas d'âge minimum. Ce qui compte, c'est la carte."]},{"id":219,"question":"Si une machine à laver est cassée, il est possible de :","answers":["Demander au vendeur de la faire réparer ou de la remplacer","Faire jouer la garantie de 2 ans"],"distractors":["Garder la machine sans rien demander, car aucune garantie ne s'applique","Faire jouer la garantie légale de 6 mois seulement","Demander au maire de la remplacer"],"explanation":"La garantie légale de conformité (2 ans) oblige le vendeur à réparer ou remplacer un bien défectueux.","why":["La garantie légale s'applique.","La garantie légale est de 2 ans, pas de 6 mois.","La mairie n'est pas concernée par ce litige."],"explanationEasy":"La garantie légale de conformité dure 2 ans. Le vendeur doit réparer ou remplacer un produit en panne.","whyEasy":["La garantie légale s'applique bien.","La garantie légale dure 2 ans, pas 6 mois.","La mairie n'a rien à voir avec ce problème."]},{"id":220,"question":"Dans quel cas faut-il déclarer son enfant au service d'état civil ?","answers":["Toujours, dans les 5 jours suivant la naissance"],"distractors":["Seulement si les parents sont mariés","Seulement si l'enfant est né à l'hôpital","Seulement si les parents sont de nationalité française"],"explanation":"Toute naissance doit être déclarée dans les 5 jours, quelle que soit la situation des parents.","why":["Parents mariés ou non.","Naissance à l'hôpital ou à domicile.","Quelle que soit la nationalité."],"explanationEasy":"Il faut toujours déclarer une naissance dans les 5 jours. La situation des parents ne change rien.","whyEasy":["Il faut déclarer la naissance, que les parents soient mariés ou non.","Il faut déclarer la naissance, à l'hôpital ou à la maison.","Il faut déclarer la naissance, quelle que soit la nationalité."]},{"id":221,"question":"Quand faut-il déclarer son enfant au service d'état civil ?","answers":["Dans les 5 jours suivant la naissance"],"distractors":["Dans les 48 heures suivant la naissance","Dans les 15 jours suivant la naissance","Dans les 3 mois suivant la naissance"],"explanation":"La naissance est déclarée dans les 5 jours suivant l'accouchement.","why":["48 heures est plus court que le délai légal de 5 jours.","15 jours dépasse le délai légal de 5 jours.","3 mois est beaucoup trop long."],"explanationEasy":"On déclare la naissance dans les 5 jours après l'accouchement.","whyEasy":["48 heures, c'est plus court que le délai légal de 5 jours.","15 jours, c'est plus long que le délai légal de 5 jours.","3 mois, c'est beaucoup trop long."]},{"id":222,"question":"Quel numéro d'urgence permet d'appeler la police ?","answers":["Le 17 (Police Secours)","Le 112 (Numéro d'urgence européen)"],"distractors":["Le 15 (SAMU)","Le 18 (Pompiers)","Le 115 (Hébergement d'urgence)"],"explanation":"Le 17 appelle la police (Police Secours) ; le 112 est le numéro d'urgence européen.","why":["Le 15 est le SAMU.","Le 18 est celui des pompiers.","Le 115 est l'hébergement d'urgence."],"explanationEasy":"Le 17 appelle la police (Police Secours). Le 112 est le numéro d'urgence européen.","whyEasy":["Le 15 appelle le SAMU.","Le 18 appelle les pompiers.","Le 115 est pour l'hébergement d'urgence."]},{"id":223,"question":"Quel numéro d'urgence permet d'appeler le SAMU ?","answers":["15"],"distractors":["17","18","115"],"explanation":"Le 15 appelle le SAMU (urgences médicales).","why":["Le 17 appelle la police.","Le 18 appelle les pompiers.","Le 115 est l'hébergement d'urgence."],"explanationEasy":"Le 15 appelle le SAMU. Il s'occupe des urgences médicales.","whyEasy":["Le 17 appelle la police.","Le 18 appelle les pompiers.","Le 115 est pour l'hébergement d'urgence."]},{"id":224,"question":"Auprès de quelle institution les parents peuvent inscrire leurs enfants à l'école publique ?","answers":["La mairie"],"distractors":["La préfecture","Le département","Le rectorat"],"explanation":"L'inscription à l'école publique se fait à la mairie.","why":["La préfecture ne gère pas les inscriptions scolaires.","Le département s'occupe des collèges.","Le rectorat gère l'académie, pas les inscriptions en primaire."],"explanationEasy":"On inscrit son enfant à l'école publique à la mairie.","whyEasy":["La préfecture ne gère pas les inscriptions à l'école.","Le département s'occupe des collèges, pas de l'inscription à l'école.","Le rectorat gère l'académie. Il ne gère pas les inscriptions en primaire."]},{"id":225,"question":"En cas de divorce, qui exerce l'autorité parentale ?","answers":["Les deux parents, sauf décision contraire du juge"],"distractors":["Uniquement la mère, qui garde seule les enfants","Uniquement le parent chez qui vit l'enfant","Le parent qui a le salaire le plus élevé"],"explanation":"Après un divorce, l'autorité parentale reste en principe partagée entre les deux parents, sauf décision contraire du juge.","why":["Les deux parents gardent l'autorité parentale.","Le parent chez qui vit l'enfant ne l'exerce pas seul.","Le salaire n'est pas un critère."],"explanationEasy":"Après un divorce, les deux parents gardent en général l'autorité parentale. Seul le juge peut décider autre chose.","whyEasy":["Les deux parents gardent l'autorité parentale, pas seulement la mère.","Le parent chez qui vit l'enfant n'a pas l'autorité parentale seul.","Le salaire n'est pas un critère pour l'autorité parentale."]},{"id":226,"question":"Quelle aide permet aux personnes qui ont des difficultés financières d'avoir un avocat ?","answers":["L'aide juridictionnelle"],"distractors":["La complémentaire santé solidaire","Le revenu de solidarité active (RSA)","L'aide médicale d'État"],"explanation":"L'aide juridictionnelle prend en charge tout ou partie des frais de justice (avocat…) selon les ressources.","why":["La complémentaire santé solidaire aide à payer les frais de santé, pas un avocat.","Le RSA est un revenu minimum.","L'aide médicale d'État concerne les soins."],"explanationEasy":"L'aide juridictionnelle paie tout ou une partie des frais de justice, comme l'avocat. Cela dépend des revenus.","whyEasy":["La complémentaire santé solidaire aide à payer les soins, pas un avocat.","Le RSA est un revenu minimum, pas une aide pour un avocat.","L'aide médicale d'État concerne les soins, pas les avocats."]},{"id":227,"question":"Qui peut demander le divorce de personnes mariées ?","answers":["Un ou les deux époux"],"distractors":["Seulement le mari","Seulement les deux époux d'un commun accord","Les parents du couple"],"explanation":"Le divorce peut être demandé par un seul époux ou par les deux ensemble.","why":["","",""],"explanationEasy":"Un seul époux peut demander le divorce. Les deux époux peuvent aussi le demander ensemble.","whyEasy":["","",""]},{"id":228,"question":"Auprès de quel organisme faut-il demander le remboursement des frais de santé ?","answers":["La Caisse primaire d'assurance maladie (CPAM)","La Sécurité sociale","L'Assurance Maladie"],"distractors":["La Caisse d'allocations familiales (CAF)","France Travail","La mairie"],"explanation":"Les frais de santé sont remboursés par l'Assurance Maladie (CPAM).","why":["La CAF verse des allocations familiales.","France Travail s'occupe de l'emploi.","La mairie ne rembourse pas les soins."],"explanationEasy":"L'Assurance Maladie rembourse les frais de santé. On dit aussi la CPAM.","whyEasy":["La CAF verse les allocations familiales.","France Travail s'occupe de l'emploi.","La mairie ne rembourse pas les soins."]},{"id":229,"question":"La contraception :","answers":["Est un droit garanti, y compris pour les mineurs","Est un choix personnel","Est remboursée"],"distractors":["Est interdite pour les mineurs","Nécessite l'autorisation du conjoint","N'est jamais remboursée"],"explanation":"La contraception est un droit, y compris pour les mineurs, sans autorisation parentale. Beaucoup de méthodes sont remboursées, et prises en charge à 100 % pour les moins de 26 ans.","why":["Il n'y a pas d'interdiction pour les mineurs.","L'autorisation du conjoint n'est pas nécessaire.","Beaucoup de méthodes sont remboursées, voire gratuites avant 26 ans."],"explanationEasy":"La contraception est un droit, même pour les mineurs. Beaucoup de méthodes sont remboursées. Beaucoup sont gratuites avant 26 ans.","whyEasy":["Aucune règle n'interdit la contraception aux mineurs.","Il ne faut pas l'autorisation du conjoint.","Beaucoup de méthodes sont remboursées. Beaucoup sont gratuites avant 26 ans."]},{"id":230,"question":"Qu'est-ce que le principe de confidentialité dans le domaine de la santé ?","answers":["Les personnels de santé doivent garder secrètes les informations médicales d'un patient","Le médecin ne doit révéler aucune information sur son patient","Le strict respect du secret médical"],"distractors":["Le médecin peut informer l'employeur de la maladie de son patient","Les informations médicales sont accessibles à tous les agents de l'hôpital","Les informations médicales du patient sont transmises à sa mairie"],"explanation":"Le secret médical oblige les professionnels de santé à garder confidentielles les informations sur leurs patients.","why":["Un médecin ne peut pas informer l'employeur.","Seuls les soignants concernés ont accès au dossier.","La mairie n'a pas accès aux informations médicales."],"explanationEasy":"Le secret médical oblige les soignants à garder secrètes les informations sur leurs patients.","whyEasy":["Un médecin ne peut pas informer l'employeur de la maladie d'un patient.","Seuls les soignants concernés ont accès au dossier du patient.","La mairie n'a pas accès aux informations médicales."]},{"id":231,"question":"À quoi sert la carte Vitale ?","answers":["À justifier ses droits à l'Assurance Maladie","À simplifier le remboursement des frais de santé","À transmettre électroniquement les feuilles de soins à la Sécurité sociale"],"distractors":["À prouver son identité dans les administrations","À payer ses impôts","À bénéficier des allocations familiales"],"explanation":"La carte Vitale atteste les droits à l'Assurance Maladie et permet le remboursement rapide des soins.","why":["Ce n'est pas une pièce d'identité.","Elle ne sert pas à payer les impôts.","Les allocations familiales relèvent de la CAF."],"explanationEasy":"La carte Vitale prouve les droits à l'Assurance Maladie. Elle permet un remboursement rapide des soins.","whyEasy":["La carte Vitale n'est pas une pièce d'identité.","La carte Vitale ne sert pas à payer les impôts.","Les allocations familiales sont versées par la CAF, pas avec la carte Vitale."]},{"id":232,"question":"À quoi sert une mutuelle santé ?","answers":["À compléter les remboursements de la Sécurité sociale (ticket modérateur)","À rembourser la part des frais médicaux non couverte par l'Assurance Maladie"],"distractors":["À remplacer entièrement les remboursements de l'Assurance Maladie","À payer les impôts sur le revenu à la place de l'assuré","À indemniser les salariés pendant les périodes de chômage"],"explanation":"La mutuelle complète les remboursements de l'Assurance Maladie (ticket modérateur).","why":["Elle complète l'Assurance Maladie, elle ne la remplace pas.","Elle ne paie pas les impôts.","Elle ne gère pas l'indemnisation du chômage."],"explanationEasy":"La mutuelle complète les remboursements de l'Assurance Maladie. Elle paie le ticket modérateur.","whyEasy":["La mutuelle complète l'Assurance Maladie. Elle ne la remplace pas.","La mutuelle ne paie pas les impôts.","La mutuelle ne paie pas le chômage."]},{"id":233,"question":"Qu'est-ce que le tiers payant ?","answers":["Le droit pour le patient de ne pas avancer la part remboursée par l'Assurance Maladie","Le paiement direct du professionnel de santé par l'Assurance Maladie et la mutuelle"],"distractors":["Le paiement des soins en trois fois, sans frais pour le patient","Le remboursement des soins par le médecin au patient, après la consultation","Une réduction de 3 % sur le prix des médicaments prescrits"],"explanation":"Le tiers payant évite d'avancer la part remboursée : le professionnel est payé directement par l'Assurance Maladie (et la mutuelle).","why":["Ce n'est pas un paiement en plusieurs fois.","C'est l'Assurance Maladie qui rembourse, pas le médecin.","Il ne s'agit pas d'une réduction sur les médicaments."],"explanationEasy":"Avec le tiers payant, le patient n'avance pas la part remboursée. L'Assurance Maladie (et la mutuelle) paie directement le professionnel de santé.","whyEasy":["Le tiers payant n'est pas un paiement en plusieurs fois.","C'est l'Assurance Maladie qui rembourse, pas le médecin.","Le tiers payant n'est pas une réduction sur le prix des médicaments."]},{"id":234,"question":"L'inscription à l'Assurance maladie est :","answers":["Obligatoire pour tous les résidents réguliers en France"],"distractors":["Facultative : on peut choisir de ne pas s'inscrire","Réservée aux personnes qui travaillent","Réservée aux personnes de nationalité française"],"explanation":"L'affiliation à l'Assurance Maladie est obligatoire pour toute personne résidant régulièrement en France (protection universelle maladie).","why":["Ce n'est pas facultatif.","Elle n'est pas réservée aux personnes qui travaillent.","Elle n'est pas réservée aux Français."],"explanationEasy":"L'inscription à l'Assurance Maladie est obligatoire. Elle concerne toute personne qui vit régulièrement en France. On parle de protection universelle maladie.","whyEasy":["L'inscription est obligatoire, pas facultative.","Elle ne concerne pas seulement les personnes qui travaillent.","Elle ne concerne pas seulement les Français."]},{"id":235,"question":"L'avortement est-il possible en France ?","answers":["Oui, c'est une liberté garantie par la Constitution","Oui, c'est légal jusqu'à 14 semaines de grossesse"],"distractors":["Non, l'avortement est interdit en France","Oui, mais uniquement avec l'accord du conjoint","Oui, mais seulement jusqu'à 8 semaines de grossesse"],"explanation":"L'IVG est un droit : la liberté d'y recourir est garantie par la Constitution (2024) ; le délai légal est de 14 semaines de grossesse.","why":["L'IVG est légale depuis 1975 (loi Veil).","L'accord du conjoint n'est pas requis.","Le délai légal est de 14 semaines, pas 8."],"explanationEasy":"L'IVG (avortement) est un droit. La Constitution garantit cette liberté depuis 2024. La loi l'autorise jusqu'à 14 semaines de grossesse.","whyEasy":["L'IVG est légale depuis 1975 (loi Veil).","L'accord du conjoint n'est pas demandé.","La loi autorise l'IVG jusqu'à 14 semaines, pas 8."]},{"id":236,"question":"Travailler sans être déclaré est :","answers":["Une infraction pénale appelée travail dissimulé","Un délit puni par la loi"],"distractors":["Une pratique tolérée pour les petits travaux","Une simple erreur administrative sans sanction","Un droit accordé aux étudiants et aux retraités"],"explanation":"Le travail non déclaré est un délit appelé travail dissimulé.","why":["Il n'est pas toléré, même pour de petits travaux.","C'est une infraction sanctionnée.","Il n'existe pas de droit spécial pour les étudiants ou les retraités."],"explanationEasy":"Travailler sans être déclaré est un délit. On l'appelle le travail dissimulé.","whyEasy":["Ce n'est pas toléré, même pour de petits travaux.","C'est une infraction. La loi prévoit une sanction.","Il n'existe pas de droit spécial pour les étudiants ou les retraités."]},{"id":237,"question":"Qu'est-ce que le SMIC ?","answers":["Le salaire horaire minimum garanti en France","Le Salaire Minimum Interprofessionnel de Croissance"],"distractors":["Le salaire moyen de tous les travailleurs en France","Le salaire maximum fixé par la loi","L'allocation versée aux chômeurs"],"explanation":"Le SMIC est le salaire minimum interprofessionnel de croissance : en règle générale, aucun salarié ne peut être payé moins (sauf cas particuliers, comme les apprentis).","why":["Ce n'est pas le salaire moyen.","Ce n'est pas un salaire maximum.","Ce n'est pas l'allocation chômage."],"explanationEasy":"Le SMIC est le salaire minimum interprofessionnel de croissance. En général, aucun salarié ne peut gagner moins.","whyEasy":["Le SMIC n'est pas le salaire moyen.","Le SMIC est un salaire minimum, pas maximum.","Le SMIC n'est pas l'allocation chômage."]},{"id":238,"question":"Quelle est la première démarche à réaliser pour chercher un emploi ?","answers":["S'inscrire à France Travail"],"distractors":["S'inscrire à la CAF","S'inscrire à la mairie","S'inscrire à la CPAM"],"explanation":"Pour chercher un emploi, la première démarche est de s'inscrire à France Travail (ex-Pôle emploi).","why":["La CAF verse des prestations familiales.","La mairie ne gère pas l'emploi.","La CPAM gère l'assurance maladie."],"explanationEasy":"Pour chercher un emploi, on s'inscrit d'abord à France Travail. Son ancien nom est Pôle emploi.","whyEasy":["La CAF verse les prestations familiales.","La mairie ne s'occupe pas de l'emploi.","La CPAM s'occupe de l'assurance maladie."]},{"id":239,"question":"Quelle est la durée légale du temps de travail par semaine ?","answers":["35 heures"],"distractors":["32 heures","39 heures","40 heures"],"explanation":"La durée légale du travail est de 35 heures par semaine ; au-delà, ce sont des heures supplémentaires.","why":["32 heures n'est pas la durée légale.","39 heures était la durée légale jusqu'en 2000 (2002 pour les petites entreprises).","40 heures n'est pas la durée légale."],"explanationEasy":"La durée légale du travail est de 35 heures par semaine. Après 35 heures, ce sont des heures supplémentaires.","whyEasy":["La durée légale n'est pas de 32 heures.","39 heures était la durée légale jusqu'en 2000, ou 2002 pour les petites entreprises.","La durée légale n'est pas de 40 heures."]},{"id":240,"question":"Qui peut demander un congé parental d'éducation ?","answers":["Tout salarié ayant au moins un an d'ancienneté, père ou mère, après la naissance ou l'adoption d'un enfant","Le père ou la mère","Le père et la mère, en même temps ou l'un après l'autre"],"distractors":["Uniquement la mère","Uniquement les fonctionnaires","Uniquement les salariés ayant plus de 10 ans d'ancienneté"],"explanation":"Le congé parental d'éducation est ouvert à tout salarié ayant au moins un an d'ancienneté, père ou mère, après une naissance ou une adoption.","why":["Il est ouvert aux deux parents.","Il ne se limite pas aux fonctionnaires.","Une ancienneté d'un an suffit, pas de 10 ans."],"explanationEasy":"Tout salarié qui a un an d'ancienneté peut demander le congé parental d'éducation. Le père ou la mère peut le prendre après une naissance ou une adoption.","whyEasy":["Le père aussi peut le demander. Il est ouvert aux deux parents.","Il n'est pas réservé aux fonctionnaires.","Il faut un an d'ancienneté, pas 10 ans."]},{"id":241,"question":"Une personne étrangère, en situation régulière, peut créer son entreprise :","answers":["Oui, il n'est pas nécessaire d'être français","Oui, sous réserve d'avoir un titre de séjour qui l'autorise","Oui, à condition d'être en situation régulière avec un statut adapté"],"distractors":["Non, seuls les Français peuvent créer une entreprise","Non, seulement les citoyens de l'Union européenne","Non, sauf si un Français détient 51 % de l'entreprise"],"explanation":"Une personne étrangère en situation régulière peut créer une entreprise, avec un titre de séjour qui l'autorise.","why":["Ce n'est pas réservé aux Français.","Ce n'est pas réservé aux Européens.","La participation d'un Français n'est pas obligatoire."],"explanationEasy":"Une personne étrangère en situation régulière peut créer une entreprise. Il faut un titre de séjour qui l'autorise.","whyEasy":["Créer une entreprise n'est pas réservé aux Français.","Ce n'est pas réservé aux citoyens de l'Union européenne.","Un Français n'a pas besoin de détenir 51 % de l'entreprise."]},{"id":242,"question":"Une femme peut-elle créer son entreprise ?","answers":["Oui, sans aucune restriction"],"distractors":["Non, elle doit avoir l'accord de son mari","Oui, mais seulement dans le commerce","Oui, mais seulement si elle est célibataire"],"explanation":"Une femme peut créer son entreprise sans condition particulière, comme un homme.","why":["L'accord du mari n'est plus exigé depuis 1965.","Aucun secteur n'est réservé aux hommes.","La situation matrimoniale n'a pas d'incidence."],"explanationEasy":"Une femme peut créer son entreprise comme un homme. Il n'y a pas de condition particulière.","whyEasy":["Depuis 1965, une femme n'a plus besoin de l'accord de son mari.","Aucun secteur n'est réservé aux hommes.","Être célibataire ou mariée ne change rien."]},{"id":243,"question":"Quels sont les textes qui définissent les règles au travail ?","answers":["Le code du travail, les conventions collectives et le règlement intérieur","Le Code du travail"],"distractors":["Le Code pénal et le Code de la route","La Constitution seulement","Le Code civil et le règlement de copropriété"],"explanation":"Les règles du travail viennent du Code du travail, des conventions collectives et du règlement intérieur de l'entreprise.","why":["Le Code pénal et le Code de la route ne régissent pas le contrat de travail.","La Constitution seule ne suffit pas.","Un règlement de copropriété concerne l'immeuble, pas le travail."],"explanationEasy":"Trois textes fixent les règles du travail. Ce sont le Code du travail, les conventions collectives et le règlement intérieur de l'entreprise.","whyEasy":["Le Code pénal et le Code de la route ne parlent pas du travail.","La Constitution seule ne donne pas toutes les règles du travail.","Un règlement de copropriété concerne l'immeuble, pas le travail."]},{"id":244,"question":"Quelles sont les affaires traitées par le conseil de prud'hommes ?","answers":["Les litiges (conflits) entre un employeur et un salarié","Les désaccords liés au contrat de travail (licenciement, salaires impayés)"],"distractors":["Les litiges entre voisins","Les conflits entre locataires et propriétaires","Les affaires de divorce"],"explanation":"Le conseil de prud'hommes tranche les litiges entre employeurs et salariés (licenciement, salaires impayés…).","why":["Les conflits de voisinage relèvent du tribunal judiciaire.","Les litiges de bail relèvent du tribunal judiciaire.","Les divorces relèvent du juge aux affaires familiales."],"explanationEasy":"Le conseil de prud'hommes juge les conflits entre employeurs et salariés. Par exemple : licenciement ou salaires impayés.","whyEasy":["Les conflits entre voisins vont au tribunal judiciaire.","Les conflits de bail vont au tribunal judiciaire.","Les divorces relèvent du juge aux affaires familiales."]},{"id":245,"question":"Qui a le droit de se syndiquer ?","answers":["Tous les travailleurs, sans condition","Tous les salariés et agents publics"],"distractors":["Seulement les salariés de nationalité française","Seulement les salariés en CDI","Seulement les salariés qui ont plus de 5 ans d'ancienneté"],"explanation":"Tous les travailleurs peuvent se syndiquer, quelle que soit leur nationalité ou leur contrat.","why":["La nationalité n'est pas un critère.","Les CDD et l'intérim sont aussi concernés.","Aucune ancienneté n'est requise."],"explanationEasy":"Tous les travailleurs peuvent se syndiquer. La nationalité ou le type de contrat ne comptent pas.","whyEasy":["La nationalité n'est pas une condition.","Les salariés en CDD et en intérim peuvent aussi se syndiquer.","Il ne faut pas d'ancienneté."]},{"id":246,"question":"Est-il possible de licencier une femme enceinte ou en congé maternité, en raison de sa grossesse ?","answers":["Non, cela est interdit par la loi"],"distractors":["Oui, si le contrat date de moins d'un an","Oui, si l'employeur la prévient 3 mois à l'avance","Oui, mais seulement après la naissance"],"explanation":"Une salariée enceinte est protégée : on ne peut pas la licencier à cause de sa grossesse, et la protection se poursuit après la naissance.","why":["Aucune ancienneté n'est exigée : la salariée est protégée dès que l'employeur est informé de sa grossesse.","Prévenir à l'avance ne rend pas le licenciement valable.","Le licenciement à cause de la grossesse reste interdit après la naissance : la protection dure jusqu'à 10 semaines après le congé maternité."],"explanationEasy":"Une salariée enceinte est protégée. On ne peut pas la licencier à cause de sa grossesse. La protection continue après la naissance.","whyEasy":["Il ne faut pas d'ancienneté pour être protégée.","Prévenir à l'avance ne rend pas le licenciement valable.","Après la naissance, la protection continue jusqu'à 10 semaines après le congé maternité."]},{"id":247,"question":"L'instruction des enfants est obligatoire de :","answers":["3 ans à 16 ans"],"distractors":["6 ans à 16 ans","5 ans à 14 ans","3 ans à 14 ans"],"explanation":"L'instruction est obligatoire de 3 à 16 ans.","why":["L'instruction obligatoire commence à 3 ans, pas à 6 ans.","Elle commence à 3 ans et dure jusqu'à 16 ans, pas de 5 à 14 ans.","Elle dure jusqu'à 16 ans, pas jusqu'à 14 ans."],"explanationEasy":"L'instruction est obligatoire de 3 à 16 ans.","whyEasy":["L'instruction commence à 3 ans, pas à 6 ans.","Elle commence à 3 ans et finit à 16 ans, pas de 5 à 14 ans.","Elle finit à 16 ans, pas à 14 ans."]},{"id":248,"question":"Des parents ne respectent pas l'obligation d'instruction pour leurs enfants. Quelle sanction maximale risquent-ils ?","answers":["6 mois de prison et 7 500 euros d'amende"],"distractors":["1 an de prison et 15 000 euros d'amende","3 mois de prison et 3 000 euros d'amende","Une amende de 135 euros, sans prison"],"explanation":"Les parents qui refusent d'inscrire leur enfant à l'école malgré une mise en demeure de l'Éducation nationale risquent 6 mois d'emprisonnement et 7 500 euros d'amende. D'autres manquements sont punis différemment.","why":["Les peines prévues sont de 6 mois et 7 500 euros, pas 1 an et 15 000 euros.","Ce ne sont ni 3 mois de prison ni 3 000 euros d'amende.","Le refus d'inscrire un enfant après une mise en demeure est puni de prison, pas seulement d'une amende de 135 euros."],"explanationEasy":"Des parents refusent d'inscrire leur enfant malgré une mise en demeure (un dernier avertissement). Ils risquent 6 mois de prison et 7 500 euros d'amende.","whyEasy":["La peine est de 6 mois et 7 500 euros, pas 1 an et 15 000 euros.","Ce ne sont pas 3 mois de prison ni 3 000 euros.","Il y a aussi de la prison, pas seulement une amende de 135 euros."]},{"id":249,"question":"Quelle est la définition de l'autorité parentale ?","answers":["L'ensemble des droits et devoirs des parents envers leurs enfants"],"distractors":["Le pouvoir de l'État de décider à la place des parents","L'ensemble des droits des parents, sans aucun devoir envers leurs enfants","Le droit de punir physiquement ses enfants"],"explanation":"L'autorité parentale est l'ensemble des droits et devoirs des parents envers leur enfant, dans l'intérêt de l'enfant.","why":["Ce n'est pas un pouvoir de l'État.","Elle implique des devoirs, pas seulement des droits.","Les violences éducatives sont interdites."],"explanationEasy":"L'autorité parentale, ce sont les droits et les devoirs des parents envers leur enfant. Ils agissent dans l'intérêt de l'enfant.","whyEasy":["L'autorité parentale n'est pas un pouvoir de l'État.","Les parents ont des droits, mais aussi des devoirs.","La loi interdit les violences éducatives."]},{"id":250,"question":"Quel motif d'absence est accepté par l'école ?","answers":["La maladie de l'enfant","Une maladie contagieuse d'un membre de la famille","Une réunion solennelle de famille (mariage, enterrement)","Un empêchement lié aux transports (panne, intempéries)"],"distractors":["Des vacances en famille pendant la période de cours","Un anniversaire d'un camarade","Une sortie au cinéma avec des amis"],"explanation":"Les absences justifiées sont par exemple la maladie de l'enfant, une maladie contagieuse dans la famille, une réunion solennelle de famille (mariage, enterrement) ou une difficulté de transport. Les autres motifs sont appréciés par l'Éducation nationale.","why":["Des vacances en période de cours ne sont pas un motif valable.","Un anniversaire n'est pas un motif valable.","Un loisir n'est pas un motif valable."],"explanationEasy":"L'école accepte ces absences. Il y a la maladie de l'enfant et la maladie contagieuse dans la famille. Il y a aussi une réunion de famille importante (mariage, enterrement) ou un problème de transport.","whyEasy":["Des vacances pendant les cours ne sont pas un motif valable.","Un anniversaire n'est pas un motif valable.","Un loisir n'est pas un motif valable."]},{"id":251,"question":"Jusqu'à quel âge l'école est-elle obligatoire ?","answers":["16 ans"],"distractors":["14 ans","15 ans","17 ans"],"explanation":"L'instruction est obligatoire jusqu'à 16 ans (puis la formation est obligatoire jusqu'à 18 ans).","why":["L'instruction est obligatoire jusqu'à 16 ans, pas 14.","Elle dure jusqu'à 16 ans, pas 15.","C'est 16 ans, pas 17 ; ensuite la formation reste obligatoire jusqu'à 18 ans."],"explanationEasy":"L'instruction est obligatoire jusqu'à 16 ans. Ensuite, la formation est obligatoire jusqu'à 18 ans.","whyEasy":["C'est jusqu'à 16 ans, pas 14 ans.","C'est jusqu'à 16 ans, pas 15 ans.","C'est 16 ans, pas 17 ans. Ensuite, la formation est obligatoire jusqu'à 18 ans."]},{"id":252,"question":"À quel âge commence l'instruction obligatoire des enfants ?","answers":["À 3 ans"],"distractors":["À 2 ans","À 5 ans","À 6 ans"],"explanation":"L'instruction est obligatoire dès 3 ans (loi de 2019).","why":["Elle commence à 3 ans, pas à 2 ans.","Elle commence à 3 ans, pas à 5 ans.","6 ans était l'âge avant la loi de 2019 ; l'instruction commence maintenant à 3 ans."],"explanationEasy":"L'instruction est obligatoire dès 3 ans. C'est la loi de 2019.","whyEasy":["Elle commence à 3 ans, pas à 2 ans.","Elle commence à 3 ans, pas à 5 ans.","6 ans était l'âge avant 2019. Maintenant, elle commence à 3 ans."]},{"id":253,"question":"Comment s'appellent les établissements scolaires que les élèves intègrent après l'école élémentaire ?","answers":["Le collège"],"distractors":["Le lycée","La maternelle","L'université"],"explanation":"Après l'école élémentaire, les élèves entrent au collège (de la 6e à la 3e).","why":["Le lycée vient après le collège.","La maternelle précède l'école élémentaire.","L'université vient après le lycée."],"explanationEasy":"Après l'école élémentaire, les élèves entrent au collège. Le collège va de la 6e à la 3e.","whyEasy":["Le lycée vient après le collège.","La maternelle vient avant l'école élémentaire.","L'université vient après le lycée."]},{"id":254,"question":"En tant que parent d'élève, il est possible de :","answers":["Se porter candidat aux élections des représentants de parents d'élèves (ou voter à ces élections)","Rejoindre une association de parents d'élèves (comme la FCPE ou la PEEP)","Rencontrer les professeurs lors des réunions régulières","Participer au conseil d'école (en primaire) ou au conseil d'administration (au collège/lycée)"],"distractors":["Choisir les programmes scolaires enseignés à l'école","Recruter les professeurs de l'établissement","Fixer le calendrier des vacances scolaires"],"explanation":"Les parents d'élèves peuvent élire des représentants, rejoindre une association, rencontrer les enseignants et siéger au conseil d'école ou d'administration.","why":["Les programmes sont fixés par l'Éducation nationale.","Les enseignants sont recrutés par concours.","Le calendrier scolaire est fixé par le ministère."],"explanationEasy":"Les parents d'élèves peuvent élire des représentants et rejoindre une association. Ils rencontrent les enseignants. Ils siègent au conseil d'école ou d'administration.","whyEasy":["L'Éducation nationale fixe les programmes scolaires.","Les professeurs sont recrutés par concours.","Le ministère fixe le calendrier des vacances."]},{"id":255,"question":"Quelle instruction est prévue pour les enfants qui ne parlent pas français ?","answers":["Ils sont accueillis à l'école comme les autres enfants et y apprennent le français ainsi que les autres matières","Un programme spécifique pour apprendre le français"],"distractors":["Ils ne sont pas admis à l'école tant qu'ils ne parlent pas français","Ils sont scolarisés uniquement si leurs parents ont un titre de séjour","Ils sont obligatoirement placés dans des écoles séparées"],"explanation":"Tous les enfants vivant en France sont scolarisés, quelle que soit leur nationalité ou leur situation ; ils apprennent le français à l'école.","why":["On n'attend pas qu'un enfant parle français pour l'accueillir.","Le titre de séjour des parents n'est pas exigé.","Ils sont accueillis dans les mêmes écoles que les autres."],"explanationEasy":"Tous les enfants qui vivent en France vont à l'école. Leur nationalité ou leur situation ne change rien. Ils y apprennent le français.","whyEasy":["On n'attend pas qu'un enfant parle français pour l'accueillir.","On ne demande pas de titre de séjour aux parents.","Ces enfants vont dans les mêmes écoles que les autres."]},{"id":256,"question":"S'agissant de l'accueil des enfants en situation de handicap à l'école, laquelle des propositions est vraie ?","answers":["Ils peuvent bénéficier d'un emploi du temps aménagé à l'école pour suivre leurs soins","L'école s'adapte pour accueillir tous les enfants en situation de handicap (École inclusive)","L'enfant est scolarisé en classe ordinaire, parfois avec l'aide d'un accompagnant (AESH)"],"distractors":["Ils ne peuvent pas être scolarisés dans une école ordinaire","L'école peut refuser de les inscrire","Ils ne peuvent jamais bénéficier d'un accompagnant"],"explanation":"L'école inclusive accueille les enfants en situation de handicap, en classe ordinaire, avec des aménagements et parfois un accompagnant (AESH).","why":["L'inclusion en classe ordinaire est la règle.","L'école ne peut pas refuser un enfant à cause de son handicap.","Un accompagnant peut être attribué."],"explanationEasy":"L'école inclusive accueille les enfants en situation de handicap. Ils vont en classe ordinaire, avec des aménagements. Parfois, un accompagnant (AESH) les aide.","whyEasy":["La règle est la classe ordinaire.","L'école ne peut pas refuser un enfant à cause de son handicap.","Un accompagnant peut aider l'enfant."]},{"id":257,"question":"Depuis le 1er juillet 2021, quelle est la durée du congé paternité ?","answers":["28 jours"],"distractors":["14 jours","21 jours","30 jours"],"explanation":"Depuis le 1er juillet 2021, le congé de paternité et de naissance dure 28 jours (dont 7 obligatoires), pour une naissance unique ; il est de 35 jours en cas de naissances multiples.","why":["14 jours était la durée avant la réforme de 2021.","21 jours ne correspond pas à la durée actuelle, qui est de 28 jours.","30 jours est trop long : la durée est de 28 jours pour une naissance unique."],"explanationEasy":"Depuis le 1er juillet 2021, le congé de paternité et de naissance dure 28 jours. 7 jours sont obligatoires. En cas de jumeaux, il dure 35 jours.","whyEasy":["14 jours, c'était avant 2021.","21 jours n'est pas la durée actuelle. C'est 28 jours.","30 jours est trop long. C'est 28 jours pour une naissance."]},{"id":258,"question":"Est-ce possible de punir physiquement ses enfants ?","answers":["Non, la loi française interdit la violence physique envers les enfants"],"distractors":["Oui, si c'est modéré, au nom du droit de correction des parents","Oui, si les parents l'estiment nécessaire pour l'éducation de l'enfant","Oui, mais seulement à la maison, jamais en public"],"explanation":"La loi du 10 juillet 2019 interdit les violences éducatives ordinaires : le « droit de correction » n'existe plus.","why":["Il n'y a plus de droit de correction.","Aucun parent ne peut décider de frapper son enfant.","L'interdiction vaut aussi à la maison."],"explanationEasy":"La loi du 10 juillet 2019 interdit les violences éducatives ordinaires. Le « droit de correction » n'existe plus.","whyEasy":["Le droit de correction n'existe plus.","Un parent n'a pas le droit de frapper son enfant, même pour l'éduquer.","L'interdiction vaut aussi à la maison."]}]},{"theme":"Mises en situation","questions":[{"id":1001,"question":"Lors d'un entretien d'embauche, le recruteur vous demande quelle est votre religion et si vous prévoyez d'avoir des enfants. Que pouvez-vous faire ?","answers":["Refuser de répondre : ces questions sont discriminatoires et je peux saisir le Défenseur des droits"],"distractors":["Répondre franchement : un recruteur a le droit de poser toutes les questions qu'il souhaite à un candidat","Répondre, car refuser de répondre serait considéré comme une faute qui m'empêcherait d'être embauché","Quitter l'entretien sans rien dire : la loi ne permet aucun recours contre un recruteur qui pose ces questions"],"explanation":"Un recruteur ne peut poser que des questions liées à l'emploi. Interroger sur la religion ou la vie privée est discriminatoire, et le Défenseur des droits peut être saisi.","why":["Les questions doivent avoir un lien avec l'emploi proposé.","Un candidat n'est pas obligé de répondre à des questions sans lien avec l'emploi.","Un recours existe : on peut saisir le Défenseur des droits ou porter plainte."],"explanationEasy":"Un recruteur pose des questions sur le travail seulement. La religion et la famille sont privées. Tu peux refuser de répondre et appeler le Défenseur des droits.","whyEasy":["Les questions doivent parler du travail.","Tu n'es pas obligé de répondre à ces questions.","Tu peux demander de l'aide au Défenseur des droits."]},{"id":1002,"question":"Le jour d'une élection, votre conjoint veut absolument savoir pour qui vous votez et vous demande de lui montrer votre bulletin. Que répondez-vous ?","answers":["Que le vote est secret et que je choisis librement, sans avoir à me justifier"],"distractors":["Que je dois lui montrer mon bulletin, car les couples mariés votent toujours ensemble","Que je peux lui montrer mon choix, mais seulement à l'intérieur de l'isoloir","Que je dois voter comme lui, car la loi demande de suivre l'avis de sa famille"],"explanation":"Le vote est secret et libre : personne ne peut obliger un électeur à dire ou à montrer son choix. L'isoloir sert à protéger ce secret.","why":["Aucune règle ne demande aux couples de voter ensemble.","Le secret ne dépend pas du lieu : personne n'a le droit d'exiger de voir le bulletin.","La loi ne demande jamais de voter comme un proche : le vote est libre."],"explanationEasy":"Le vote est secret. Personne ne peut te forcer à dire ton choix. Tu votes comme tu veux.","whyEasy":["Aucune règle ne dit que les couples votent ensemble. Chacun choisit seul.","Personne n'a le droit de voir ton bulletin.","La loi ne te force pas à voter comme un proche."]},{"id":1003,"question":"Vous êtes inscrit sur les listes électorales mais vous serez en voyage le jour d'une élection. Comment pouvez-vous quand même voter ?","answers":["En donnant procuration à une personne de confiance, qui votera à ma place"],"distractors":["En envoyant mon bulletin par la poste à la mairie quelques jours avant","En demandant à un ami de voter avec ma carte d'électeur, sans autre démarche","Je ne peux pas voter : être absent le jour de l'élection fait perdre le droit de vote"],"explanation":"La procuration permet de confier son vote à un autre électeur de confiance. Elle se demande sur maprocuration.gouv.fr, puis se valide en personne au commissariat ou à la gendarmerie (ou avec l'application France Identité).","why":["Le vote par courrier postal n'est pas possible pour un électeur ordinaire en France.","Il faut une procuration officielle : on ne peut pas voter avec la carte d'un autre.","Le droit de vote n'est pas perdu : la procuration existe pour ce cas."],"explanationEasy":"La procuration permet à une personne de confiance de voter pour toi. Tu la demandes sur maprocuration.gouv.fr. Ensuite, tu la valides à la police ou à la gendarmerie.","whyEasy":["Un électeur ne vote pas par la poste. Il vote sur place ou par procuration.","Tu ne peux pas voter avec la carte d'une autre personne.","Tu gardes ton droit de vote. La procuration sert dans ce cas."]},{"id":1004,"question":"À la mairie, l'agent qui vous accueille porte un grand collier avec un signe religieux bien visible. Est-ce autorisé ?","answers":["Non : les agents du service public doivent rester neutres et ne pas afficher leurs convictions"],"distractors":["Oui : chaque agent est libre d'afficher sa religion et ses convictions pendant son travail","Oui, mais seulement si le maire a donné son accord personnel et écrit à l'agent concerné","Non, car la loi interdit à tous les citoyens de porter un signe religieux en public, partout"],"explanation":"Les agents du service public sont tenus à la neutralité : ils ne manifestent pas leurs croyances. Les usagers, eux, restent libres de porter des signes religieux dans la rue.","why":["La liberté de religion est protégée, mais les agents publics ont une obligation de neutralité.","Le maire ne peut pas autoriser ce que la neutralité du service public interdit.","Cette règle vise les agents du service public, pas tous les citoyens dans la rue."],"explanationEasy":"Un agent public est neutre. Il ne montre pas sa religion au travail. Dans la rue, chacun est libre de porter un signe religieux.","whyEasy":["Les agents publics doivent rester neutres.","Le maire ne peut pas changer cette règle.","La règle est pour les agents, pas pour tous les citoyens."]},{"id":1005,"question":"Votre fille entre au collège public. Une camarade arrive en classe avec un grand voile qui couvre ses cheveux. Que dit la loi ?","answers":["Dans un collège public, les élèves ne peuvent pas porter de signe religieux ostensible (bien visible)"],"distractors":["Tous les signes religieux sont autorisés pour les élèves, même pendant les cours et les examens","Seuls les signes religieux très discrets sont interdits, les signes bien visibles sont autorisés","Le port de signes religieux est autorisé si les parents ont donné leur accord écrit à l'école"],"explanation":"La loi de 2004 interdit aux élèves des écoles, collèges et lycées publics de porter des signes ou tenues manifestant ostensiblement une appartenance religieuse. Les signes discrets restent permis.","why":["La loi de 2004 interdit les signes ostensibles à l'école publique.","C'est l'inverse : ce sont les signes visibles (ostensibles) qui sont interdits.","L'accord des parents ne change pas la loi, qui s'applique à tous."],"explanationEasy":"Une loi de 2004 interdit les signes religieux bien visibles à l'école, au collège et au lycée publics. Les signes discrets sont permis.","whyEasy":["La loi de 2004 interdit ces signes à l'école publique.","Ce sont les signes bien visibles qui sont interdits.","L'accord des parents ne change pas la loi."]},{"id":1006,"question":"Un collègue critique violemment les idées d'une religion pendant une discussion, sans insulter personne. Est-ce interdit par la loi ?","answers":["Non : on peut critiquer une religion, mais pas insulter ni menacer les personnes qui la pratiquent"],"distractors":["Oui : la loi interdit toute critique d'une religion, quelle qu'elle soit, dans tous les lieux","Oui : critiquer une religion est un délit de blasphème puni de prison par la loi française","Non, et on peut aussi insulter les croyants, car la liberté d'expression est sans aucune limite"],"explanation":"En France, le blasphème n'est pas un délit : on peut critiquer les religions. Mais injurier, menacer ou inciter à la haine contre des personnes à cause de leur religion est puni.","why":["La loi protège les croyants, mais pas les idées contre la critique.","Il n'existe pas de délit de blasphème en France.","La liberté d'expression a des limites : l'injure et l'appel à la haine sont punis."],"explanationEasy":"On a le droit de critiquer une religion. On n'a pas le droit d'insulter ou de menacer des personnes à cause de leur religion.","whyEasy":["La loi protège les personnes, pas les idées.","Le blasphème n'est pas un délit en France.","L'injure et l'appel à la haine sont punis."]},{"id":1007,"question":"Après avoir vu votre nom, un propriétaire refuse de vous louer son appartement en disant qu'il ne veut « pas de gens de cette origine ». Que pouvez-vous faire ?","answers":["Saisir le Défenseur des droits ou porter plainte : c'est une discrimination interdite par la loi"],"distractors":["Rien : un propriétaire choisit librement son futur locataire, pour n'importe quelle raison qu'il souhaite","Exiger qu'il me loue le logement, car un propriétaire doit accepter le premier visiteur qui se présente","Changer de ville, car la loi ne protège pas les personnes qui cherchent un logement à louer"],"explanation":"Refuser de louer à cause de l'origine, de la religion, du sexe ou du handicap est une discrimination punie par la loi. On peut porter plainte ou saisir le Défenseur des droits.","why":["Le propriétaire est libre de son choix, mais il ne peut pas discriminer.","Il n'est pas obligé de louer au premier venu, mais il ne peut pas refuser pour une raison discriminatoire.","La loi protège aussi les candidats à une location."],"explanationEasy":"Refuser un logement à cause de l'origine est interdit. C'est une discrimination. Tu peux porter plainte ou appeler le Défenseur des droits.","whyEasy":["Un propriétaire ne peut pas discriminer.","Il peut choisir, mais pas pour une raison discriminatoire.","La loi protège aussi les personnes qui cherchent un logement."]},{"id":1008,"question":"Un ami est placé en garde à vue par la police. Quels sont ses droits ?","answers":["Faire prévenir un proche, voir un médecin et être assisté d'un avocat dès le début de la garde à vue"],"distractors":["Il n'a aucun droit tant que la police n'a pas terminé son enquête et présenté le dossier au juge","Il peut voir un avocat uniquement après 24 heures de garde à vue, et pas avant la fin de ce délai","Il doit attendre l'accord d'un juge pour faire prévenir un membre de sa famille ou son employeur"],"explanation":"La personne en garde à vue a des droits dès le début : être informée de ses droits, faire prévenir un proche, voir un médecin et être assistée d'un avocat.","why":["La loi donne des droits immédiats à la personne gardée à vue.","Le droit à l'avocat existe dès le début ; seul le procureur peut, très exceptionnellement, en différer l'intervention.","Aucun accord préalable d'un juge n'est nécessaire : c'est un droit que seul le procureur peut exceptionnellement retarder."],"explanationEasy":"En garde à vue, on a des droits dès le début. On peut prévenir un proche, voir un médecin et demander un avocat.","whyEasy":["Les droits existent dès le début.","L'avocat peut venir dès le début.","On n'a pas besoin d'un juge pour prévenir sa famille."]},{"id":1009,"question":"Votre employeur ne vous a pas payé votre salaire depuis deux mois. Que pouvez-vous faire ?","answers":["Lui écrire pour réclamer mon salaire, puis saisir le conseil de prud'hommes s'il ne paie pas"],"distractors":["Attendre en silence : un salarié n'a pas le droit de réclamer son salaire à son employeur","Saisir directement le tribunal de commerce, qui juge les conflits de travail entre salariés et patrons","Demander au maire de la commune d'obliger l'employeur à payer immédiatement les salaires dus"],"explanation":"Un salaire impayé se réclame d'abord par écrit. Si l'employeur ne paie pas, on peut saisir le conseil de prud'hommes, qui juge les conflits de travail. L'inspection du travail et les syndicats peuvent aider.","why":["Le salaire est dû : le salarié a le droit de le réclamer.","Le tribunal de commerce juge les litiges entre commerçants, pas les conflits de travail.","Le maire n'a pas le pouvoir de forcer un employeur à payer."],"explanationEasy":"Si ton patron ne paie pas ton salaire, écris-lui. Ensuite, tu peux aller aux prud'hommes. C'est le tribunal du travail.","whyEasy":["Tu as le droit de réclamer ton salaire.","Le tribunal de commerce ne juge pas le travail.","Le maire ne peut pas forcer un patron à payer."]},{"id":1010,"question":"Une banque refuse de vous ouvrir un compte bancaire. Que pouvez-vous faire ?","answers":["Demander à la Banque de France de désigner une banque : c'est le droit au compte"],"distractors":["Rien : une banque peut refuser n'importe quel client sans qu'aucun recours soit possible","Ouvrir un compte à la mairie de ma commune, qui joue le rôle de banque pour les habitants","Payer tous mes achats en espèces, car la loi ne prévoit aucune aide pour avoir un compte"],"explanation":"Toute personne a droit à un compte bancaire. Après un refus, la Banque de France désigne une banque, qui doit ouvrir un compte avec les services bancaires de base.","why":["Le droit au compte permet de contester ces refus.","Une mairie n'est pas une banque et n'ouvre pas de comptes bancaires.","La loi prévoit justement une aide : le droit au compte."],"explanationEasy":"Tout le monde a droit à un compte en banque. Si les banques refusent, la Banque de France choisit une banque pour toi.","whyEasy":["Tu peux contester le refus avec le droit au compte.","Une mairie n'est pas une banque.","Une aide existe : le droit au compte."]},{"id":1011,"question":"Votre propriétaire entre dans votre appartement en votre absence, avec sa propre clé, sans vous prévenir. A-t-il le droit de le faire ?","answers":["Non : le logement est le domicile du locataire, le propriétaire ne peut y entrer qu'avec son accord"],"distractors":["Oui : il reste propriétaire des murs et peut donc entrer chez son locataire quand il le souhaite","Oui, mais seulement le week-end ou en fin de journée, quand le locataire est absent du logement","Oui, à condition de laisser un mot dans la boîte aux lettres après sa visite dans le logement"],"explanation":"Le logement loué est le domicile du locataire, protégé par la loi. Le propriétaire ne peut y entrer qu'avec l'accord du locataire, même s'il garde un double des clés. Entrer sans accord peut être sanctionné pénalement (violation de domicile).","why":["Être propriétaire ne donne pas le droit d'entrer chez son locataire.","Aucun horaire ne permet d'entrer sans accord.","Prévenir après la visite ne rend pas l'entrée légale."],"explanationEasy":"Ton logement est ton domicile. Le propriétaire a besoin de ton accord pour entrer, même s'il a un double des clés. Sinon, il peut être puni.","whyEasy":["Être propriétaire ne suffit pas pour entrer.","Aucun jour ou horaire ne change la règle.","Prévenir après n'est pas suffisant."]},{"id":1012,"question":"Vous avez acheté un téléphone neuf il y a huit mois. Il tombe en panne alors que vous ne l'avez ni cassé ni mouillé. Que pouvez-vous demander au vendeur ?","answers":["Une réparation ou un remplacement gratuit, grâce à la garantie légale de conformité"],"distractors":["Rien : sans garantie payante achetée en plus, le vendeur n'a aucune obligation envers moi","Seulement un bon d'achat, car la loi n'oblige jamais le vendeur à réparer un produit","Le remboursement de tous mes achats chez ce vendeur au cours des deux dernières années"],"explanation":"La garantie légale de conformité s'applique automatiquement et gratuitement : pendant deux ans pour un bien neuf, le vendeur doit réparer ou remplacer le produit défectueux, au choix du consommateur en principe. Si c'est impossible, on peut obtenir une réduction du prix ou un remboursement.","why":["La garantie légale est gratuite : elle ne dépend pas d'une option payante.","La loi prévoit la réparation ou le remplacement, pas seulement un bon d'achat.","Le remboursement concerne le produit défectueux, pas tous les achats."],"explanationEasy":"Un produit neuf est protégé deux ans. Le vendeur doit le réparer ou le remplacer. C'est gratuit.","whyEasy":["La garantie légale est gratuite.","La loi prévoit une réparation ou un remplacement.","Seul le produit défectueux est concerné."]},{"id":1013,"question":"Vous recevez un courrier des impôts qui rappelle la date limite de déclaration. Vous avez eu des revenus cette année. Que devez-vous faire ?","answers":["Vérifier ou compléter ma déclaration avant la date limite, même si je ne paierai pas d'impôt"],"distractors":["Ne rien faire : on ne déclare ses revenus que si l'on a un impôt à payer à la fin de l'année","Déclarer mes revenus seulement s'ils dépassent un million d'euros au cours de l'année","Faire ma déclaration à la mairie de ma commune, qui collecte l'impôt pour l'État"],"explanation":"Chaque année, les revenus doivent être déclarés aux impôts, même si l'on ne paie pas d'impôt. Si votre déclaration est préremplie ou automatique, vous devez la vérifier et la compléter si besoin avant la date limite.","why":["Il faut déclarer même si le résultat est un impôt à zéro.","Aucun seuil de ce type n'existe : les revenus doivent être déclarés quel que soit leur montant.","La déclaration se fait auprès de l'administration fiscale, pas à la mairie."],"explanationEasy":"Chaque année, on déclare ses revenus aux impôts, même si on ne paie pas d'impôt. Si ta déclaration est déjà remplie, vérifie-la avant la date limite.","whyEasy":["Il faut déclarer même sans impôt à payer.","Les revenus se déclarent quel que soit leur montant.","On déclare aux impôts, pas à la mairie."]},{"id":1014,"question":"Vous êtes convoqué pour être juré à la cour d'assises. Vous avez été tiré au sort. Que devez-vous faire ?","answers":["Me rendre à la convocation : c'est un devoir de citoyen, sauf motif valable de dispense"],"distractors":["Ignorer la lettre : seuls les magistrats de métier peuvent juger les crimes en France","Refuser sans donner de raison : participer à la justice est une simple option pour les citoyens","Payer une amende pour être dispensé de la convocation, quelle que soit la raison"],"explanation":"Les jurés sont des citoyens tirés au sort sur les listes électorales. Être juré est une obligation civique : on ne peut s'en dispenser que pour un motif valable (maladie, par exemple).","why":["Des citoyens participent aux jugements d'assises, aux côtés de magistrats.","Un refus sans motif valable peut être puni d'une amende.","On ne peut pas échapper à ce devoir en payant : il faut un motif reconnu."],"explanationEasy":"Les jurés sont tirés au sort. C'est un devoir de citoyen. Tu peux refuser seulement avec une bonne raison, comme la maladie.","whyEasy":["Des citoyens jugent avec des magistrats.","Refuser sans raison peut être puni.","Payer ne permet pas d'échapper à ce devoir."]},{"id":1015,"question":"Vous entendez souvent des cris et des coups à travers le mur : votre voisine semble victime de violences de son conjoint. Que faites-vous ?","answers":["J'appelle le 17 en cas de danger immédiat et je lui indique le 3919 pour obtenir de l'aide"],"distractors":["Je ne fais rien : ce qui se passe à l'intérieur d'un couple ne regarde jamais la loi ni la police","J'attends qu'elle porte plainte elle-même avant d'appeler qui que ce soit, même en cas de cris","Je vais sonner chez eux pour régler moi-même le problème avec le conjoint de ma voisine"],"explanation":"Les violences conjugales sont un délit. En cas de danger immédiat, on appelle le 17 (police, gendarmerie) ou le 112. Le 3919 est un numéro d'écoute gratuit pour les victimes.","why":["La loi punit les violences, y compris dans un couple.","On peut alerter les secours soi-même, sans attendre une plainte.","Intervenir seul est dangereux : il vaut mieux alerter la police."],"explanationEasy":"Les violences dans un couple sont interdites. En cas de danger, appelle le 17. Le 3919 est un numéro gratuit pour aider les victimes.","whyEasy":["La loi punit les violences dans le couple.","Tu peux appeler sans attendre une plainte.","Intervenir seul est dangereux."]},{"id":1016,"question":"Vous êtes un homme et vous apprenez qu'une collègue gagne moins que vous pour le même poste, les mêmes compétences et la même ancienneté. Que dit la loi ?","answers":["L'égalité de salaire est obligatoire : elle peut saisir l'inspection du travail ou le Défenseur des droits"],"distractors":["Les hommes peuvent légalement gagner plus, car ils travaillent plus souvent à temps plein que les femmes","Cela dépend du directeur de l'entreprise, qui fixe librement les salaires selon le sexe de chaque salarié","La loi interdit seulement les écarts de salaire très importants, supérieurs à 50 % du salaire"],"explanation":"À travail égal ou de valeur égale, la rémunération doit être la même pour les femmes et pour les hommes. Une salariée peut saisir l'inspection du travail, les prud'hommes ou le Défenseur des droits.","why":["Un écart de salaire fondé sur le sexe n'est jamais justifié pour un même travail ; le temps plein ne justifie pas de payer moins l'heure.","Aucune règle ne permet de fixer des salaires inégaux selon le sexe.","Aucun seuil de ce genre n'existe dans la loi."],"explanationEasy":"À travail égal, le salaire doit être égal pour les femmes et les hommes. Ta collègue peut demander de l'aide à l'inspection du travail.","whyEasy":["Pour le même travail, le sexe ne justifie aucun écart de salaire.","Le sexe ne peut pas décider du salaire.","La loi ne fixe aucun seuil de ce type."]},{"id":1017,"question":"Dans votre entreprise, vos collègues décident de faire grève pour demander de meilleurs salaires. Vous voulez participer. Que dit la loi ?","answers":["Le droit de grève est reconnu : l'employeur ne peut pas me sanctionner pour avoir fait grève"],"distractors":["La grève est interdite dans les entreprises privées : elle est réservée aux fonctionnaires","Je peux faire grève, mais mon employeur a le droit de me licencier dès le premier jour de grève","Je dois d'abord demander l'autorisation du préfet du département pour avoir le droit de faire grève"],"explanation":"Le droit de grève est garanti par la Constitution. Un salarié gréviste ne peut pas être sanctionné ou licencié pour avoir fait grève, sauf faute lourde. Les jours de grève ne sont pas payés.","why":["Le droit de grève s'applique aussi aux salariés du privé.","Licencier un salarié parce qu'il fait grève est interdit, sauf faute lourde.","Aucune autorisation du préfet n'est nécessaire."],"explanationEasy":"Le droit de grève existe. Ton patron ne peut pas te punir parce que tu fais grève, sauf si tu commets une faute très grave. Les jours de grève ne sont pas payés.","whyEasy":["La grève est permise aussi dans le privé.","On ne peut pas être licencié pour avoir fait grève.","Tu n'as pas besoin d'autorisation."]},{"id":1018,"question":"Avec des voisins, vous voulez créer une association pour organiser des fêtes de quartier. Quelles sont les règles ?","answers":["Vous êtes libres de la créer ; la déclarer en préfecture lui donne une existence légale"],"distractors":["Il faut d'abord obtenir l'autorisation du maire, qui peut la refuser sans donner de justification","Il faut réunir au moins cent membres fondateurs avant de pouvoir créer l'association","Seuls les citoyens français et les électeurs inscrits ont le droit de créer une association"],"explanation":"La liberté d'association est garantie par la loi de 1901 : deux personnes suffisent pour créer une association, y compris des étrangers. Elle acquiert une existence légale après sa déclaration en préfecture et sa publication au Journal officiel. En Alsace-Moselle, les règles diffèrent.","why":["Aucune autorisation du maire n'est nécessaire.","La loi ne fixe aucun minimum de cent membres : en pratique, deux personnes suffisent.","Les étrangers aussi peuvent créer une association."],"explanationEasy":"On est libre de créer une association. En pratique, deux personnes suffisent. On la déclare à la préfecture pour qu'elle existe légalement.","whyEasy":["Le maire n'a pas à donner d'autorisation.","Il n'y a pas de minimum de cent membres.","Les étrangers peuvent aussi créer une association."]},{"id":1019,"question":"Votre association veut organiser une manifestation sur la voie publique dans votre ville. Que devez-vous faire ?","answers":["Faire une déclaration préalable auprès des autorités (mairie ou préfecture) avant la manifestation"],"distractors":["Rien : une manifestation est libre de droit et n'a jamais besoin d'être déclarée à l'avance aux autorités","Demander l'autorisation écrite de tous les habitants du quartier concerné par le parcours","Attendre que la police vous convoque pour en parler avant de commencer la manifestation"],"explanation":"Le droit de manifester est protégé, mais une manifestation sur la voie publique doit être déclarée à l'avance (3 à 15 jours francs avant) à la mairie ou à la préfecture, qui peut l'interdire si elle menace l'ordre public.","why":["Une déclaration préalable est obligatoire sur la voie publique.","L'accord des habitants n'est pas demandé par la loi.","C'est à l'organisateur de faire la déclaration, avant la manifestation."],"explanationEasy":"On a le droit de manifester. Mais il faut prévenir la mairie ou la préfecture 3 à 15 jours avant. Elle peut interdire si c'est dangereux.","whyEasy":["Il faut déclarer la manifestation.","Les habitants n'ont pas à donner leur accord.","C'est à toi de prévenir avant."]},{"id":1020,"question":"Un ami vous dit que votre fils de 9 ans n'est pas obligé d'être instruit. Qu'en pensez-vous ?","answers":["Il se trompe : l'instruction est obligatoire pour tous les enfants de 3 à 16 ans"],"distractors":["Il a raison : l'école n'est obligatoire que jusqu'à l'âge de 8 ans, ensuite c'est facultatif","Il a raison : l'école n'est obligatoire que pour les enfants de nationalité française","Il se trompe : l'instruction est obligatoire pour tous les enfants de 6 à 21 ans"],"explanation":"L'instruction est obligatoire pour tous les enfants, français ou étrangers, de 3 à 16 ans. Elle se fait à l'école, ou exceptionnellement en famille avec une autorisation.","why":["L'obligation va jusqu'à 16 ans.","Elle concerne tous les enfants vivant en France, quelle que soit leur nationalité.","L'obligation commence à 3 ans et se termine à 16 ans."],"explanationEasy":"L'école est obligatoire de 3 à 16 ans. Elle est obligatoire pour tous les enfants, français ou étrangers.","whyEasy":["L'obligation va jusqu'à 16 ans.","Elle concerne aussi les enfants étrangers.","Elle commence à 3 ans et finit à 16 ans."]},{"id":1021,"question":"Vous venez de déménager dans une autre ville et vous voulez voter aux prochaines élections. Que devez-vous faire ?","answers":["Vous inscrire sur les listes électorales de votre nouvelle commune, en mairie ou en ligne"],"distractors":["Rien : l'inscription se fait automatiquement dans la nouvelle ville dès le déménagement","Attendre d'avoir habité cinq ans dans la nouvelle commune avant de pouvoir y voter","Demander une autorisation à la préfecture pour être autorisé à changer de bureau de vote"],"explanation":"Pour voter, il faut être inscrit sur les listes électorales de la commune où l'on habite. Après un déménagement, on demande son inscription en mairie ou en ligne sur service-public.fr.","why":["Un déménagement ne change pas l'inscription tout seul : il faut la demander.","Il n'y a pas de durée minimale quand on a son domicile dans la commune : on peut s'inscrire tout de suite.","Aucune autorisation de la préfecture n'est nécessaire : l'inscription se demande en mairie ou en ligne."],"explanationEasy":"Pour voter, il faut être inscrit sur les listes de sa commune. Après un déménagement, tu t'inscris en mairie ou sur Internet.","whyEasy":["Tu dois faire la demande toi-même.","Il n'y a pas de durée minimale.","La préfecture n'a pas à donner d'autorisation."]},{"id":1022,"question":"Dans la rue, une personne âgée tombe et ne répond plus. Les passants continuent leur chemin. Que devez-vous faire ?","answers":["Appeler les secours (15, 18 ou 112) : c'est une obligation légale, puis rester près d'elle si possible"],"distractors":["Rien : chacun s'occupe de ses affaires, et la loi ne demande jamais d'aider un inconnu","Attendre qu'un policier passe par hasard, sans appeler personne d'autre pendant ce temps","La déplacer rapidement sans précaution, car appeler les secours est interdit aux particuliers"],"explanation":"La non-assistance à personne en danger est un délit. Il faut alerter les secours : 15 (SAMU), 18 (pompiers) ou 112 (numéro européen), et rester auprès de la victime si possible.","why":["La loi punit celui qui ne porte pas secours quand il peut le faire sans risque.","Il faut alerter soi-même les secours, sans attendre.","Tout le monde peut appeler les secours ; déplacer la personne peut aggraver son état."],"explanationEasy":"Il faut aider une personne en danger. Appelle le 15, le 18 ou le 112. Reste près de la personne.","whyEasy":["La loi punit ceux qui n'aident pas.","Appelle toi-même les secours.","Tout le monde peut appeler. Ne déplace pas la personne."]},{"id":1023,"question":"Sur un réseau social, vous voyez un message qui insulte des personnes à cause de leur origine. Que pouvez-vous faire ?","answers":["Signaler le message à la plateforme et sur Pharos ; une personne visée peut aussi porter plainte"],"distractors":["Rien : tout est permis sur Internet, car ce que l'on y écrit n'a pas de conséquences dans la vraie vie","Répondre avec des insultes du même genre pour défendre les personnes visées par le message","Écrire au maire de ma commune pour lui demander de faire supprimer le message du réseau social"],"explanation":"Les injures racistes en ligne sont punies comme dans la vie réelle. On peut les signaler à la plateforme et à Pharos, le site officiel de signalement. Une personne insultée peut aussi porter plainte.","why":["Les lois s'appliquent aussi sur Internet.","Répondre par des insultes est aussi puni et ne règle rien.","Le maire n'a pas de pouvoir sur les messages des réseaux sociaux."],"explanationEasy":"Les insultes racistes sont interdites aussi sur Internet. Tu peux les signaler sur le site Pharos ou à la plateforme. Une personne insultée peut aussi porter plainte.","whyEasy":["Les lois s'appliquent sur Internet.","Répondre par des insultes est interdit aussi.","Le maire ne peut pas supprimer un message."]},{"id":1024,"question":"Une amie de 20 ans vous confie que sa famille veut la marier de force avec un homme qu'elle n'a pas choisi. Que lui dites-vous ?","answers":["Que le mariage est libre : la forcer est un délit, et la police ou des associations peuvent l'aider"],"distractors":["Que la famille a le droit de choisir, car les parents décident toujours du mariage de leurs enfants","Que la loi ne s'applique pas à l'intérieur d'une famille, mais seulement dans l'espace public","Qu'elle doit accepter, car obéir à sa famille est un devoir qui passe avant ses propres choix"],"explanation":"Le mariage repose sur le libre consentement des deux époux. Forcer quelqu'un à se marier est un délit puni par la loi. La victime peut demander de l'aide à la police, à la gendarmerie ou à des associations.","why":["Les parents ne peuvent pas choisir le conjoint à la place de leur enfant : le mariage exige le consentement libre de chacun des époux.","La loi s'applique aussi à l'intérieur des familles.","Le mariage est un choix libre, pas un devoir imposé."],"explanationEasy":"Le mariage doit être un choix libre. Forcer quelqu'un à se marier est interdit. Ton amie peut demander de l'aide à la police ou à une association.","whyEasy":["Le mariage a besoin du consentement libre de chaque époux.","La loi s'applique aussi dans la famille.","Le mariage est un choix libre."]},{"id":1025,"question":"Votre enfant de 5 ans fait une grosse bêtise. Un proche vous dit qu'une bonne fessée est normale. Que dit la loi ?","answers":["Les violences physiques sur un enfant sont interdites, même pour l'éduquer, y compris la fessée"],"distractors":["La fessée est autorisée, car les parents ont tous les droits pour éduquer leur enfant comme ils le veulent","Seules les gifles sont interdites, alors que la fessée et les petites tapes restent permises","La loi interdit la fessée seulement à partir de l'âge de dix ans, pas avant cet âge"],"explanation":"Depuis la loi du 10 juillet 2019, le Code civil (article 371-1) dit que l'autorité parentale s'exerce sans violences physiques ou psychologiques. Cela concerne les violences éducatives ordinaires : fessée, gifle, humiliation.","why":["Les parents n'ont pas le droit d'utiliser la violence pour éduquer.","La fessée et les tapes sont aussi concernées par l'interdiction.","Il n'y a pas d'âge minimum : la règle protège tous les enfants."],"explanationEasy":"La loi interdit de frapper un enfant, même pour l'éduquer. La fessée est interdite aussi.","whyEasy":["Les parents ne peuvent pas frapper leur enfant.","La fessée est aussi interdite.","La règle protège les enfants de tout âge."]},{"id":1026,"question":"Vous voulez adhérer à un syndicat. Votre chef vous dit qu'il vous licenciera si vous le faites. Est-ce légal ?","answers":["Non : la liberté syndicale est garantie, on ne peut pas être sanctionné pour avoir adhéré"],"distractors":["Oui : l'employeur a le droit d'interdire tous les syndicats dans son entreprise privée","Oui, mais seulement pendant la première année passée dans l'entreprise par le salarié","Non, mais seulement si l'entreprise compte plus de mille salariés dans toute la France"],"explanation":"Tout salarié peut adhérer au syndicat de son choix. L'employeur ne peut pas tenir compte de l'appartenance syndicale pour sanctionner ou licencier : c'est une discrimination interdite (articles L2141-5 et L1132-1 du Code du travail).","why":["L'employeur ne peut pas interdire l'action syndicale.","La protection s'applique dès l'embauche, sans condition d'ancienneté.","La liberté syndicale existe dans toutes les entreprises, quelle que soit leur taille."],"explanationEasy":"Tu peux adhérer à un syndicat. Ton patron ne peut pas te punir pour cela. C'est interdit.","whyEasy":["Un patron ne peut pas interdire les syndicats.","La règle s'applique dès l'embauche.","Elle s'applique dans toutes les entreprises."]},{"id":1027,"question":"Dans la rue, un policier en uniforme vous demande de justifier de votre identité. Que devez-vous faire ?","answers":["Justifier de mon identité, de préférence avec ma carte d'identité ou mon passeport"],"distractors":["Refuser, car un policier n'a jamais le droit de contrôler quelqu'un dans la rue","Ne répondre que si un juge est présent sur place pendant tout le contrôle d'identité","Donner seulement mon prénom et mon âge, sans présenter aucun document officiel"],"explanation":"Dans les cas prévus par la loi, les forces de l'ordre peuvent contrôler l'identité d'une personne. Il faut alors la justifier, par tout moyen. En cas de refus, la personne peut être retenue pour vérification.","why":["La loi permet les contrôles d'identité dans certains cas.","La présence d'un juge n'est pas nécessaire.","Un prénom ne prouve pas une identité : il faut un document ou une preuve."],"explanationEasy":"Dans certains cas prévus par la loi, la police peut contrôler ton identité. Tu dois prouver qui tu es, par exemple avec ta carte d'identité. Si tu refuses, la police peut te garder 4 heures au maximum.","whyEasy":["La police peut contrôler dans certains cas.","Un juge n'est pas nécessaire.","Un prénom ne suffit pas."]},{"id":1028,"question":"Votre voisin met de la musique très forte chaque nuit et vous empêche de dormir. Quelle est la meilleure démarche ?","answers":["Lui en parler calmement d'abord ; si cela continue, passer par un conciliateur ou prévenir la police"],"distractors":["Monter chez lui en pleine nuit pour le menacer, afin qu'il comprenne qu'il doit arrêter","Faire à mon tour du bruit toute la nuit pour lui rendre la pareille et lui faire comprendre","Ne rien faire : le bruit de voisinage n'est jamais puni par la loi, même s'il dure toute la nuit"],"explanation":"Le bruit qui trouble la tranquillité des voisins, surtout la nuit (de 22 h à 7 h), peut être puni d'une amende. On commence par discuter, puis on peut passer par un conciliateur de justice (gratuit), le bailleur ou la police.","why":["Les menaces sont interdites et risquent d'aggraver le conflit.","Répondre par du bruit crée un nouveau conflit et peut être puni aussi.","Le tapage nocturne peut être puni d'une amende."],"explanationEasy":"Parle d'abord calmement à ton voisin. Si le bruit continue, tu peux appeler un conciliateur ou la police.","whyEasy":["Menacer est interdit.","Faire du bruit en retour crée un nouveau conflit. Tu peux aussi être puni.","Le bruit la nuit peut être puni."]},{"id":1029,"question":"Un collègue vous annonce qu'il vient de changer de religion et que ses proches le rejettent. La loi l'autorise-t-elle à le faire ?","answers":["Oui : la liberté de conscience permet de croire, de ne pas croire ou de changer de religion"],"distractors":["Non : on est obligé de garder toute sa vie la religion dans laquelle on a été élevé","Oui, mais seulement après avoir obtenu l'accord écrit du maire de sa commune de résidence","Non : il doit déclarer sa religion à l'administration, et ce choix ne peut plus être modifié"],"explanation":"La liberté de conscience garantit à chacun le droit de croire, de ne pas croire ou de changer de religion. Personne ne peut être forcé à pratiquer ou à abandonner une religion.","why":["La religion est un choix personnel, pas un héritage obligatoire.","Aucune autorisation du maire n'est nécessaire.","L'État ne demande pas aux personnes de déclarer leur religion."],"explanationEasy":"Chacun est libre de croire, de ne pas croire ou de changer de religion. Personne ne peut t'obliger.","whyEasy":["La religion est un choix personnel.","Personne ne doit donner d'autorisation.","L'État ne demande pas ta religion."]},{"id":1030,"question":"Vous pensez qu'une administration vous a mal traité et vous n'obtenez aucune réponse. Qui peut vous aider gratuitement ?","answers":["Le Défenseur des droits, que toute personne peut saisir gratuitement"],"distractors":["Le Conseil constitutionnel, que chaque citoyen peut saisir directement","Le Sénat, qui traite les réclamations individuelles des citoyens","Le président de la République, qui répond à tous les courriers"],"explanation":"Le Défenseur des droits est une autorité indépendante. Toute personne peut le saisir gratuitement en cas de difficulté avec une administration, de discrimination ou pour défendre les droits de l'enfant.","why":["Un citoyen ne peut pas saisir directement le Conseil constitutionnel.","Le Sénat vote les lois et contrôle le gouvernement ; il ne traite pas les réclamations.","Le président ne répond pas à tous les courriers individuels."],"explanationEasy":"Le Défenseur des droits aide gratuitement. Tu peux l'appeler pour un problème avec une administration ou une discrimination.","whyEasy":["Un citoyen ne saisit pas directement le Conseil constitutionnel.","Le Sénat ne traite pas les réclamations.","Le président ne répond pas à chaque courrier."]},{"id":1031,"question":"Votre voisin allemand vit à Lyon. À quelles élections peut-il voter s'il s'inscrit sur les listes électorales complémentaires ?","answers":["Aux élections municipales et aux élections européennes"],"distractors":["À toutes les élections, comme un citoyen français","Seulement à l'élection présidentielle et aux élections législatives","À aucune élection : seuls les Français votent en France"],"explanation":"Les citoyens de l'Union européenne qui vivent en France peuvent voter aux élections municipales et européennes, après inscription sur une liste électorale complémentaire. Les autres élections sont réservées aux Français.","why":["Les autres élections (présidentielle, législatives…) sont réservées aux Français.","La présidentielle et les législatives sont réservées aux citoyens français.","Les citoyens européens peuvent voter aux municipales et aux européennes."],"explanationEasy":"Un citoyen de l'Union européenne peut voter aux élections municipales et européennes. Il doit s'inscrire sur une liste spéciale.","whyEasy":["Les autres élections sont pour les Français.","La présidentielle et les législatives sont pour les Français.","Il peut voter aux municipales et aux européennes."]},{"id":1032,"question":"Un ami vous demande si l'on peut se promener dans la rue avec le visage entièrement caché (cagoule, voile intégral…). Que répondez-vous ?","answers":["Non : depuis 2010, la loi interdit de dissimuler son visage dans l'espace public, sauf exceptions"],"distractors":["Oui : c'est autorisé partout dans l'espace public, car chacun est libre de s'habiller comme il veut","Non, mais l'interdiction ne concerne que les écoles, les collèges et les lycées publics","Oui, mais seulement pour les femmes, car la loi ne concerne que les vêtements féminins"],"explanation":"Depuis la loi du 11 octobre 2010 (appliquée depuis avril 2011), il est interdit de dissimuler son visage dans l'espace public. Des exceptions existent : raisons de santé ou professionnelles, activités sportives, fêtes ou manifestations artistiques ou traditionnelles.","why":["La loi de 2010 interdit de se cacher le visage dans l'espace public.","L'interdiction vaut dans toute la rue et les lieux publics, pas seulement à l'école.","La règle est la même pour les femmes et pour les hommes."],"explanationEasy":"Depuis 2010, on ne peut pas cacher son visage dans la rue ni dans les lieux publics. Il y a quelques exceptions, par exemple pour la santé.","whyEasy":["La loi de 2010 l'interdit.","L'interdiction ne concerne pas seulement les écoles.","La règle est la même pour tout le monde."]},{"id":1033,"question":"Votre propriétaire vous dit que vous devez quitter votre appartement demain, sinon il changera les serrures. Peut-il le faire ?","answers":["Non : seul un juge peut ordonner une expulsion, et le propriétaire ne peut pas changer les serrures seul"],"distractors":["Oui : un propriétaire peut reprendre son logement à tout moment s'il en a besoin pour lui-même","Oui, à condition de prévenir son locataire au mo
