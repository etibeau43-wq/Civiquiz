<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A1F4D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Examen civique">
<title>Réviser l'examen civique</title>
<style>
:root{
  --paper:#EDF0F8; --card:#FFFFFF; --ink:#0A1F4D; --mut:#4A5A84; --line:#C5CEE4;
  --bleu:#0055A4; --rouge:#D80F1F; --ok:#17703A; --okbg:#E1F2E8; --kobg:#FCE6E8;
  --t0:#0055A4; --t1:#D80F1F; --t2:#0A1F4D; --t3:#4F86D3; --t4:#8E1B2B; --t5:#B86E00;
  --serif:Charter,"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0A1230; --card:#121E48; --ink:#EEF2FF; --mut:#9FB0DB; --line:#2A3A6E;
  --bleu:#6FA3FF; --rouge:#FF6670; --ok:#58D08F; --okbg:#10352A; --kobg:#3C1822;
  --t0:#6FA3FF; --t1:#FF6670; --t2:#C9D5FF; --t3:#8DB4F0; --t4:#FF9AA2; --t5:#F0B34A;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:6px;z-index:5;
  background:linear-gradient(90deg,var(--bleu) 0 33.34%,#fff 33.34% 66.67%,var(--rouge) 66.67% 100%);
  box-shadow:0 1px 0 var(--line)}
main{max-width:640px;margin:0 auto;padding:30px 16px 90px}
:focus-visible{outline:3px solid var(--bleu);outline-offset:3px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}

/* Typographie */
h1{font:700 clamp(2rem,9vw,2.7rem)/1.05 var(--serif);letter-spacing:-.01em;margin:6px 0 10px}
h2{font:700 1.3rem/1.2 var(--serif);margin:0 0 10px}
.mut{color:var(--mut);font-size:.92rem}
.lead{font:400 1.08rem/1.5 var(--serif);color:var(--mut);margin:0 0 22px;max-width:34em}
.sect{font:700 1.15rem/1.2 var(--serif);margin:30px 0 10px}

/* Boutons génériques */
.btn{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:13px 15px;margin:10px 0;
  transition:transform .08s ease,box-shadow .08s ease,border-color .08s}
.btn:hover:not(:disabled){border-color:var(--bleu);box-shadow:3px 3px 0 var(--bleu);transform:translate(-1px,-1px)}
.btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:none}
.btn:disabled{cursor:default}
.btn.primary:disabled{opacity:.5;box-shadow:none}
.btn.primary{background:var(--bleu);color:#fff;border-color:var(--ink);text-align:center;font-weight:700;box-shadow:4px 4px 0 var(--ink);padding:15px}
@media (prefers-color-scheme:dark){.btn.primary{color:#07122E;border-color:#EEF2FF;box-shadow:4px 4px 0 #EEF2FF}}
.btn.primary:hover:not(:disabled){box-shadow:6px 6px 0 var(--ink);border-color:var(--ink)}
.btn.primary:active:not(:disabled){box-shadow:1px 1px 0 var(--ink)}
.link{background:none;border:none;color:var(--bleu);padding:8px 0;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Accueil */
.ticket{background:var(--card);border:2px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--bleu);margin:0 0 6px}
.ticket .top{padding:18px 16px 14px}
.ticket .facts{display:flex;gap:0;border-top:2px dashed var(--line);margin:0}
.ticket .facts div{flex:1;padding:12px 10px;text-align:center;border-right:2px dashed var(--line)}
.ticket .facts div:last-child{border-right:0}
.ticket .facts b{display:block;font:700 1.5rem/1.1 var(--serif)}
.ticket .facts span{font-size:.82rem;color:var(--mut)}
.ticket .cta{padding:0 16px 18px}
.ticket .cta .btn{margin-bottom:0}
.pbar{display:block;position:relative;height:7px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:7px}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--tc)}
.pbar i.s{opacity:.35}
.theme .name small{display:block;font:400 .82rem/1.3 var(--sans);color:var(--mut);margin-top:2px}
.theme .name{min-width:0}
.ticket.daily{box-shadow:5px 5px 0 var(--rouge)}
.ticket.daily .top p{margin:0}
.ticket.daily .big{font:700 2.2rem/1 var(--serif)}
.switch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:12px 14px;margin:0 0 6px}
.switch .tg{flex:none;width:46px;height:26px;border:2px solid var(--ink);border-radius:13px;background:var(--paper);position:relative;transition:background .15s}
.switch .tg::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch[aria-checked="true"] .tg{background:var(--ok);border-color:var(--ok)}
.switch[aria-checked="true"] .tg::after{transform:translateX(20px);background:#fff}
.switch b{font-family:var(--serif);display:block}
.switch span.d{font-size:.85rem;color:var(--mut)}
.mode-link{display:block;margin:6px 0 0;font-size:.88rem}
.listen{display:inline-flex;align-items:center;gap:8px;width:auto;margin:4px 0 12px;padding:8px 12px;font-size:.9rem;font-weight:600;min-height:40px}
.listen svg{flex:none}
.listen[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.listen[aria-pressed="true"]:hover{box-shadow:none;transform:none}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--mut);margin:0 0 8px}
.themes{display:grid;gap:0}
.theme{display:flex;align-items:center;gap:14px;border-left:8px solid var(--tc);padding:13px 14px}
.theme .name{font:700 1.05rem/1.25 var(--serif);flex:1}
.theme .count{font-size:.85rem;color:var(--mut);white-space:nowrap}
.theme .chev{font-size:1.3rem;color:var(--mut);line-height:1}
.modes{display:grid;gap:0}
.modes .btn b{font-family:var(--serif);font-size:1.05rem}
.modes .btn span{display:block;font-size:.88rem;color:var(--mut)}
.modes .btn:disabled{opacity:.55}

/* Question : le bulletin */
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:38px}
.counter{font-weight:600;color:var(--mut)}
.timer{font:700 1.05rem/1 var(--serif);font-variant-numeric:tabular-nums;border:2px solid var(--ink);border-radius:4px;padding:6px 10px;background:var(--card)}
.timer.low{border-color:var(--rouge);color:var(--rouge)}
.bar{height:8px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0 16px}
.bar>i{display:block;height:100%;background:var(--bleu);transition:width .3s}
.ballot{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:18px 16px 8px;box-shadow:5px 5px 0 var(--bleu);margin:0 0 18px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:var(--mut)}
.badge::before{content:"";width:12px;height:12px;background:var(--tc);border-radius:2px}
.hint{margin:-8px 0 12px;font-size:.88rem;color:var(--mut);font-style:italic}
.q{font:700 clamp(1.3rem,5.6vw,1.6rem)/1.25 var(--serif);margin:10px 0 16px;letter-spacing:-.005em}
.choice{display:flex;align-items:center;gap:14px;min-height:58px;padding:11px 13px;font-size:1rem;line-height:1.35}
.choice .box{flex:none;width:30px;height:30px;border:2px solid var(--ink);border-radius:4px;background:var(--paper);display:grid;place-items:center;transition:background .12s,border-color .12s}
.choice svg{width:20px;height:20px;display:none;stroke:#fff;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.choice svg path{stroke-dasharray:26;stroke-dashoffset:26;animation:draw .32s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.ok .box{background:var(--ok);border-color:var(--ok)} .choice.ok .i-check{display:block}
.choice.ko{border-color:var(--rouge);background:var(--kobg)}
.choice.ko .box{background:var(--rouge);border-color:var(--rouge)} .choice.ko .i-cross{display:block}
.choice.picked{border-color:var(--bleu)}
.choice.picked .box{background:var(--bleu);border-color:var(--bleu)} .choice.picked .i-cross{display:block}
.choice:disabled:not(.ok):not(.ko):not(.picked){opacity:.62}
.choice:disabled{color:var(--ink)}

/* Retours */
.verdict{font:700 1.15rem/1.3 var(--serif);margin:4px 0 6px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--rouge)}
.also{margin:0 0 10px;font-size:.9rem;color:var(--mut)}
.note{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--bleu);border-radius:4px;padding:12px 14px;margin:12px 0}
.note p{margin:0 0 8px;font:400 1.02rem/1.55 var(--serif)}
.note .lbl{font-weight:700}
.note h3{font:700 .95rem/1.3 var(--sans);margin:10px 0 4px}
.note ul{margin:0;padding-left:18px}
.note li{margin:7px 0;font-size:.95rem}
.note li b{font-weight:700}
.you{color:var(--rouge);font-weight:600}

/* Résultat */
.result{background:var(--card);border:2px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--bleu);padding:20px 16px 8px;margin:10px 0 18px;position:relative;overflow:hidden}
.score{font:700 4.2rem/1 var(--serif);letter-spacing:-.02em}
.score small{font-size:1.6rem;color:var(--mut);font-weight:400}
.pct{margin:4px 0 14px;color:var(--mut)}
.stamp{position:absolute;right:12px;top:16px;transform:rotate(-7deg);border:3px double currentColor;border-radius:6px;padding:7px 12px;
  font:700 .82rem/1.15 var(--sans);letter-spacing:.09em;text-transform:uppercase;text-align:center;opacity:.92;
  animation:thump .45s cubic-bezier(.2,1.3,.4,1) .15s both;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){.stamp{mix-blend-mode:normal}}
.stamp.ok{color:var(--ok)} .stamp.ko{color:var(--rouge)} .stamp.neutral{color:var(--bleu)}
@keyframes thump{from{transform:rotate(-7deg) scale(1.7);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:.92}}
.tb{padding:9px 0;border-top:1.5px solid var(--line)}
.tb .l{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.tb .l b{font-family:var(--serif)}
.tb .t{height:8px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.tb .t i{display:block;height:100%;background:var(--tc)}
.review{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--rouge);border-radius:4px;padding:12px 14px;margin:10px 0}
.review .rq{font:700 1.05rem/1.3 var(--serif);margin:0 0 6px}
.review p{margin:3px 0}
.review .kn{font-size:.92rem;color:var(--mut);margin-top:6px}
.good{color:var(--ok);font-weight:600}
.perfect{font:700 1.2rem/1.3 var(--serif);color:var(--ok);margin:10px 0}

/* Fiches */
.flash{background:var(--card);border:2px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--bleu);padding:18px 16px;margin:14px 0 8px}
.flash .ans{font:700 1.15rem/1.4 var(--serif);color:var(--ok);margin:0 0 8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}

footer{margin-top:34px;padding-top:14px;border-top:2px solid var(--line);font-size:.8rem;color:var(--mut)}
footer p{margin:0 0 8px}
a{color:var(--bleu)}

@media (prefers-reduced-motion:reduce){
  .switch .tg,.switch .tg::after{transition:none}
  .choice svg path{animation:none;stroke-dashoffset:0}
  .stamp{animation:none}
  .btn,.bar>i{transition:none}
}
</style>
</head>

<script type="application/json" id="qdata">{"data":[{"theme":"Principes et valeurs de la République","questions":[{"id":1,"question":"Complétez les paroles de la Marseillaise \"Allons enfants de la patrie...\"","answers":["Le jour de gloire est arrivé"],"distractors":["Le jour de la victoire est arrivé","Le temps de la liberté est arrivé","Le jour de la liberté est arrivé"],"explanation":"Les paroles sont : « Allons enfants de la patrie, le jour de gloire est arrivé ! ». La Marseillaise est l'hymne national (article 2 de la Constitution).","why":["","",""],"explanationEasy":"La Marseillaise commence ainsi : « Allons enfants de la patrie, le jour de gloire est arrivé ! ». C'est l'hymne national (article 2 de la Constitution).","whyEasy":["","",""]},{"id":2,"question":"Dans le cadre d'un entretien d'embauche, que peut-on demander au candidat ?","answers":["Des questions sur ses compétences et son expérience professionnelle","Une preuve de l'autorisation de travail (titre de séjour en cours de validité)"],"distractors":["Sa religion et ses opinions politiques","Sa situation familiale et son projet d'avoir des enfants","L'origine et la nationalité de ses parents"],"explanation":"L'employeur ne peut poser que des questions liées à l'emploi : compétences, expérience, et droit de travailler en France. Interroger sur la religion, la vie privée ou l'origine est discriminatoire.","why":["La religion et les opinions politiques sont protégées : on ne peut pas les demander.","La vie familiale et le projet d'enfant relèvent de la vie privée.","L'origine ne peut pas être un critère d'embauche."],"explanationEasy":"L'employeur pose seulement des questions sur le travail. Il peut parler des compétences, de l'expérience et du droit de travailler en France. Demander la religion, la vie privée ou l'origine est de la discrimination.","whyEasy":["La religion et les opinions politiques sont protégées. On ne peut pas les demander.","La famille et le projet d'enfant font partie de la vie privée.","L'origine ne peut pas être un critère pour embaucher."]},{"id":3,"question":"Déclarer ses revenus aux services fiscaux est :","answers":["Une obligation pour tous les contribuables"],"distractors":["Un choix laissé à chaque contribuable","Une obligation réservée aux entrepreneurs et aux commerçants","Une démarche recommandée mais non obligatoire pour les salariés"],"explanation":"Chaque foyer fiscal doit déclarer ses revenus chaque année, même s'il ne paiera finalement pas d'impôt. Si la déclaration est préremplie ou automatique, il faut la vérifier.","why":["La déclaration n'est pas facultative.","Elle concerne tous les contribuables, pas seulement les entrepreneurs.","Elle est aussi obligatoire pour les salariés."],"explanationEasy":"Chaque foyer fiscal déclare ses revenus chaque année. Il doit le faire même s'il ne paie pas d'impôt à la fin.","whyEasy":["La déclaration n'est pas un choix. Elle est obligatoire.","Elle concerne tous les contribuables, pas seulement les entrepreneurs.","Elle est aussi obligatoire pour les salariés."]},{"id":4,"question":"En France, les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?","answers":["Ils financent les services publics (éducation, santé, sécurité) et le fonctionnement de l'État"],"distractors":["Ils servent uniquement à payer les salaires et les avantages des élus","Ils sont reversés chaque année aux citoyens sous forme de dons ou de primes","Ils financent uniquement les dépenses militaires et la police de l'État"],"explanation":"Les impôts financent les services publics (écoles, hôpitaux, justice, sécurité, routes…) et le fonctionnement de l'État.","why":["","","Ils financent bien plus que la défense : éducation, santé, justice, etc."],"explanationEasy":"Les impôts paient les services publics : écoles, hôpitaux, justice, sécurité, routes. Ils paient aussi le fonctionnement de l'État.","whyEasy":["","","Les impôts paient plus que l'armée et la police : école, santé, justice, etc."]},{"id":5,"question":"La liberté d'association est :","answers":["Le droit de créer ou de rejoindre une association (loi du 1er juillet 1901)","Un principe fondamental encadré par la loi du 1er juillet 1901"],"distractors":["Le droit de se réunir pour manifester dans l'espace public","Le droit de créer une entreprise sans aucune formalité","Le droit de publier librement ses idées dans la presse"],"explanation":"La liberté d'association permet de créer ou de rejoindre une association librement (loi du 1er juillet 1901). Une simple déclaration en préfecture lui donne la personnalité juridique.","why":["Se réunir et manifester relève de la liberté de réunion, un autre droit.","Une entreprise suit d'autres règles : l'association n'a pas de but lucratif.","Publier dans la presse relève de la liberté de la presse (loi de 1881)."],"explanationEasy":"La liberté d'association permet de créer une association ou d'en rejoindre une. C'est la loi du 1er juillet 1901. Une simple déclaration à la préfecture lui donne une existence légale.","whyEasy":["Se réunir et manifester, c'est la liberté de réunion. C'est un autre droit.","Une entreprise suit d'autres règles. Une association ne cherche pas à gagner de l'argent.","Publier dans la presse, c'est la liberté de la presse (loi de 1881)."]},{"id":6,"question":"La liberté d'expression sur les réseaux sociaux en France est :","answers":["Protégée par la loi, mais les contenus qui incitent à la haine ou à la violence sont interdits","Libre, mais encadrée par la loi","Pas absolue : les propos haineux sont interdits"],"distractors":["Totale : on peut publier n'importe quel contenu sans risque de sanction","Autorisée uniquement pour les contenus approuvés au préalable par l'État","Réservée aux journalistes professionnels"],"explanation":"La liberté d'expression est protégée, y compris en ligne, mais elle a des limites : injures, diffamation, provocation à la haine ou à la violence sont punies.","why":["Elle n'est pas absolue : certains propos sont des délits.","Il n'existe pas d'autorisation préalable de l'État.","Elle appartient à tous, pas seulement aux journalistes."],"explanationEasy":"La liberté d'expression est protégée, aussi sur internet. Mais elle a des limites. L'injure, la diffamation, la haine et la violence sont punies.","whyEasy":["Elle n'est pas totale. Certains propos sont des délits.","L'État ne donne pas d'autorisation avant de publier.","Elle appartient à tout le monde, pas seulement aux journalistes."]},{"id":7,"question":"Lequel de ces prénoms évoque un symbole de la République ?","answers":["Marianne"],"distractors":["Marie-Antoinette","Joséphine","Éléonore"],"explanation":"Marianne est la figure féminine qui incarne la République française.","why":["Marie-Antoinette était reine de France, épouse de Louis XVI.","Joséphine était l'épouse de Napoléon Ier, impératrice.",""],"explanationEasy":"Marianne est une femme qui représente la République française.","whyEasy":["Marie-Antoinette était la reine de France. Elle était la femme de Louis XVI.","Joséphine était la femme de Napoléon Ier. Elle était impératrice.",""]},{"id":8,"question":"Lequel de ces symboles représente la République française ?","answers":["Le drapeau tricolore (Bleu, Blanc, Rouge)","L'hymne national (La Marseillaise)","La devise \"Liberté, Égalité, Fraternité\"","Marianne","Le 14 juillet (Fête nationale)","La langue française"],"distractors":["La fleur de lys","L'aigle impérial","Le drapeau blanc"],"explanation":"Les symboles de la République sont le drapeau tricolore, La Marseillaise, la devise, Marianne, le 14 juillet et la langue française.","why":["La fleur de lys est un emblème de la monarchie.","L'aigle est un emblème de l'Empire de Napoléon.","Le drapeau blanc était celui de la monarchie."],"explanationEasy":"Il y a six symboles de la République. Ce sont le drapeau tricolore, La Marseillaise, la devise, Marianne, le 14 juillet et la langue française.","whyEasy":["La fleur de lys est un emblème de la monarchie.","L'aigle est un emblème de l'Empire de Napoléon.","Le drapeau blanc était le drapeau de la monarchie."]},{"id":9,"question":"Où peut-on voir la devise de la République ?","answers":["Sur les frontons des bâtiments publics (Mairies, Écoles, Palais de Justice)","Sur les pièces de monnaie"],"distractors":["Sur les billets en euros","Sur les plaques d'immatriculation des voitures","Sur les panneaux routiers"],"explanation":"La devise « Liberté, Égalité, Fraternité » est inscrite sur les frontons des mairies, des écoles, des tribunaux, et sur les pièces françaises.","why":["Les billets en euros montrent des fenêtres et des ponts, pas la devise.","",""],"explanationEasy":"On lit la devise « Liberté, Égalité, Fraternité » sur les mairies, les écoles et les tribunaux. Elle est aussi sur les pièces françaises.","whyEasy":["Les billets en euros montrent des fenêtres et des ponts. Ils n'ont pas la devise.","",""]},{"id":10,"question":"Lesquels sont des symboles officiels de la République française ?","answers":["La devise « Liberté, Égalité, Fraternité », le drapeau tricolore et La Marseillaise","Marianne, la fête nationale du 14 juillet et la langue française","Le drapeau tricolore, La Marseillaise et Marianne"],"distractors":["Le drapeau tricolore, le coq gaulois et la Tour Eiffel","La Marseillaise, la fleur de lys et le 11 novembre","Marianne, la baguette et la devise « Liberté, Égalité, Fraternité »"],"explanation":"Il y a six symboles officiels : la devise, le drapeau tricolore, La Marseillaise, Marianne, le 14 juillet et la langue française. Il faut que les trois éléments cités en fassent partie.","why":["La Tour Eiffel n'est pas un symbole officiel ; le coq est un emblème national, mais pas l'un des symboles de cette liste.","La fleur de lys est un emblème royal ; le 11 novembre est une commémoration.","La baguette n'est pas un symbole de la République."],"explanationEasy":"Il y a six symboles officiels. Ce sont la devise, le drapeau tricolore, La Marseillaise, Marianne, le 14 juillet et la langue française. Les trois éléments cités doivent en faire partie.","whyEasy":["La Tour Eiffel n'est pas un symbole officiel. Le coq est un emblème, mais il n'est pas dans cette liste.","La fleur de lys est un emblème royal. Le 11 novembre est une commémoration.","La baguette n'est pas un symbole de la République."]},{"id":11,"question":"Peut-on brûler publiquement un drapeau français ?","answers":["Non, l'outrage au drapeau est puni par la loi","Non, c'est interdit et puni d'une amende","Non, cela porte atteinte à l'autorité de l'État"],"distractors":["Oui, c'est autorisé : la liberté d'expression n'a aucune limite","Oui, à condition d'avoir prévenu la mairie","Non, c'est interdit uniquement pendant les cérémonies officielles"],"explanation":"Outrager publiquement le drapeau tricolore, par exemple en le brûlant, est une infraction punie d'une amende : la loi protège les symboles de la République.","why":["La liberté d'expression a des limites fixées par la loi.","Prévenir la mairie ne rend pas l'acte légal.","L'interdiction ne se limite pas aux cérémonies officielles."],"explanationEasy":"Outrager publiquement le drapeau tricolore est une infraction. La loi protège les symboles de la République.","whyEasy":["La liberté d'expression a des limites. Ces limites sont fixées par la loi.","Prévenir la mairie ne rend pas cet acte légal.","L'interdiction existe aussi en dehors des cérémonies officielles."]},{"id":12,"question":"Quand la sécurité sociale a-t-elle été établie en France ?","answers":["1945"],"distractors":["1936","1958","1981"],"explanation":"La Sécurité sociale est créée par les ordonnances d'octobre 1945, à la Libération.","why":["1936 : Front populaire (congés payés).","1958 : naissance de la Ve République.","1981 : élection de François Mitterrand."],"explanationEasy":"La Sécurité sociale naît avec les ordonnances d'octobre 1945, à la Libération.","whyEasy":["En 1936, c'est le Front populaire, avec les congés payés.","En 1958, c'est la naissance de la Ve République.","En 1981, François Mitterrand est élu."]},{"id":13,"question":"Que commémore la fête nationale ?","answers":["La prise de la Bastille (14 juillet 1789)","La Fête de la Fédération (14 juillet 1790)","L'unité de la Nation et la fin de la monarchie absolue"],"distractors":["La signature de l'armistice de 1918","La proclamation de la Première République en 1792","L'exécution de Louis XVI en 1793"],"explanation":"Le 14 juillet rappelle la prise de la Bastille (1789) et la fête de la Fédération (1790), symbole de l'unité nationale.","why":["L'armistice de 1918 est commémoré le 11 novembre.","La Première République est proclamée le 22 septembre 1792.","Louis XVI est guillotiné le 21 janvier 1793."],"explanationEasy":"Le 14 juillet rappelle deux événements. Il y a la prise de la Bastille (1789). Il y a la fête de la Fédération (1790). C'est un symbole de l'unité de la nation.","whyEasy":["On commémore l'armistice de 1918 le 11 novembre.","La Première République est proclamée le 22 septembre 1792.","Louis XVI est guillotiné le 21 janvier 1793."]},{"id":14,"question":"Que porte Marianne sur la tête ?","answers":["Un bonnet phrygien"],"distractors":["Une couronne royale","Un tricorne","Un casque de soldat"],"explanation":"Traditionnellement, Marianne porte un bonnet phrygien, symbole de liberté hérité de la Révolution française.","why":["","",""],"explanationEasy":"Marianne porte traditionnellement un bonnet phrygien. C'est un symbole de liberté. Il vient de la Révolution française.","whyEasy":["","",""]},{"id":15,"question":"Que signifie le mot 'fraternité' dans la devise française ?","answers":["La volonté de vivre ensemble et de voir en l'autre un semblable, malgré les différences","La solidarité entre tous les citoyens","L'esprit de solidarité et d'entraide mutuelle"],"distractors":["Le droit pour chacun de faire tout ce qui ne nuit pas à autrui","L'égalité des droits devant la loi pour tous","L'obligation de partager ses biens avec ses voisins"],"explanation":"La fraternité, troisième terme de la devise, désigne la solidarité et l'entraide entre tous les citoyens.","why":["Cela décrit la liberté.","Cela décrit l'égalité.","La fraternité n'oblige pas à partager ses biens."],"explanationEasy":"La fraternité est le troisième mot de la devise. Elle veut dire solidarité et entraide entre tous les citoyens.","whyEasy":["Cette phrase décrit la liberté.","Cette phrase décrit l'égalité.","La fraternité n'oblige pas à partager ses biens."]},{"id":16,"question":"Quel symbole de la République peut-on voir sur les maillots de l'équipe de France de football ?","answers":["Le coq gaulois"],"distractors":["Le lion","L'aigle","La fleur de lys"],"explanation":"Le coq gaulois est l'emblème du sport français : on le voit sur le maillot des Bleus.","why":["Les lions sont sur le maillot de l'Angleterre.","L'aigle figure sur d'autres maillots, comme celui de l'Allemagne.","La fleur de lys est un emblème de la monarchie."],"explanationEasy":"Le coq gaulois est l'emblème du sport français. On le voit sur le maillot des Bleus.","whyEasy":["Les lions sont sur le maillot de l'Angleterre.","L'aigle est sur d'autres maillots, comme celui de l'Allemagne.","La fleur de lys est un emblème de la monarchie."]},{"id":17,"question":"Quelle est la devise de l'Union européenne ?","answers":["Unie dans la diversité"],"distractors":["Un continent, un peuple","L'union fait la force","Ensemble pour l'avenir"],"explanation":"La devise de l'Union européenne, utilisée pour la première fois en 2000, est « Unie dans la diversité ».","why":["","« L'union fait la force » est la devise de la Belgique.",""],"explanationEasy":"La devise de l'Union européenne est « Unie dans la diversité ». On l'utilise depuis 2000.","whyEasy":["","« L'union fait la force » est la devise de la Belgique.",""]},{"id":18,"question":"Quelle est la devise de la République française ?","answers":["Liberté, Égalité, Fraternité"],"distractors":["Liberté, Égalité, Solidarité","Liberté, Égalité, Laïcité","Liberté, Unité, Fraternité"],"explanation":"La devise de la République est « Liberté, Égalité, Fraternité » (article 2 de la Constitution).","why":["Le troisième mot est « Fraternité », pas « Solidarité ».","La laïcité est un principe de la République, pas un mot de la devise.","Le deuxième mot est « Égalité », pas « Unité »."],"explanationEasy":"La devise de la République est « Liberté, Égalité, Fraternité ». Elle est dans l'article 2 de la Constitution.","whyEasy":["Le troisième mot est « Fraternité », pas « Solidarité ».","La laïcité est un principe de la République. Ce n'est pas un mot de la devise.","Le deuxième mot est « Égalité », pas « Unité »."]},{"id":19,"question":"Qu'est-ce que la liberté d'association ?","answers":["Le droit de créer ou de rejoindre une association (loi du 1er juillet 1901)","Le droit de se regrouper pour un projet commun sans but lucratif","La liberté régie par la loi du 1er juillet 1901","Le droit de créer une association sur simple déclaration"],"distractors":["Le droit de se réunir et de manifester dans la rue sans autorisation","Le droit de créer une entreprise pour gagner de l'argent","Le droit de fonder un journal sans déclaration préalable"],"explanation":"La liberté d'association : créer ou rejoindre une association à but non lucratif (loi du 1er juillet 1901). Une simple déclaration en préfecture lui donne la personnalité juridique.","why":["Se réunir et manifester est la liberté de réunion.","Une association n'a pas pour but de gagner de l'argent.","Fonder un journal relève de la liberté de la presse."],"explanationEasy":"La liberté d'association permet de créer une association sans but lucratif, ou d'en rejoindre une. C'est la loi du 1er juillet 1901. Une déclaration à la préfecture lui donne une existence légale.","whyEasy":["Se réunir et manifester, c'est la liberté de réunion.","Une association ne cherche pas à gagner de l'argent.","Fonder un journal, c'est la liberté de la presse."]},{"id":20,"question":"Qu'est-ce qu'une liberté ?","answers":["Le droit de faire tout ce qui ne nuit pas à autrui","Un droit fondamental garanti par la Constitution","La possibilité d'agir sans contrainte, dans les limites de la loi"],"distractors":["Le droit de faire tout ce que l'on veut, même si cela nuit à autrui","Le droit de recevoir de l'État tout ce dont on a besoin","La possibilité de ne pas respecter la loi quand on est majeur"],"explanation":"Selon l'article 4 de la Déclaration de 1789, la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui ; la loi fixe ses limites.","why":["La liberté s'arrête là où commence celle des autres.","La liberté n'est pas un droit de recevoir des biens de l'État.","La loi s'applique à tous, majeurs compris."],"explanationEasy":"L'article 4 de la Déclaration de 1789 définit la liberté. Être libre, c'est faire tout ce qui ne nuit pas à autrui. La loi fixe les limites.","whyEasy":["La liberté de chacun s'arrête là où commence celle des autres.","La liberté n'est pas le droit de recevoir tout ce qu'on veut de l'État.","La loi s'applique à tous, aussi aux adultes."]},{"id":21,"question":"Selon la Constitution, la France est une République...","answers":["Indivisible, laïque, démocratique et sociale"],"distractors":["Indivisible, laïque, libérale et sociale","Fédérale, laïque, démocratique et sociale","Indivisible, neutre, démocratique et solidaire"],"explanation":"L'article 1er de la Constitution de 1958 dit : « La France est une République indivisible, laïque, démocratique et sociale. »","why":["Le texte dit « démocratique », pas « libérale ».","La France n'est pas un État fédéral : la République est indivisible.","Le texte dit « laïque » et « sociale », pas « neutre » ni « solidaire »."],"explanationEasy":"Article 1er de la Constitution de 1958. La France est une République « indivisible, laïque, démocratique et sociale ».","whyEasy":["Le texte dit « démocratique », pas « libérale ».","La France n'est pas un État fédéral. La République est indivisible.","Le texte dit « laïque » et « sociale ». Il ne dit pas « neutre » ni « solidaire »."]},{"id":22,"question":"Sur quel document peut-on voir Marianne ?","answers":["Sur les documents de l'administration française","Sur les timbres","Sur les pièces de monnaie (centimes d'euro)","Sur la carte électorale ou la carte nationale d'identité"],"distractors":["Sur les billets en euros","Sur les cartes bancaires","Sur les factures d'électricité"],"explanation":"On voit Marianne sur les timbres, les pièces de centimes, les documents de l'administration et la carte nationale d'identité.","why":["Les billets en euros montrent des fenêtres et des ponts, pas Marianne.","",""],"explanationEasy":"On voit Marianne sur les timbres, les pièces de centimes et les documents de l'administration. On la voit aussi sur la carte d'identité.","whyEasy":["Les billets en euros montrent des fenêtres et des ponts. Ils n'ont pas Marianne.","",""]},{"id":23,"question":"Une des valeurs de la devise républicaine est l'Égalité. Qu'est-ce que cela signifie ?","answers":["Tous les citoyens ont les mêmes droits et devoirs","La loi est la même pour tous, sans distinction d'origine, de race ou de religion","L'interdiction de toute discrimination par l'État"],"distractors":["Tous les citoyens doivent avoir le même salaire","Tous les citoyens doivent avoir les mêmes opinions","Chacun peut choisir les lois qu'il veut respecter"],"explanation":"L'égalité signifie que tous les citoyens ont les mêmes droits et devoirs et que la loi est la même pour tous, sans discrimination.","why":["L'égalité devant la loi n'impose pas des salaires identiques.","Chacun est libre d'avoir ses propres opinions.","La loi s'impose à tous."],"explanationEasy":"L'égalité veut dire que tous les citoyens ont les mêmes droits et les mêmes devoirs. La loi est la même pour tous, sans discrimination.","whyEasy":["L'égalité devant la loi ne veut pas dire le même salaire pour tous.","Chacun est libre d'avoir ses propres opinions.","La loi s'impose à tout le monde."]},{"id":24,"question":"Une personne peut-elle changer librement de religion en France ?","answers":["Oui, la France garantit la liberté de conscience","Oui, chacun est libre de croire, de ne pas croire ou de changer de religion","Oui, c'est un droit fondamental protégé par la laïcité"],"distractors":["Non, il faut une autorisation de la préfecture","Non, la religion est transmise par la famille et ne peut pas changer","Oui, mais seulement une fois dans sa vie"],"explanation":"La liberté de conscience permet de croire, de ne pas croire ou de changer de religion, sans autorisation.","why":["Aucune autorisation n'est nécessaire.","La religion n'est pas imposée par la famille.","On peut changer autant de fois qu'on le souhaite."],"explanationEasy":"La liberté de conscience permet de croire ou de ne pas croire. Elle permet aussi de changer de religion. Aucune autorisation n'est nécessaire.","whyEasy":["Il ne faut aucune autorisation.","La famille n'impose pas la religion. On peut en changer.","On peut changer de religion autant de fois qu'on veut."]},{"id":25,"question":"Selon le principe de laïcité, que signifie la neutralité de l'Etat ?","answers":["L'État et les services publics traitent tous les citoyens de la même manière, quelle que soit leur religion","L'État ne finance et ne favorise aucune religion","L'impartialité totale de l'État vis-à-vis des cultes"],"distractors":["L'État interdit la pratique de toutes les religions","L'État soutient la religion pratiquée par la majorité","Les agents de l'État peuvent promouvoir leur religion dans leur service"],"explanation":"La neutralité de l'État : en principe, il ne reconnaît, ne finance et ne favorise aucune religion (loi de 1905, avec quelques exceptions comme l'Alsace-Moselle), et il traite tous les citoyens de la même façon.","why":["La laïcité n'interdit pas les religions : elle garantit leur libre exercice.","L'État ne favorise aucune religion, même majoritaire.","Les agents publics sont au contraire tenus à la neutralité."],"explanationEasy":"L'État est neutre. Il ne reconnaît, ne finance et ne favorise aucune religion. Il traite tous les citoyens de la même façon.","whyEasy":["La laïcité n'interdit pas les religions. Elle garantit leur libre pratique.","L'État ne favorise aucune religion, même celle de la majorité.","Les agents publics doivent au contraire rester neutres."]},{"id":26,"question":"Que peut faire un usager du service public dans une mairie ?","answers":["Porter un signe religieux, en respectant les règles du service","Demander un passeport ou une carte d'identité","Se marier (mariage civil)","S'inscrire sur les listes électorales"],"distractors":["Faire célébrer un mariage religieux ayant valeur légale","Refuser d'être reçu par un agent du sexe opposé","Exiger des horaires d'ouverture adaptés à sa religion"],"explanation":"Un usager n'est pas tenu à la neutralité (contrairement aux agents) : il peut porter un signe religieux, tout en respectant les règles du service. À la mairie, il peut demander des papiers d'identité, se marier civilement, s'inscrire sur les listes électorales.","why":["Seul le mariage civil a valeur légale.","Un usager ne choisit pas l'agent qui le reçoit.","Les horaires du service public ne dépendent pas d'une religion."],"explanationEasy":"Un usager n'est pas obligé d'être neutre, contrairement aux agents. Il peut porter un signe religieux et respecter les règles du service. À la mairie, il peut demander des papiers d'identité et se marier civilement. Il peut aussi s'inscrire sur les listes électorales.","whyEasy":["Seul le mariage civil a une valeur légale.","Un usager ne choisit pas l'agent qui le reçoit.","Les horaires du service public ne dépendent pas d'une religion."]},{"id":27,"question":"En France, il est possible pour l'État de financer :","answers":["La restauration d'un monument religieux classé au patrimoine","Les écoles publiques, les hôpitaux et les infrastructures","Les services publics et les associations d'intérêt général"],"distractors":["Le fonctionnement courant d'un lieu de culte (chauffage, personnel)","L'organisation des cérémonies religieuses","L'enseignement religieux dans les écoles publiques"],"explanation":"L'État peut financer la restauration d'un monument classé, même religieux, car c'est du patrimoine ; il ne finance pas le culte lui-même (loi de 1905, hors régime particulier d'Alsace-Moselle).","why":["La République ne subventionne pas le fonctionnement courant du culte.","Elle ne finance pas les cérémonies religieuses.","Hors Alsace-Moselle, l'enseignement religieux n'est pas donné à l'école publique."],"explanationEasy":"L'État peut financer la restauration d'un monument classé, même religieux. C'est du patrimoine. Il ne finance pas le culte lui-même (loi de 1905, sauf en Alsace-Moselle).","whyEasy":["L'État ne paie pas le fonctionnement courant d'un lieu de culte.","L'État ne finance pas les cérémonies religieuses.","Hors Alsace-Moselle, l'école publique ne donne pas d'enseignement religieux."]},{"id":28,"question":"En quelle année la loi de séparation des Églises et de l'État a-t-elle été votée ?","answers":["1905"],"distractors":["1882","1901","1913"],"explanation":"La loi du 9 décembre 1905 sépare les Églises et l'État.","why":["1882 : lois Ferry sur l'école laïque et obligatoire.","1901 : loi sur les associations.","1913 : loi sur les monuments historiques."],"explanationEasy":"La loi du 9 décembre 1905 sépare les Églises et l'État.","whyEasy":["En 1882, ce sont les lois Ferry sur l'école laïque et obligatoire.","En 1901, c'est la loi sur les associations.","En 1913, c'est la loi sur les monuments historiques."]},{"id":29,"question":"Que dit la loi de 1905 ?","answers":["Elle garantit la liberté de conscience et le libre exercice des cultes","Elle sépare les Églises et l'État","Elle affirme que la République ne salarie ni ne subventionne aucun culte"],"distractors":["Elle oblige l'État à financer les cultes","Elle crée l'école gratuite et obligatoire","Elle interdit le port de tout signe religieux dans la rue"],"explanation":"La loi de 1905 garantit la liberté de conscience et le libre exercice des cultes ; la République ne reconnaît, ne salarie ni ne subventionne aucun culte.","why":["Elle met au contraire fin au financement des cultes.","L'école gratuite et obligatoire relève des lois Ferry (1881-1882).","Elle garantit le libre exercice des cultes."],"explanationEasy":"La loi de 1905 garantit la liberté de conscience et le libre exercice des cultes. La République ne reconnaît, ne paie et ne subventionne aucun culte.","whyEasy":["Au contraire, elle met fin au financement des cultes par l'État.","L'école gratuite et obligatoire vient des lois Ferry (1881-1882).","Elle garantit le libre exercice des cultes."]},{"id":30,"question":"Que garantit le principe de laïcité ?","answers":["La neutralité de l'État et la liberté de conscience","La séparation entre la société civile et la société religieuse","Le respect de toutes les croyances sans en privilégier aucune"],"distractors":["Le droit de pratiquer uniquement la religion majoritaire","L'interdiction de pratiquer une religion en public","L'obligation de croire en une religion"],"explanation":"La laïcité garantit la liberté de conscience et la neutralité de l'État : chacun est libre de croire ou de ne pas croire.","why":["Aucune religion n'est privilégiée.","On peut pratiquer sa religion en public, dans le respect de la loi.","Personne n'est obligé de croire."],"explanationEasy":"La laïcité garantit la liberté de conscience et la neutralité de l'État. Chacun est libre de croire ou de ne pas croire.","whyEasy":["Aucune religion n'est privilégiée.","On peut pratiquer sa religion en public, avec le respect de la loi.","Personne n'est obligé de croire."]},{"id":31,"question":"Quel jour célèbre-t-on officiellement la laïcité en France ?","answers":["Le 9 décembre"],"distractors":["Le 9 mai","Le 1er mai","Le 14 juillet"],"explanation":"La Journée de la laïcité est célébrée le 9 décembre, anniversaire de la loi de 1905.","why":["Le 9 mai est la Journée de l'Europe.","Le 1er mai est la Fête du Travail.","Le 14 juillet est la fête nationale."],"explanationEasy":"La Journée de la laïcité a lieu le 9 décembre. C'est l'anniversaire de la loi de 1905.","whyEasy":["Le 9 mai, c'est la Journée de l'Europe.","Le 1er mai, c'est la Fête du Travail.","Le 14 juillet, c'est la fête nationale."]},{"id":32,"question":"Quel symbole religieux peut être porté dans une école publique dans le respect de la laïcité ?","answers":["Un signe religieux discret","Un symbole qui ne se remarque pas immédiatement"],"distractors":["Un signe religieux ostensible (par exemple une grande croix)","Un vêtement religieux qui couvre la tête","Tout signe religieux, sans aucune limite"],"explanation":"Dans les écoles publiques, la loi de 2004 interdit les signes qui manifestent ostensiblement une appartenance religieuse ; les signes discrets sont autorisés.","why":["Un signe ostensible est interdit à l'école publique.","Les tenues manifestant ostensiblement une appartenance religieuse sont interdites.","Il y a une limite : l'ostentation est interdite."],"explanationEasy":"La loi de 2004 interdit à l'école publique les signes religieux ostensibles (très visibles). Les signes discrets sont autorisés.","whyEasy":["Un signe très visible est interdit à l'école publique.","Les tenues qui montrent clairement une religion sont interdites.","Il y a une limite : un signe très visible est interdit."]},{"id":33,"question":"Quel terme désigne précisément la haine ou les préjugés contre les Juifs ?","answers":["Antisémitisme"],"distractors":["La xénophobie","L'islamophobie","L'homophobie"],"explanation":"L'antisémitisme désigne la haine ou les préjugés contre les Juifs.","why":["La xénophobie est l'hostilité envers les étrangers.","L'islamophobie est l'hostilité envers les musulmans.","L'homophobie est l'hostilité envers les homosexuels."],"explanationEasy":"L'antisémitisme est la haine ou les préjugés contre les Juifs.","whyEasy":["La xénophobie est le rejet des étrangers.","L'islamophobie est le rejet des musulmans.","L'homophobie est le rejet des homosexuels."]},{"id":34,"question":"Quel texte est considéré comme le texte fondateur de la laïcité ?","answers":["La loi de 1905 de séparation des Églises et de l'État"],"distractors":["Le Concordat de 1801 entre le Premier consul et le pape","La loi du 1er juillet 1901 sur les associations","La loi du 28 mars 1882 sur l'école obligatoire"],"explanation":"La loi du 9 décembre 1905 de séparation des Églises et de l'État est le texte fondateur de la laïcité.","why":["Le Concordat de 1801 organisait au contraire les relations entre l'État et l'Église.","La loi de 1901 concerne les associations.","La loi de 1882 rend l'école obligatoire et laïque."],"explanationEasy":"La loi du 9 décembre 1905 sépare les Églises et l'État. C'est le texte fondateur de la laïcité.","whyEasy":["Le Concordat de 1801 organisait au contraire les relations entre l'État et l'Église.","La loi de 1901 parle des associations.","La loi de 1882 rend l'école obligatoire et laïque."]},{"id":35,"question":"Quelle institution française doit rester neutre en matière de religion ?","answers":["L'État et ses administrations","Les services publics (Hôpitaux, Écoles, Préfectures)","Les fonctionnaires et agents publics","Les collectivités territoriales (mairies, départements, régions)"],"distractors":["Les usagers des services publics","Les lieux de culte (églises, mosquées, synagogues)","Les citoyens dans l'espace public"],"explanation":"L'État, ses administrations, les services publics et leurs agents doivent rester neutres en matière religieuse.","why":["Les usagers sont libres d'exprimer leurs convictions.","Les lieux de culte ne sont pas des institutions de l'État.","Les citoyens peuvent exprimer leurs convictions dans l'espace public."],"explanationEasy":"L'État, ses administrations, les services publics et leurs agents doivent rester neutres sur la religion.","whyEasy":["Les usagers sont libres d'exprimer leurs convictions.","Les lieux de culte ne sont pas des institutions de l'État.","Les citoyens peuvent exprimer leurs convictions dans l'espace public."]},{"id":36,"question":"Qu'est-ce que la laïcité ?","answers":["La séparation de l'État et des religions","La garantie de la liberté de conscience et la neutralité de l'État","Le principe qui permet de vivre ensemble quelles que soient nos croyances"],"distractors":["L'interdiction de toute pratique religieuse dans l'espace public","L'obligation de suivre la religion majoritaire du pays","La suprématie d'une religion d'État"],"explanation":"La laïcité sépare l'État et les religions, garantit la liberté de conscience et permet de vivre ensemble quelles que soient les croyances.","why":["Elle autorise la pratique religieuse, y compris en public.","Aucune religion n'est imposée.","Il n'y a pas de religion d'État en France."],"explanationEasy":"La laïcité sépare l'État et les religions. Elle garantit la liberté de conscience. Elle permet de vivre ensemble, quelles que soient les croyances.","whyEasy":["Elle autorise la pratique religieuse, même en public.","Aucune religion n'est imposée.","En France, il n'y a pas de religion d'État."]},{"id":37,"question":"À l'école, la charte de la laïcité permet de :","answers":["Rappeler les règles de la laïcité à l'école","Faire comprendre le sens de la laïcité aux élèves","Expliquer que la laïcité protège la liberté des élèves"],"distractors":["Interdire toute discussion sur les religions à l'école","Autoriser chaque élève à refuser un cours qui contredit sa religion","Remplacer le règlement intérieur de l'établissement"],"explanation":"La charte de la laïcité à l'école rappelle les règles et explique aux élèves que la laïcité protège leur liberté de conscience.","why":["On peut étudier les religions, notamment en histoire.","Un élève ne peut pas refuser un cours pour des raisons religieuses.","La charte accompagne le règlement intérieur, elle ne le remplace pas."],"explanationEasy":"La charte de la laïcité à l'école rappelle les règles. Elle explique aux élèves que la laïcité protège leur liberté de conscience.","whyEasy":["On peut étudier les religions, par exemple en histoire.","Un élève ne peut pas refuser un cours pour des raisons religieuses.","La charte accompagne le règlement intérieur. Elle ne le remplace pas."]},{"id":38,"question":"Qui doit respecter et veiller à la neutralité religieuse dans les services publics ?","answers":["Les agents du service public","Les personnes travaillant pour l'État ou les collectivités","Le personnel des hôpitaux et des écoles publiques"],"distractors":["Tous les usagers des services publics","Les parents d'élèves et les patients","Les responsables des associations religieuses"],"explanation":"Les agents du service public (enseignants, personnels des hôpitaux, fonctionnaires) doivent respecter et faire respecter la neutralité religieuse.","why":["Les usagers ne sont pas soumis à cette obligation.","Ni les parents d'élèves ni les patients n'y sont tenus.","Les associations religieuses ne sont pas des services publics."],"explanationEasy":"Les agents du service public doivent respecter la neutralité religieuse et la faire respecter. Ce sont les enseignants, le personnel des hôpitaux et les fonctionnaires.","whyEasy":["Les usagers n'ont pas cette obligation.","Les parents d'élèves et les patients n'ont pas cette obligation.","Les associations religieuses ne sont pas des services publics."]},{"id":39,"question":"Une personne déclare ne croire en aucun dieu. On peut dire :","answers":["Elle est athée"],"distractors":["Elle est agnostique","Elle est anticléricale","Elle est déiste"],"explanation":"Une personne qui ne croit en aucun dieu est athée.","why":["L'agnostique estime qu'on ne peut pas savoir si Dieu existe.","L'anticlérical s'oppose à l'influence du clergé.","Le déiste croit en un dieu."],"explanationEasy":"Une personne qui ne croit en aucun dieu est athée.","whyEasy":["L'agnostique pense qu'on ne peut pas savoir si Dieu existe.","L'anticlérical s'oppose à l'influence du clergé.","Le déiste croit en un dieu."]}]},{"theme":"Système institutionnel et politique","questions":[{"id":40,"question":"Comment est désigné le Premier ministre ?","answers":["Par le Président de la République"],"distractors":["Par un vote de l'Assemblée nationale","Par les citoyens, au suffrage universel","Par le Conseil des ministres"],"explanation":"Le Premier ministre est nommé par le Président de la République (article 8 de la Constitution).","why":["L'Assemblée ne le nomme pas.","Il n'est pas élu par les citoyens.","Le Conseil des ministres est présidé par le Président, il ne nomme pas le Premier ministre."],"explanationEasy":"Le Président de la République nomme le Premier ministre. C'est l'article 8 de la Constitution.","whyEasy":["L'Assemblée nationale ne le nomme pas.","Les citoyens ne l'élisent pas.","Le Président dirige le Conseil des ministres. Ce conseil ne nomme pas le Premier ministre."]},{"id":41,"question":"Qui peut se présenter aux élections présidentielles ?","answers":["Être français, avoir au moins 18 ans, jouir de ses droits civiques et réunir 500 parrainages d'élus","Un citoyen français majeur qui a obtenu 500 parrainages d'élus"],"distractors":["Toute personne résidant en France depuis plus de 5 ans","Tout citoyen de l'Union européenne majeur","Seulement les membres d'un parti politique représenté au Parlement"],"explanation":"Pour être candidat à l'élection présidentielle, il faut être français, majeur, jouir de ses droits civiques et réunir 500 parrainages d'élus.","why":["La résidence ne suffit pas : il faut être français.","Seuls les citoyens français peuvent être candidats.","Il n'est pas obligatoire d'appartenir à un parti."],"explanationEasy":"Pour être candidat à la présidentielle, il faut être français et majeur. Il faut avoir ses droits civiques. Il faut aussi 500 parrainages d'élus.","whyEasy":["Habiter en France ne suffit pas. Il faut être français.","Seuls les citoyens français peuvent être candidats.","On n'est pas obligé d'appartenir à un parti."]},{"id":42,"question":"À qui appartient la souveraineté nationale ?","answers":["Au peuple"],"distractors":["Au Président","Au Parlement","Au gouvernement"],"explanation":"Article 3 de la Constitution : « La souveraineté nationale appartient au peuple, qui l'exerce par ses représentants et par la voie du référendum. »","why":["Le Président est un représentant du peuple, pas le détenteur de la souveraineté.","Le Parlement exerce la souveraineté au nom du peuple.","Le gouvernement conduit la politique de la nation, mais il ne détient pas la souveraineté."],"explanationEasy":"Article 3 de la Constitution. La souveraineté nationale appartient au peuple. Il l'exerce par ses représentants et par le référendum.","whyEasy":["Le Président représente le peuple. Il n'est pas le propriétaire de la souveraineté.","Le Parlement exerce la souveraineté au nom du peuple.","Le gouvernement conduit la politique du pays. Il ne détient pas la souveraineté."]},{"id":43,"question":"Qui est élu lors des élections municipales ?","answers":["Les conseillers municipaux"],"distractors":["Le maire et le préfet","Les conseillers départementaux","Les députés de la circonscription"],"explanation":"Aux élections municipales, les habitants élisent les conseillers municipaux, qui élisent ensuite le maire.","why":["Le maire est élu par les conseillers municipaux, et le préfet est nommé.","Les conseillers départementaux sont élus aux départementales.","Les députés sont élus aux législatives."],"explanationEasy":"Aux municipales, les habitants élisent les conseillers municipaux. Ensuite, les conseillers élisent le maire.","whyEasy":["Le maire est élu par les conseillers. Le préfet est nommé.","On élit les conseillers départementaux aux élections départementales.","On élit les députés aux élections législatives."]},{"id":44,"question":"L'inscription sur les listes électorales est :","answers":["Obligatoire pour pouvoir voter","Obligatoire (mais sans amende)"],"distractors":["Facultative : on peut voter sans être inscrit sur les listes","Obligatoire sous peine d'une forte amende","Réservée aux personnes qui ont un emploi"],"explanation":"L'inscription sur les listes électorales est obligatoire pour pouvoir voter, mais elle n'est pas sanctionnée par une amende. Les jeunes de 18 ans sont en général inscrits d'office.","why":["Il faut être inscrit pour voter.","Il n'y a pas d'amende.","Elle n'est pas liée à l'emploi."],"explanationEasy":"L'inscription sur les listes électorales est obligatoire pour voter. Mais on ne reçoit pas d'amende si on ne s'inscrit pas. Les jeunes de 18 ans sont en général inscrits d'office.","whyEasy":["Il faut être inscrit pour voter.","Il n'y a pas d'amende.","L'inscription ne dépend pas d'un emploi."]},{"id":45,"question":"Quelle condition est nécessaire pour voter aux élections présidentielles ?","answers":["Être français, majeur et inscrit sur les listes électorales","Jouir de ses droits civils et politiques"],"distractors":["Être résident en France depuis au moins cinq ans","Être français, majeur et avoir un emploi","Être citoyen de l'Union européenne et majeur"],"explanation":"Pour voter à la présidentielle, il faut être français, majeur, jouir de ses droits civils et politiques et être inscrit sur les listes électorales.","why":["Il faut être français ; la durée de résidence n'est pas un critère.","Avoir un emploi n'est pas une condition.","Les citoyens européens ne votent pas à la présidentielle."],"explanationEasy":"Pour voter à la présidentielle, il faut être français et majeur. Il faut avoir ses droits civils et politiques. Il faut aussi être inscrit sur les listes électorales.","whyEasy":["Il faut être français. La durée de résidence ne compte pas.","Avoir un emploi n'est pas une condition.","Les citoyens européens ne votent pas à la présidentielle."]},{"id":46,"question":"Quelle condition faut-il remplir pour être candidat aux élections municipales ?","answers":["Être électeur de la commune et avoir la nationalité française ou d'un pays de l'Union Européenne","Être français ou ressortissant d'un pays de l'Union européenne","Avoir 18 ans révolus et être inscrit sur les listes électorales de la commune"],"distractors":["Être né dans la commune et avoir plus de 25 ans","Être de nationalité française exclusivement","Être résident de la commune depuis au moins dix ans"],"explanation":"Pour être candidat aux municipales, il faut être électeur de la commune (français ou citoyen de l'Union européenne). Les citoyens européens ne peuvent toutefois pas être maire ou adjoint.","why":["Aucune condition de lieu de naissance ni d'âge minimal de 25 ans.","Les citoyens de l'Union européenne peuvent aussi être candidats.","Il n'y a pas de durée de résidence de dix ans exigée."],"explanationEasy":"Pour être candidat aux municipales, il faut être électeur de la commune. On peut être français ou citoyen de l'Union européenne. Un citoyen européen ne peut pas être maire ni adjoint.","whyEasy":["Il n'y a pas de condition de lieu de naissance. Il n'y a pas d'âge minimal de 25 ans.","Les citoyens de l'Union européenne peuvent aussi être candidats.","On n'exige pas dix ans de résidence."]},{"id":47,"question":"Parmi ces autorités, laquelle est élue ?","answers":["Le Président de la République","Le Maire","Le Député","Le Sénateur","Le Conseiller régional ou départemental","Le Conseiller municipal","Le Député européen"],"distractors":["Le préfet","Le Premier ministre","Un ministre"],"explanation":"Sont élus : le Président, les députés, les sénateurs, les conseillers (municipaux, départementaux, régionaux), les maires et les eurodéputés. Préfets et ministres sont nommés.","why":["Le préfet est nommé par décret du Président de la République ; il n'est pas élu.","Le Premier ministre est nommé par le Président.","Les ministres sont nommés, pas élus."],"explanationEasy":"On élit le Président, les députés, les sénateurs, les conseillers, les maires et les eurodéputés. Les préfets et les ministres sont nommés.","whyEasy":["Le Président de la République nomme le préfet.","Le Président nomme le Premier ministre.","On nomme les ministres. On ne les élit pas."]},{"id":48,"question":"Quelles sont les fonctions du maire ?","answers":["Il célèbre les mariages (officier d'état civil) et dirige la police municipale","Il gère le budget de la commune, les écoles primaires et l'état civil","Représenter la commune, exécuter les décisions du conseil municipal et veiller à l'ordre public"],"distractors":["Il juge les petits délits commis dans la commune","Il gère les collèges et les lycées de la commune","Il dirige la police nationale et la gendarmerie sur le territoire communal"],"explanation":"Le maire représente la commune, exécute les décisions du conseil municipal, veille à l'ordre public, célèbre les mariages et tient l'état civil.","why":["Juger relève des tribunaux.","Les collèges dépendent du département, les lycées de la région.","La police nationale dépend de l'État ; le maire dirige la police municipale."],"explanationEasy":"Le maire représente la commune. Il applique les décisions du conseil municipal et veille à l'ordre public. Il célèbre les mariages et tient l'état civil.","whyEasy":["Juger est le travail des tribunaux.","Les collèges dépendent du département. Les lycées dépendent de la région.","La police nationale dépend de l'État. Le maire dirige la police municipale."]},{"id":49,"question":"Une personne, n'ayant pas d'accès à internet, veut s'inscrire sur les listes électorales pour pouvoir voter aux prochaines élections politiques. Où peut-elle s'inscrire ?","answers":["En se rendant à la mairie de son domicile (ou par courrier)"],"distractors":["À la préfecture du département, en remplissant un formulaire","Au commissariat de police le plus proche de son domicile","Au tribunal judiciaire de son lieu de résidence"],"explanation":"On peut s'inscrire à la mairie de son domicile (ou par courrier) ; l'inscription est aussi possible en ligne.","why":["Les listes électorales sont tenues par la commune, pas par la préfecture.","Le commissariat n'enregistre pas les inscriptions.","Ce n'est pas le tribunal qui gère les inscriptions."],"explanationEasy":"On peut s'inscrire à la mairie de son domicile, ou par courrier. On peut aussi s'inscrire en ligne.","whyEasy":["La commune tient les listes électorales, pas la préfecture.","Le commissariat n'enregistre pas les inscriptions.","Le tribunal ne gère pas les inscriptions."]},{"id":50,"question":"À quel âge peut-on devenir électeur ?","answers":["À partir de 18 ans"],"distractors":["À partir de 16 ans","À partir de 17 ans","À partir de 21 ans"],"explanation":"L'âge de la majorité, et donc du droit de vote, est 18 ans.","why":["","",""],"explanationEasy":"On est majeur à 18 ans. On peut donc voter à partir de 18 ans.","whyEasy":["","",""]},{"id":51,"question":"En France, est-ce obligatoire de voter ?","answers":["Non, le vote est un droit, pas une obligation","Non, c'est un droit et un devoir moral, mais pas une obligation légale","Non, l'abstention n'est pas punie par la loi (sauf pour les grands électeurs, les élus qui votent pour choisir les sénateurs)"],"distractors":["Oui, sous peine d'une amende de 135 euros","Oui, mais seulement pour les élections présidentielles","Oui, tout électeur inscrit qui ne vote pas perd ses droits civiques"],"explanation":"En France, voter est un droit, pas une obligation légale (seuls les grands électeurs doivent voter aux sénatoriales). Aux autres élections, l'abstention n'est pas sanctionnée.","why":["Il n'y a pas d'amende pour l'abstention aux élections ordinaires (seuls les grands électeurs risquent 100 euros d'amende aux sénatoriales).","Le vote n'est pas obligatoire non plus pour la présidentielle.","On ne perd pas ses droits civiques en ne votant pas."],"explanationEasy":"En France, voter est un droit, pas une obligation légale. Seuls les grands électeurs doivent voter aux sénatoriales. On ne punit pas l'abstention aux élections ordinaires.","whyEasy":["Il n'y a pas d'amende si on ne vote pas aux élections ordinaires.","Le vote n'est pas obligatoire non plus à la présidentielle.","On ne perd pas ses droits civiques si on ne vote pas."]},{"id":52,"question":"A-t-on le droit de ne pas respecter une loi ?","answers":["Non, nul n'est censé ignorer la loi et chacun doit la respecter"],"distractors":["Oui, si on prouve qu'on ne la connaissait pas","Oui, si on la juge injuste","Oui, lorsqu'on n'a pas voté pour elle"],"explanation":"Nul n'est censé ignorer la loi : chacun doit la respecter, même s'il ne la connaît pas ou ne l'approuve pas.","why":["Ignorer la loi n'est pas une excuse.","Une loi s'applique même si on la juge injuste.","Une loi s'impose à tous, y compris à ceux qui ont voté contre."],"explanationEasy":"Nul n'est censé ignorer la loi. Chacun doit la respecter, même s'il ne la connaît pas ou n'est pas d'accord.","whyEasy":["Ne pas connaître la loi n'est pas une excuse.","Une loi s'applique même si on la trouve injuste.","Une loi s'impose à tous, aussi à ceux qui ont voté contre."]},{"id":53,"question":"Comment sont désignés les députés ?","answers":["Ils sont élus par les citoyens lors des élections législatives"],"distractors":["Ils sont nommés par le Président de la République","Ils sont élus par les maires et les conseillers municipaux","Ils sont désignés par le Premier ministre"],"explanation":"Les députés sont élus au suffrage universel direct lors des élections législatives, tous les 5 ans.","why":["Ils ne sont pas nommés par le Président.","Les députés sont élus directement par les citoyens. Ce sont les sénateurs qu'élisent des grands électeurs.","Ils ne sont pas désignés par le Premier ministre."],"explanationEasy":"Les députés sont élus au suffrage universel direct. Les élections législatives ont lieu tous les 5 ans.","whyEasy":["Le Président ne nomme pas les députés.","Les députés sont élus directement par les citoyens. Les grands électeurs élisent les sénateurs.","Le Premier ministre ne désigne pas les députés."]},{"id":54,"question":"Qui vote les lois ?","answers":["Le Parlement","L'Assemblée nationale et le Sénat","Les députés et les sénateurs"],"distractors":["Le gouvernement","Le Conseil constitutionnel","Le Président de la République"],"explanation":"Le Parlement (Assemblée nationale et Sénat) vote les lois.","why":["Le gouvernement propose et applique les lois, il ne les vote pas.","Le Conseil constitutionnel contrôle les lois, il ne les vote pas.","Le Président promulgue les lois, il ne les vote pas."],"explanationEasy":"Le Parlement vote les lois. Il se compose de l'Assemblée nationale et du Sénat.","whyEasy":["Le gouvernement propose et applique les lois. Il ne les vote pas.","Le Conseil constitutionnel contrôle les lois. Il ne les vote pas.","Le Président promulgue les lois. Il ne les vote pas."]},{"id":55,"question":"La séparation des pouvoirs est un principe fondamental. Quels sont les trois pouvoirs concernés ?","answers":["Le pouvoir exécutif, le pouvoir législatif et le pouvoir judiciaire"],"distractors":["Le pouvoir exécutif, le pouvoir législatif et le pouvoir militaire","Le pouvoir exécutif, le pouvoir judiciaire et le pouvoir religieux","Le pouvoir législatif, le pouvoir judiciaire et le pouvoir économique"],"explanation":"Selon Montesquieu, les pouvoirs exécutif, législatif et judiciaire doivent être séparés pour éviter les abus.","why":["Le pouvoir militaire n'est pas l'un des trois pouvoirs.","Le pouvoir religieux non plus : l'État est laïque.","Le pouvoir économique n'est pas un pouvoir de l'État."],"explanationEasy":"Selon Montesquieu, il faut séparer les pouvoirs exécutif, législatif et judiciaire. Cela évite les abus.","whyEasy":["Le pouvoir militaire n'est pas l'un des trois pouvoirs.","Le pouvoir religieux non plus. L'État est laïque.","Le pouvoir économique n'est pas un pouvoir de l'État."]},{"id":56,"question":"Qu'est-ce que l'État de droit ?","answers":["Un système dans lequel la loi doit être respectée par tous, y compris par l'État","Un système où l'État (les autorités publiques) doit respecter le droit","Le contraire de l'arbitraire ou de la dictature"],"distractors":["Un régime dans lequel l'État peut décider sans être limité par la loi","Un système où seuls les citoyens doivent respecter la loi","Un État dirigé par des juristes et des magistrats"],"explanation":"L'État de droit : l'État lui-même est soumis à la loi, et chacun dispose de recours contre l'arbitraire.","why":["C'est le contraire : l'État aussi doit respecter le droit.","La loi s'applique à tous, y compris aux autorités.","Les juges appliquent la loi, ils ne dirigent pas l'État."],"explanationEasy":"Dans l'État de droit, l'État lui-même respecte la loi. Chacun peut aussi faire un recours contre l'arbitraire.","whyEasy":["C'est le contraire : l'État doit aussi respecter le droit.","La loi s'applique à tous, aussi aux autorités.","Les juges appliquent la loi. Ils ne dirigent pas l'État."]},{"id":57,"question":"Quelles sont les durées du mandat du conseil municipal et du maire ?","answers":["6 ans"],"distractors":["4 ans","5 ans","7 ans"],"explanation":"Le conseil municipal et le maire sont élus pour 6 ans.","why":["4 ans n'est la durée d'aucun de ces mandats : le conseil municipal et le maire sont élus pour 6 ans.","5 ans est la durée du mandat du Président et des députés.","7 ans était la durée de l'ancien septennat présidentiel."],"explanationEasy":"Le conseil municipal et le maire sont élus pour 6 ans.","whyEasy":["4 ans n'est pas la bonne durée. C'est 6 ans.","5 ans, c'est la durée du mandat du Président et des députés.","7 ans, c'était la durée de l'ancien septennat du Président."]},{"id":58,"question":"Qui est élu lors des élections législatives ?","answers":["Les députés"],"distractors":["Les sénateurs","Les ministres","Les maires"],"explanation":"Aux élections législatives, on élit les députés de l'Assemblée nationale.","why":["Les sénateurs sont élus par des grands électeurs.","Les ministres sont nommés.","Les maires sont élus par les conseillers municipaux."],"explanationEasy":"Aux élections législatives, on élit les députés de l'Assemblée nationale.","whyEasy":["Des grands électeurs élisent les sénateurs.","On nomme les ministres. On ne les élit pas.","Les conseillers municipaux élisent les maires."]},{"id":59,"question":"Quelle est la durée du mandat du Président de la République française ?","answers":["5 ans"],"distractors":["4 ans","6 ans","7 ans"],"explanation":"Depuis le référendum de 2000, le Président de la République est élu pour 5 ans (quinquennat).","why":["4 ans n'a jamais été la durée du mandat présidentiel en France : c'est 5 ans depuis 2000.","6 ans est la durée du mandat des sénateurs.","7 ans était l'ancien septennat, supprimé en 2000."],"explanationEasy":"Le référendum de 2000 a changé la durée du mandat. Depuis, le Président de la République est élu pour 5 ans. C'est le quinquennat.","whyEasy":["4 ans n'est pas la bonne durée. C'est 5 ans depuis 2000.","6 ans, c'est la durée du mandat des sénateurs.","7 ans, c'était l'ancien septennat. Il a disparu en 2000."]},{"id":60,"question":"Quelle est la durée du mandat des députés ?","answers":["5 ans"],"distractors":["4 ans","6 ans","7 ans"],"explanation":"Les députés sont élus pour 5 ans.","why":["4 ans n'est pas la durée du mandat des députés : c'est 5 ans.","6 ans : mandat des sénateurs et des maires.","7 ans : ancien septennat présidentiel."],"explanationEasy":"Les députés sont élus pour 5 ans.","whyEasy":["4 ans n'est pas la bonne durée. C'est 5 ans.","6 ans, c'est le mandat des sénateurs et des maires.","7 ans, c'était l'ancien septennat du Président."]},{"id":61,"question":"Quelle est la durée du mandat des sénateurs ?","answers":["6 ans"],"distractors":["5 ans","9 ans","7 ans"],"explanation":"Les sénateurs sont élus pour 6 ans, avec un renouvellement par moitié tous les 3 ans.","why":["5 ans est le mandat des députés.","9 ans était la durée avant la réforme.","7 ans était l'ancien septennat présidentiel."],"explanationEasy":"Les sénateurs sont élus pour 6 ans. Tous les 3 ans, on renouvelle la moitié du Sénat.","whyEasy":["5 ans, c'est le mandat des députés.","9 ans, c'était la durée avant la réforme.","7 ans, c'était l'ancien septennat du Président."]},{"id":62,"question":"Qui dirige l'action du gouvernement ?","answers":["Le Premier ministre"],"distractors":["Le Président de la République","Le président de l'Assemblée nationale","Le ministre de l'Intérieur"],"explanation":"Le Premier ministre dirige l'action du Gouvernement (article 21 de la Constitution).","why":["Le Président est le chef de l'État ; il nomme le Premier ministre.","Le président de l'Assemblée dirige les débats des députés.","Le ministre de l'Intérieur dirige son ministère, pas tout le Gouvernement."],"explanationEasy":"Le Premier ministre dirige l'action du Gouvernement. C'est l'article 21 de la Constitution.","whyEasy":["Le Président est le chef de l'État. Il nomme le Premier ministre.","Le président de l'Assemblée dirige les débats des députés.","Le ministre de l'Intérieur dirige son ministère, pas tout le Gouvernement."]},{"id":63,"question":"En France, est-ce possible d'adhérer à un parti politique ?","answers":["Oui, les partis se forment et exercent leur activité librement","Oui, c'est un droit fondamental","Oui, la liberté d'opinion politique est garantie par la Constitution"],"distractors":["Non, seuls les élus peuvent adhérer à un parti","Oui, mais uniquement avec l'autorisation du préfet","Non, les partis politiques sont interdits en France"],"explanation":"Les partis politiques se forment et exercent leur activité librement (article 4 de la Constitution) : chacun peut y adhérer.","why":["Il n'est pas nécessaire d'être élu.","Aucune autorisation du préfet n'est exigée.","Les partis sont libres en France."],"explanationEasy":"Les partis politiques se forment et agissent librement. C'est l'article 4 de la Constitution. Chacun peut donc adhérer à un parti.","whyEasy":["Il n'est pas nécessaire d'être élu.","Le préfet ne donne aucune autorisation.","En France, les partis sont libres."]},{"id":64,"question":"Qui sanctionne l'auteur d'un vol ?","answers":["Le Juge (ou le Tribunal)","Le pouvoir judiciaire","Le Tribunal correctionnel"],"distractors":["La police nationale","Le préfet","Le ministre de l'Intérieur"],"explanation":"Le pouvoir judiciaire (juges, tribunaux) sanctionne les infractions : la police interpelle, le juge condamne.","why":["La police enquête et interpelle mais ne condamne pas.","Le préfet représente l'État, il ne juge pas.","Le ministre de l'Intérieur ne rend pas la justice."],"explanationEasy":"Le pouvoir judiciaire (les juges et les tribunaux) punit les infractions. La police arrête la personne. Le juge la condamne.","whyEasy":["La police enquête et arrête les suspects. Elle ne condamne pas.","Le préfet représente l'État. Il ne juge pas.","Le ministre de l'Intérieur ne rend pas la justice."]},{"id":65,"question":"Qui gère les collèges publics ?","answers":["Le Département (ou Conseil départemental)"],"distractors":["La Région (ou Conseil régional)","La Commune (ou la Mairie)","L'État (ou la préfecture)"],"explanation":"Le Département gère les collèges (ainsi que l'aide sociale et les routes départementales).","why":["La Région gère les lycées.","La commune gère les écoles maternelles et primaires.","L'État fixe les programmes et emploie les enseignants, mais ne gère pas les bâtiments des collèges."],"explanationEasy":"Le Département gère les collèges. Il gère aussi l'aide sociale et les routes départementales.","whyEasy":["La Région gère les lycées.","La commune gère les écoles maternelles et primaires.","L'État fixe les programmes et paie les enseignants. Il ne gère pas les bâtiments des collèges."]},{"id":66,"question":"Qui gère les écoles primaires et maternelles publiques ?","answers":["La Commune (ou la Mairie)"],"distractors":["Le Département (ou Conseil départemental)","La Région (ou Conseil régional)","La Préfecture (ou l'État)"],"explanation":"La commune gère les écoles maternelles et primaires publiques (bâtiments, cantine…).","why":["Le Département gère les collèges.","La Région gère les lycées.","La préfecture représente l'État. L'État paie les enseignants, mais les bâtiments de l'école relèvent de la commune."],"explanationEasy":"La commune (la mairie) gère les écoles maternelles et primaires publiques. Elle s'occupe des bâtiments et de la cantine.","whyEasy":["Le Département gère les collèges, pas les écoles primaires.","La Région gère les lycées, pas les écoles primaires.","La préfecture représente l'État. L'État paie les enseignants, mais la commune gère les bâtiments."]},{"id":67,"question":"Comment sont désignés les maires ?","answers":["Par élection par le conseil municipal"],"distractors":["Par nomination par le préfet","Par élection directe par les citoyens","Par nomination par le Président de la République"],"explanation":"Le maire est élu par le conseil municipal, lui-même élu par les électeurs de la commune.","why":["Le préfet ne nomme pas les maires.","L'élection du maire est indirecte : ce sont les conseillers qui le choisissent.","Le Président ne nomme pas les maires."],"explanationEasy":"Les électeurs élisent le conseil municipal. Ensuite, le conseil municipal élit le maire.","whyEasy":["Le préfet ne nomme pas le maire.","Les électeurs ne votent pas directement pour le maire. Les conseillers le choisissent.","Le Président de la République ne nomme pas les maires."]},{"id":68,"question":"Quelle collectivité territoriale est responsable des transports régionaux ?","answers":["La région"],"distractors":["Le département","La commune","L'État"],"explanation":"La Région est responsable des transports régionaux (TER, cars interurbains…).","why":["Le département gère notamment les collèges, pas les transports régionaux.","La commune gère les services de proximité et, avec son intercommunalité, les transports urbains, mais pas les TER ni les cars régionaux.","L'État fixe le cadre national, mais l'organisation des TER et des cars interurbains est confiée à la Région."],"explanationEasy":"La Région est responsable des transports régionaux. Ce sont les TER et les cars entre les villes.","whyEasy":["Le département gère surtout les collèges, pas les transports régionaux.","La commune gère les services proches des habitants et les transports de la ville, pas les TER.","L'État fixe les règles nationales. La Région organise les TER et les cars."]},{"id":69,"question":"Quelle est l'une des voies possibles pour modifier la Constitution ?","answers":["Par référendum (vote des citoyens)","Par le vote du Congrès (réunion des députés et sénateurs à Versailles)"],"distractors":["Par un simple décret du Président de la République","Par une décision du Conseil constitutionnel","Par un vote du Sénat seul"],"explanation":"L'article 89 prévoit que le texte soit d'abord voté dans les mêmes termes par l'Assemblée nationale et le Sénat. Il est ensuite approuvé par référendum ou, pour un projet du gouvernement, par le Congrès (députés et sénateurs réunis à Versailles) à la majorité des 3/5.","why":["Un simple décret ne peut pas modifier la Constitution.","Le Conseil constitutionnel contrôle les lois, il ne modifie pas la Constitution.","Les deux assemblées doivent voter, pas seulement le Sénat."],"explanationEasy":"Le texte est d'abord voté par l'Assemblée et par le Sénat. Ensuite, il y a deux voies : un référendum, ou un vote du Congrès à la majorité des 3/5. Le Congrès réunit les députés et les sénateurs à Versailles.","whyEasy":["Un décret du Président ne peut pas changer la Constitution.","Le Conseil constitutionnel contrôle les lois. Il ne change pas la Constitution.","Le Sénat seul ne suffit pas. Les deux assemblées doivent voter."]},{"id":70,"question":"Qui assure l'intérim du président de la République en cas de décès ?","answers":["Le Président du Sénat"],"distractors":["Le Premier ministre","Le président de l'Assemblée nationale","Le président du Conseil constitutionnel"],"explanation":"En cas de vacance de la présidence (décès, démission), c'est le président du Sénat qui assure l'intérim (article 7).","why":["Le Premier ministre ne remplace pas le Président.","Le président de l'Assemblée nationale n'est pas son suppléant.","Le Conseil constitutionnel constate la vacance mais n'assure pas l'intérim."],"explanationEasy":"Le Président meurt ou démissionne ? Le président du Sénat exerce ses fonctions pour un temps (article 7).","whyEasy":["Le Premier ministre ne remplace pas le Président.","Le président de l'Assemblée nationale ne remplace pas le Président.","Le Conseil constitutionnel constate que la place est vide. Il ne remplace pas le Président."]},{"id":71,"question":"Quel est le rôle du Conseil constitutionnel ?","answers":["Vérifier que les lois respectent la Constitution","Contrôler la régularité des élections nationales"],"distractors":["Contrôler les dépenses de l'État","Juger les crimes et les délits","Proposer les lois au Parlement"],"explanation":"Le Conseil constitutionnel vérifie que les lois respectent la Constitution et contrôle la régularité des élections nationales.","why":["Le contrôle des dépenses de l'État revient à la Cour des comptes.","Les crimes et délits sont jugés par les tribunaux.","Les lois sont proposées par le gouvernement ou les parlementaires."],"explanationEasy":"Le Conseil constitutionnel vérifie que les lois respectent la Constitution. Il contrôle aussi que les élections nationales sont régulières.","whyEasy":["La Cour des comptes contrôle les dépenses de l'État.","Les tribunaux jugent les crimes et les délits.","Le gouvernement ou les parlementaires proposent les lois."]},{"id":72,"question":"Quelle condition est obligatoire pour se présenter à l'élection présidentielle ?","
