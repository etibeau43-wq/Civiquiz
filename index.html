answers":["Avoir recueilli 500 parrainages d'élus","Être français, majeur et jouir de ses droits civiques","Ne pas être inéligible (condamnation judiciaire)"],"distractors":["Avoir au moins 35 ans","Être membre d'un parti politique depuis plus de cinq ans","Avoir recueilli 5 000 parrainages d'élus"],"explanation":"Il faut être français, majeur, jouir de ses droits civiques, ne pas être inéligible et recueillir 500 parrainages d'élus.","why":["L'âge minimum est de 18 ans, pas de 35.","Aucune adhésion à un parti n'est exigée.","Le seuil est de 500 parrainages, pas de 5 000."],"explanationEasy":"Pour être candidat, il faut être français, majeur et avoir ses droits civiques. Il ne faut pas être inéligible (interdit de se présenter). Il faut aussi 500 parrainages d'élus.","whyEasy":["L'âge minimum est de 18 ans, pas de 35 ans.","On n'a pas besoin d'être membre d'un parti.","Il faut 500 parrainages, pas 5 000."]},{"id":73,"question":"Combien y a-t-il de départements en France ?","answers":["101"],"distractors":["96","100","103"],"explanation":"La France compte 101 départements : 96 en métropole et 5 outre-mer (Guadeloupe, Martinique, Guyane, La Réunion, Mayotte).","why":["96 est le nombre de départements métropolitains seulement.","Il y en avait 100 avant que Mayotte devienne département en 2011.","103 est un nombre inexact : il n'y a que 101 départements."],"explanationEasy":"La France compte 101 départements. Il y en a 96 en métropole et 5 outre-mer : la Guadeloupe, la Martinique, la Guyane, La Réunion et Mayotte.","whyEasy":["96 est le nombre de départements en métropole seulement.","Il y avait 100 départements avant que Mayotte devienne un département en 2011.","103 n'est pas le bon nombre. Il y a 101 départements."]},{"id":74,"question":"Comment est organisé le découpage administratif de la France ?","answers":["Régions, départements, communes"],"distractors":["Provinces, comtés, communes","États, régions, communes","Régions, provinces, villages"],"explanation":"La France est organisée en régions, départements et communes.","why":["Provinces et comtés ne sont pas des échelons actuels.","La France n'est pas un État fédéral : il n'y a pas d'« États ».","Les provinces ont disparu à la Révolution et le village n'est pas un échelon administratif : l'échelon de base est la commune."],"explanationEasy":"La France est organisée en régions, départements et communes.","whyEasy":["Les provinces et les comtés ne sont plus des niveaux actuels.","La France n'est pas un État fédéral. Elle n'a pas d'« États ».","Les provinces ont disparu à la Révolution. Le village n'est pas un niveau administratif : c'est la commune."]},{"id":75,"question":"Qui représente l'État dans un département ?","answers":["Le préfet"],"distractors":["Le maire","Le recteur","Le député"],"explanation":"Le préfet représente l'État et le gouvernement dans le département.","why":["Le maire représente la commune.","Le recteur représente l'État pour l'éducation, dans l'académie.","Le député représente les citoyens au Parlement."],"explanationEasy":"Le préfet représente l'État et le gouvernement dans le département.","whyEasy":["Le maire représente la commune.","Le recteur représente l'État pour l'éducation, dans l'académie.","Le député représente les citoyens au Parlement."]},{"id":76,"question":"Quel est le rôle du Président de la République ?","answers":["Il est le chef de l'Etat","Il est le garant de la Constitution et de l'intégrité du territoire","Il nomme le Premier ministre et préside le Conseil des ministres","Il est le chef des armées et promulgue les lois"],"distractors":["Il vote les lois avec les députés et les sénateurs","Il rend la justice dans les affaires criminelles","Il préside l'Assemblée nationale"],"explanation":"Le Président est le chef de l'État, garant de la Constitution, chef des armées ; il nomme le Premier ministre, préside le Conseil des ministres et promulgue les lois.","why":["Le Parlement vote les lois.","La justice est rendue par les juges.","L'Assemblée nationale est présidée par un député."],"explanationEasy":"Le Président est le chef de l'État. Il garantit la Constitution et il est chef des armées. Il nomme le Premier ministre et préside le Conseil des ministres. Il promulgue les lois (il les signe pour qu'elles s'appliquent).","whyEasy":["Le Parlement vote les lois, pas le Président.","Les juges rendent la justice.","Un député préside l'Assemblée nationale."]},{"id":77,"question":"Quel est le rôle du Premier ministre ?","answers":["Il dirige l'action du Gouvernement","Il assure l'exécution des lois et dirige l'administration","Il est responsable devant le Parlement"],"distractors":["Il est le chef de l'État","Il est élu au suffrage universel direct","Il préside l'Assemblée nationale"],"explanation":"Le Premier ministre dirige l'action du Gouvernement, assure l'exécution des lois et est responsable devant le Parlement.","why":["Le chef de l'État est le Président.","Il est nommé par le Président, pas élu directement.","L'Assemblée nationale est présidée par un député."],"explanationEasy":"Le Premier ministre dirige l'action du Gouvernement. Il assure l'exécution des lois. Il est responsable devant le Parlement.","whyEasy":["Le chef de l'État est le Président.","Le Président nomme le Premier ministre. Les citoyens ne l'élisent pas.","Un député préside l'Assemblée nationale."]},{"id":78,"question":"Quel est le rôle du Défenseur des droits ?","answers":["Veiller au respect des droits et libertés et lutter contre les discriminations","Veiller au respect des droits et libertés","Lutter contre les discriminations","Défendre les droits des usagers des services publics (litige avec une administration)","Défendre les droits de l'enfant et contrôler le comportement des forces de sécurité (police, gendarmerie)"],"distractors":["Juger les citoyens qui commettent des délits","Voter les lois qui protègent les citoyens","Assurer la sécurité des citoyens sur le territoire"],"explanation":"Le Défenseur des droits est une autorité indépendante chargée de défendre les droits et libertés et de lutter contre les discriminations.","why":["Il ne juge pas : seuls les tribunaux jugent.","Il ne vote pas les lois : c'est le Parlement.","La sécurité relève de la police et de la gendarmerie."],"explanationEasy":"Le Défenseur des droits est une autorité indépendante. Il défend les droits et les libertés. Il lutte contre les discriminations.","whyEasy":["Il ne juge pas. Seuls les tribunaux jugent.","Il ne vote pas les lois. Le Parlement les vote.","La police et la gendarmerie assurent la sécurité."]},{"id":79,"question":"En quelle année la citoyenneté européenne a-t-elle été créée ?","answers":["1992 (Traité de Maastricht)"],"distractors":["1957 (traité de Rome)","1985 (accords de Schengen)","2002 (arrivée de l'euro)"],"explanation":"La citoyenneté européenne est créée par le traité de Maastricht (1992).","why":["1957 : traité de Rome, qui crée la CEE.","1985 : accords de Schengen (libre circulation).","2002 : l'euro entre en circulation."],"explanationEasy":"Le traité de Maastricht (1992) crée la citoyenneté européenne.","whyEasy":["En 1957, le traité de Rome crée la CEE.","En 1985, les accords de Schengen créent la libre circulation.","En 2002, l'euro entre en circulation."]},{"id":80,"question":"Quel est le dernier Etat à avoir intégré l'Union Européenne en 2013 ?","answers":["La Croatie"],"distractors":["La Bulgarie","La Roumanie","La Serbie"],"explanation":"La Croatie est entrée dans l'Union européenne le 1er juillet 2013.","why":["La Bulgarie a adhéré en 2007.","La Roumanie a adhéré en 2007.","La Serbie est candidate mais n'est pas membre."],"explanationEasy":"La Croatie entre dans l'Union européenne le 1er juillet 2013.","whyEasy":["La Bulgarie est entrée dans l'Union en 2007.","La Roumanie est entrée dans l'Union en 2007.","La Serbie veut entrer dans l'Union, mais elle n'est pas membre."]},{"id":81,"question":"Qui a composé l'hymne de l'Union européenne ?","answers":["Ludwig van Beethoven"],"distractors":["Wolfgang Amadeus Mozart","Johann Sebastian Bach","Richard Wagner"],"explanation":"L'hymne européen reprend l'« Ode à la joie » de la 9e symphonie de Beethoven.","why":["Mozart est un compositeur autrichien, mais il n'a pas composé l'hymne européen.","Bach est un compositeur allemand du XVIIIe siècle ; il n'a pas composé l'hymne européen.","Wagner est un compositeur allemand du XIXe siècle ; il n'a pas composé l'hymne européen."],"explanationEasy":"L'hymne européen reprend l'« Ode à la joie ». C'est un morceau de la 9e symphonie de Beethoven.","whyEasy":["Mozart est un compositeur autrichien. Il n'a pas composé l'hymne européen.","Bach est un compositeur allemand du XVIIIe siècle. Il n'a pas composé l'hymne européen.","Wagner est un compositeur allemand du XIXe siècle. Il n'a pas composé l'hymne européen."]},{"id":82,"question":"Quand est célébrée la journée de l'Europe ?","answers":["Le 9 mai"],"distractors":["Le 8 mai","Le 25 mars","Le 1er mai"],"explanation":"La Journée de l'Europe est le 9 mai, en souvenir de la déclaration de Robert Schuman (9 mai 1950).","why":["Le 8 mai commémore la fin de la Seconde Guerre mondiale en Europe.","Le 25 mars 1957 : signature du traité de Rome.","Le 1er mai est la Fête du Travail."],"explanationEasy":"La Journée de l'Europe est le 9 mai. Elle rappelle la déclaration de Robert Schuman du 9 mai 1950.","whyEasy":["Le 8 mai rappelle la fin de la Seconde Guerre mondiale en Europe.","Le 25 mars 1957, on signe le traité de Rome.","Le 1er mai est la Fête du Travail."]},{"id":83,"question":"Où est le siège de la Banque centrale européenne ?","answers":["Francfort"],"distractors":["Bruxelles","Strasbourg","Luxembourg"],"explanation":"La Banque centrale européenne a son siège à Francfort (Allemagne).","why":["Bruxelles accueille la Commission européenne.","Strasbourg accueille le Parlement européen.","Luxembourg accueille la Cour de justice de l'UE."],"explanationEasy":"La Banque centrale européenne a son siège à Francfort, en Allemagne.","whyEasy":["Bruxelles accueille la Commission européenne.","Strasbourg accueille le Parlement européen.","Luxembourg accueille la Cour de justice de l'UE."]},{"id":84,"question":"Où est le siège de la Commission européenne ?","answers":["Bruxelles"],"distractors":["Strasbourg","Luxembourg","Francfort"],"explanation":"La Commission européenne siège à Bruxelles.","why":["Strasbourg accueille le Parlement européen.","Luxembourg accueille la Cour de justice de l'UE.","Francfort accueille la Banque centrale européenne."],"explanationEasy":"La Commission européenne a son siège à Bruxelles.","whyEasy":["Strasbourg accueille le Parlement européen.","Luxembourg accueille la Cour de justice de l'UE.","Francfort accueille la Banque centrale européenne."]},{"id":85,"question":"Qui siège au Parlement européen ?","answers":["Des eurodéputés élus par les citoyens des États membres","Des eurodéputés (ou députés européens)","Des représentants élus directement par les citoyens européens"],"distractors":["Les chefs d'État et de gouvernement des pays membres","Les ministres des États membres","Des commissaires européens nommés par les gouvernements"],"explanation":"Le Parlement européen est composé d'eurodéputés élus tous les 5 ans par les citoyens des États membres.","why":["Les chefs d'État et de gouvernement siègent au Conseil européen.","Les ministres siègent au Conseil de l'Union européenne.","Les commissaires siègent à la Commission, pas au Parlement."],"explanationEasy":"Le Parlement européen réunit des eurodéputés. Les citoyens des États membres les élisent tous les 5 ans.","whyEasy":["Les chefs d'État et de gouvernement siègent au Conseil européen.","Les ministres siègent au Conseil de l'Union européenne.","Les commissaires siègent à la Commission, pas au Parlement."]},{"id":86,"question":"Les citoyens de l'Union européenne peuvent-ils voter aux élections locales dans un autre Etat de l'Union ?","answers":["Oui"],"distractors":["Non","Non, seulement aux élections européennes","Oui, mais seulement après 10 ans de résidence"],"explanation":"Les citoyens européens qui résident dans un autre État membre peuvent voter (et être candidats) aux élections municipales et européennes de leur lieu de résidence, mais pas aux élections nationales. En France, ils ne peuvent toutefois pas devenir maire ou adjoint.","why":["Le droit de vote aux élections locales leur est bien ouvert.","Ils votent aussi aux municipales, pas seulement aux européennes.","Aucune durée de résidence de 10 ans n'est exigée."],"explanationEasy":"Un citoyen européen habite dans un autre pays de l'Union. Il peut voter aux élections municipales et européennes. Il peut aussi être candidat. Il ne vote pas aux élections nationales. En France, ils ne peuvent pas être maire ni adjoint.","whyEasy":["Ils ont bien le droit de voter aux élections locales.","Ils votent aussi aux élections municipales, pas seulement aux européennes.","On n'exige pas 10 ans de résidence."]},{"id":87,"question":"Combien d'États font partie de l'Union européenne au 1er janvier 2025 ?","answers":["27"],"distractors":["25","28","30"],"explanation":"Depuis le départ du Royaume-Uni (2020), l'Union européenne compte 27 États membres.","why":["L'Union a compté 25 États de 2004 à 2006 ; elle en compte 27 aujourd'hui.","Elle en comptait 28 avant le Brexit.","Il n'y a pas 30 États membres : l'Union en compte 27."],"explanationEasy":"Le Royaume-Uni part de l'Union en 2020. Depuis, l'Union européenne compte 27 États membres.","whyEasy":["L'Union a eu 25 États de 2004 à 2006. Elle en a 27 aujourd'hui.","Elle avait 28 membres avant le Brexit.","Il n'y a pas 30 États membres. L'Union en a 27."]},{"id":88,"question":"En quelle année le traité de Maastricht, qui marque la fondation de l'Union européenne, a-t-il été signé ?","answers":["1992"],"distractors":["1957","1986","1999"],"explanation":"Le traité de Maastricht, signé en 1992, fonde l'Union européenne (en vigueur en 1993).","why":["1957 : traité de Rome (CEE).","1986 : Acte unique européen.","1999 : lancement de l'euro (sous forme virtuelle)."],"explanationEasy":"Le traité de Maastricht est signé en 1992. Il fonde l'Union européenne. Il entre en vigueur en 1993.","whyEasy":["1957 : c'est le traité de Rome, qui crée la CEE.","En 1986, on signe l'Acte unique européen, pas le traité de Maastricht.","En 1999, on lance l'euro sous forme non physique, pour les virements. Ce n'est pas Maastricht."]},{"id":89,"question":"Quel traité concerne la construction de l'Union européenne ?","answers":["Le traité de Maastricht (1992) pour la création de l'Union européenne","Le traité de Rome (1957) pour la création de la CEE"],"distractors":["Le traité de Versailles (1919) pour mettre fin à la Première Guerre mondiale","Le traité de Westphalie (1648) pour mettre fin à la guerre de Trente Ans","Le traité de Tordesillas (1494) pour partager le Nouveau Monde"],"explanation":"Le traité de Maastricht (1992) crée l'Union européenne ; le traité de Rome (1957) crée la CEE.","why":["Versailles (1919) met fin à la Première Guerre mondiale.","Westphalie (1648) met fin à la guerre de Trente Ans.","Tordesillas (1494) partage le Nouveau Monde entre l'Espagne et le Portugal."],"explanationEasy":"Le traité de Maastricht (1992) crée l'Union européenne. Le traité de Rome (1957) crée la CEE.","whyEasy":["Le traité de Versailles (1919) met fin à la Première Guerre mondiale.","Le traité de Westphalie (1648) met fin à la guerre de Trente Ans.","Le traité de Tordesillas (1494) partage le Nouveau Monde entre l'Espagne et le Portugal."]},{"id":90,"question":"Quel État a quitté l'Union Européenne en 2020 ?","answers":["Le Royaume-Uni"],"distractors":["L'Irlande","Le Danemark","La Pologne"],"explanation":"Le Royaume-Uni a quitté l'Union européenne le 31 janvier 2020 (Brexit).","why":["L'Irlande est toujours membre.","Le Danemark est toujours membre.","La Pologne est toujours membre."],"explanationEasy":"Le Royaume-Uni quitte l'Union européenne le 31 janvier 2020. On appelle cela le Brexit.","whyEasy":["L'Irlande est toujours membre de l'Union.","Le Danemark est toujours membre de l'Union.","La Pologne est toujours membre de l'Union."]},{"id":91,"question":"Quel est l'hymne de l'Union Européenne ?","answers":["L'Ode à la Joie"],"distractors":["Les Quatre Saisons","La Marche turque","Le Boléro"],"explanation":"L'« Ode à la joie » de Beethoven est l'hymne de l'Union européenne, jouée sans paroles.","why":["Les Quatre Saisons sont de Vivaldi.","La Marche turque est de Mozart.","Le Boléro est de Ravel."],"explanationEasy":"L'hymne de l'Union européenne est l'« Ode à la joie » de Beethoven. On la joue sans paroles.","whyEasy":["Les Quatre Saisons sont une œuvre de Vivaldi.","La Marche turque est une œuvre de Mozart.","Le Boléro est une œuvre de Ravel."]},{"id":92,"question":"De quoi est composé le drapeau européen ?","answers":["12 étoiles dorées sur fond bleu","Un cercle de 12 étoiles d'or"],"distractors":["27 étoiles dorées sur fond bleu","12 étoiles blanches sur fond rouge","Un cercle de 15 étoiles d'or"],"explanation":"Le drapeau européen : un cercle de 12 étoiles d'or sur fond bleu. Le nombre 12 symbolise l'unité, il ne dépend pas du nombre d'États.","why":["Le nombre d'étoiles est fixe : 12, pas 27.","Le fond est bleu et les étoiles sont dorées.","Il y a 12 étoiles, pas 15."],"explanationEasy":"Le drapeau européen a un cercle de 12 étoiles d'or sur fond bleu. Le nombre 12 symbolise l'unité. Il ne dépend pas du nombre d'États.","whyEasy":["Le nombre d'étoiles est fixe : 12, pas 27.","Le fond est bleu et les étoiles sont dorées.","Il y a 12 étoiles, pas 15."]},{"id":93,"question":"Qui élit les députés européens ?","answers":["Les citoyens des États membres"],"distractors":["Les gouvernements des États membres","Les parlements nationaux","La Commission européenne"],"explanation":"Les députés européens sont élus au suffrage universel direct par les citoyens des États membres (depuis 1979).","why":["Les gouvernements siègent au Conseil, ils n'élisent pas les eurodéputés.","Les parlements nationaux ne les élisent pas.","La Commission propose les textes, elle n'élit personne."],"explanationEasy":"Les citoyens des États membres élisent les députés européens. Ils votent directement depuis 1979.","whyEasy":["Les gouvernements siègent au Conseil. Ils n'élisent pas les eurodéputés.","Les parlements nationaux n'élisent pas les eurodéputés.","La Commission propose les textes. Elle n'élit personne."]},{"id":94,"question":"Où est le siège du Parlement européen ?","answers":["Strasbourg"],"distractors":["Bruxelles","Francfort","Luxembourg"],"explanation":"Le siège officiel du Parlement européen est à Strasbourg (sessions plénières) ; il se réunit aussi à Bruxelles.","why":["Bruxelles accueille des réunions complémentaires et les commissions.","Francfort est le siège de la Banque centrale européenne.","Luxembourg accueille le secrétariat général et la Cour de justice."],"explanationEasy":"Le siège officiel du Parlement européen est à Strasbourg. Les grandes séances ont lieu là-bas. Le Parlement se réunit aussi à Bruxelles.","whyEasy":["Bruxelles accueille des réunions en plus, et les commissions.","Francfort est le siège de la Banque centrale européenne.","Luxembourg accueille le secrétariat général et la Cour de justice."]}]},{"theme":"Droits et devoirs","questions":[{"id":95,"question":"À quoi sert le droit de grève ?","answers":["À permettre aux salariés de cesser collectivement le travail pour défendre leurs intérêts professionnels","À défendre les intérêts professionnels des salariés","À revendiquer de meilleures conditions de travail ou de salaire","Il permet aux salariés de cesser collectivement le travail pour faire aboutir des revendications"],"distractors":["À permettre à un salarié de s'absenter quand il le souhaite sans prévenir","À permettre aux salariés de prendre le contrôle de l'entreprise","À autoriser les salariés à voter les lois sur le travail"],"explanation":"Le droit de grève permet aux salariés de cesser collectivement le travail pour défendre leurs intérêts professionnels et faire aboutir leurs revendications.","why":["Un salarié ne peut pas s'absenter librement.","Les salariés ne prennent pas le contrôle de l'entreprise.","Seul le Parlement vote les lois."],"explanationEasy":"Le droit de grève permet aux salariés d'arrêter le travail ensemble. Ils défendent ainsi leurs intérêts professionnels et leurs demandes.","whyEasy":["Un salarié ne peut pas s'absenter quand il veut.","Les salariés ne prennent pas le contrôle de l'entreprise.","Seul le Parlement vote les lois."]},{"id":96,"question":"Au nom de quoi l'État justifie-t-il la restriction des droits ?","answers":["Pour préserver l'ordre public et la sécurité","Pour l'intérêt général et la sécurité de tous","Au nom de l'intérêt général","Pour protéger les droits et libertés d'autrui"],"distractors":["Au nom des intérêts du gouvernement en place","Au nom de la majorité parlementaire","Au nom de la religion majoritaire"],"explanation":"Les droits peuvent être limités pour préserver l'ordre public, la sécurité, l'intérêt général ou les droits d'autrui, jamais par intérêt politique.","why":["Une restriction doit être prévue par la loi et servir l'intérêt général.","La majorité ne peut pas restreindre les droits à son profit.","L'État est laïque : aucune religion ne justifie des restrictions."],"explanationEasy":"L'État peut limiter les droits pour l'ordre public, la sécurité, l'intérêt général. Il peut aussi les limiter pour protéger les droits des autres. Il ne peut pas le faire pour un intérêt politique.","whyEasy":["Une limite doit être prévue par la loi et servir l'intérêt général.","La majorité ne peut pas limiter les droits pour son profit.","L'État est laïque. Aucune religion ne justifie une limite."]},{"id":97,"question":"Laquelle de ces citations est inscrite dans la Déclaration des Droits de l'Homme et du Citoyen de 1789 ?","answers":["\"Les hommes naissent et demeurent libres et égaux en droits.\" (Article 1)","\"La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui.\" (Article 4)","\"La loi est l'expression de la volonté générale.\" (Article 6)","\"Nul ne doit être inquiété pour ses opinions, même religieuses.\" (Article 10)","\"Tout homme étant présumé innocent jusqu'à ce qu'il ait été déclaré coupable.\" (Article 9)"],"distractors":["« Tous les hommes sont créés égaux. » (Déclaration d'indépendance américaine)","« La France est une République indivisible, laïque, démocratique et sociale. » (Constitution de 1958)","« Liberté, Égalité, Fraternité. » (devise de la République)"],"explanation":"L'article 1er de la Déclaration de 1789 dit : « Les hommes naissent et demeurent libres et égaux en droits. »","why":["Cette phrase vient de la Déclaration d'indépendance américaine (1776).","C'est l'article 1er de la Constitution de 1958.","C'est la devise de la République, inscrite à l'article 2 de la Constitution."],"explanationEasy":"L'article 1er de la Déclaration de 1789 dit : « Les hommes naissent et demeurent libres et égaux en droits ».","whyEasy":["Cette phrase vient de la Déclaration d'indépendance américaine (1776).","Cette phrase est l'article 1er de la Constitution de 1958.","C'est la devise de la République, à l'article 2 de la Constitution."]},{"id":98,"question":"L'article 4 de la Déclaration des droits de l'homme et du citoyen affirme que \"la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui\". Qu'est-ce que cela signifie ?","answers":["Que la liberté individuelle s'arrête là où commence celle des autres","Que la liberté est limitée par le respect des droits d'autrui et par la loi"],"distractors":["Que chacun peut faire ce qu'il veut, même si cela nuit aux autres","Que le gouvernement peut décider seul des limites de la liberté","Que la liberté n'existe que pour les citoyens français majeurs"],"explanation":"La liberté de chacun s'arrête là où commence celle des autres ; la loi fixe ces limites.","why":["Nuire aux autres n'est pas permis.","Les limites sont fixées par la loi, votée par le Parlement, et pas par le gouvernement seul.","La Déclaration de 1789 protège tous les hommes."],"explanationEasy":"La liberté de chacun s'arrête là où commence celle des autres. La loi fixe ces limites.","whyEasy":["On n'a pas le droit de nuire aux autres.","Les limites sont fixées par la loi, votée par le Parlement. Le gouvernement ne décide pas seul.","La Déclaration de 1789 protège tous les hommes."]},{"id":99,"question":"Que dit l'article 1er de la Constitution française ?","answers":["La France est une République indivisible, laïque, démocratique et sociale"],"distractors":["La France est une République fédérale, laïque et démocratique","La France est une monarchie constitutionnelle, laïque et sociale","La France est une République indivisible, catholique et sociale"],"explanation":"Article 1er : « La France est une République indivisible, laïque, démocratique et sociale. »","why":["La France n'est pas fédérale.","La France n'est pas une monarchie.","La France est laïque, pas catholique."],"explanationEasy":"L'article 1er dit : « La France est une République indivisible, laïque, démocratique et sociale ».","whyEasy":["La France n'est pas fédérale. Elle est indivisible.","La France n'est pas une monarchie.","La France est laïque, pas catholique."]},{"id":100,"question":"Que garantit la liberté de la presse ?","answers":["Que les journalistes peuvent informer librement le public et exprimer leurs opinions","Que les médias peuvent publier des informations sans censure préalable de l'État","La liberté de diffuser des opinions, prévue par la loi du 29 juillet 1881","Le pluralisme des médias et l'indépendance des journalistes"],"distractors":["Que seuls les médias publics ont le droit de publier de l'information","Que les médias doivent faire valider leurs articles par le gouvernement avant publication","Que chacun peut publier n'importe quoi sans jamais être sanctionné"],"explanation":"La liberté de la presse (loi du 29 juillet 1881) : informer sans censure préalable, avec responsabilité en cas d'abus.","why":["Les médias privés sont libres de publier.","Aucune validation préalable par le gouvernement n'est exigée.","Les abus (diffamation, injures) sont sanctionnés."],"explanationEasy":"La liberté de la presse vient de la loi du 29 juillet 1881. On peut informer sans contrôle avant la publication. Les abus sont punis.","whyEasy":["Les médias privés ont aussi le droit de publier.","Le gouvernement ne valide rien avant la publication.","Les abus, comme la diffamation et les injures, sont punis."]},{"id":101,"question":"Que permet la liberté de circulation ?","answers":["De circuler librement sur le territoire français et dans l'Union européenne","Le droit d'aller et venir librement sur l'ensemble du territoire national","Le droit de choisir librement son lieu de résidence (son domicile)","Le droit de se déplacer d'une ville à une autre sans autorisation"],"distractors":["Le droit de voyager sans passeport dans tous les pays du monde","Le droit d'entrer dans les propriétés privées sans autorisation","Le droit de circuler sur le territoire seulement avec l'autorisation de la préfecture"],"explanation":"La liberté de circulation permet d'aller et venir librement sur le territoire, sans autorisation, et dans l'Union européenne.","why":["Une pièce d'identité reste souvent exigée aux frontières.","La propriété privée est protégée.","Aucune autorisation préalable n'est nécessaire."],"explanationEasy":"La liberté de circulation permet d'aller et venir librement dans le pays, sans autorisation. Elle s'applique aussi dans l'Union européenne.","whyEasy":["On doit souvent montrer une pièce d'identité aux frontières.","La propriété privée est protégée : on n'y entre pas sans autorisation.","Aucune autorisation de la préfecture n'est nécessaire."]},{"id":102,"question":"Que signifie être citoyen d'un État ?","answers":["Avoir la nationalité de cet État, avec des droits et des devoirs","Avoir des droits (notamment de vote) et des devoirs envers cet État","Participer à la souveraineté nationale"],"distractors":["Habiter dans une ville de l'État depuis plus de dix ans","Avoir des devoirs envers l'État, mais aucun droit","Travailler dans une administration de l'État"],"explanation":"Être citoyen, c'est avoir la nationalité de l'État, des droits (vote, etc.) et des devoirs (respecter la loi, payer l'impôt) et participer à la souveraineté nationale.","why":["Habiter longtemps quelque part ne suffit pas à faire un citoyen.","Un citoyen a des droits et des devoirs.","Il n'est pas nécessaire d'être fonctionnaire."],"explanationEasy":"Un citoyen a la nationalité de l'État. Il a des droits, comme le vote. Il a des devoirs : respecter la loi et payer l'impôt. Il participe à la souveraineté nationale (le pouvoir du peuple).","whyEasy":["Habiter longtemps quelque part ne suffit pas pour être citoyen.","Un citoyen a des droits et des devoirs.","Il n'est pas nécessaire d'être fonctionnaire."]},{"id":103,"question":"Que sont les droits fondamentaux ?","answers":["Des droits essentiels et inaliénables garantis par la Constitution","Des droits essentiels garantis par la Constitution et les textes internationaux","Des libertés inaliénables que l'État ne peut pas supprimer"],"distractors":["Des droits accordés par le Président de la République, qu'il peut retirer","Des droits réservés aux personnes de nationalité française","Des privilèges accordés selon le métier exercé"],"explanation":"Les droits fondamentaux (liberté, égalité, sûreté, propriété…) sont garantis par la Constitution et les textes internationaux.","why":["L'État ne peut pas les retirer à sa guise.","Beaucoup concernent toute personne, pas seulement les Français.","Ce ne sont pas des privilèges liés à un métier."],"explanationEasy":"Les droits fondamentaux sont la liberté, l'égalité, la sûreté, la propriété… La Constitution et les textes internationaux les garantissent.","whyEasy":["L'État ne peut pas les retirer comme il veut.","Beaucoup de ces droits concernent toute personne, pas seulement les Français.","Ce ne sont pas des privilèges liés à un métier."]},{"id":104,"question":"Quel droit protège une personne contre une arrestation arbitraire ?","answers":["Le droit à la sûreté"],"distractors":["Le droit de propriété","Le droit à la liberté d'expression","Le droit au respect de la vie privée"],"explanation":"Le droit à la sûreté (articles 2 et 7 de la Déclaration de 1789) protège contre les arrestations et détentions arbitraires.","why":["Le droit de propriété protège les biens.","La liberté d'expression protège la parole.","Le respect de la vie privée protège l'intimité."],"explanationEasy":"Le droit à la sûreté protège contre les arrestations arbitraires (articles 2 et 7 de la Déclaration de 1789). Il protège aussi contre les détentions arbitraires. Arbitraire veut dire : sans raison prévue par la loi.","whyEasy":["Le droit de propriété protège les biens.","La liberté d'expression protège la parole.","Le respect de la vie privée protège l'intimité."]},{"id":105,"question":"Quel est le texte fondateur établissant les droits et les devoirs de chaque citoyen ?","answers":["La Déclaration des Droits de l'Homme et du Citoyen de 1789"],"distractors":["Le Code civil de 1804, rédigé sous Napoléon Ier","La Déclaration universelle des droits de l'homme de 1948","La loi de séparation des Églises et de l'État de 1905"],"explanation":"La Déclaration des droits de l'homme et du citoyen de 1789 est le texte fondateur des droits et devoirs ; elle fait partie du bloc de constitutionnalité.","why":["Le Code civil (1804) organise le droit privé.","La Déclaration universelle de 1948 est un texte de l'ONU, postérieur ; le texte fondateur français des droits du citoyen est celui de 1789.","La loi de 1905 concerne la laïcité."],"explanationEasy":"La Déclaration des droits de l'homme et du citoyen (1789) est le texte de base. Elle donne les droits et les devoirs. Elle fait partie du bloc de constitutionnalité (les textes de valeur constitutionnelle).","whyEasy":["Le Code civil (1804) organise le droit privé.","La Déclaration de 1948 est un texte de l'ONU, plus récent. Le texte de base en France est celui de 1789.","La loi de 1905 concerne la laïcité."]},{"id":106,"question":"Quel texte affirme que tous les hommes naissent libres et égaux en droits ?","answers":["La Déclaration des Droits de l'Homme et du Citoyen de 1789"],"distractors":["La Constitution de la Ve République adoptée en 1958","La loi de séparation des Églises et de l'État de 1905","La Déclaration des droits de la femme et de la citoyenne de 1791"],"explanation":"L'article 1er de la Déclaration de 1789 affirme que les hommes naissent et demeurent libres et égaux en droits.","why":["La Constitution de 1958 organise les institutions.","La loi de 1905 sépare les Églises et l'État.","La Déclaration de 1791 est celle d'Olympe de Gouges, sur les droits des femmes."],"explanationEasy":"L'article 1er de la Déclaration de 1789 le dit. Les hommes naissent et restent libres et égaux en droits.","whyEasy":["La Constitution de 1958 organise les institutions.","La loi de 1905 sépare les Églises et l'État.","La Déclaration de 1791 est celle d'Olympe de Gouges. Elle parle des droits des femmes."]},{"id":107,"question":"Quelle situation est une atteinte à la dignité humaine ?","answers":["Être employé par une entreprise sans être rémunéré","Être soumis à des conditions de travail ou de vie dégradantes (esclavage moderne)","Subir des tortures ou des traitements inhumains","Être traité comme un objet ou une marchandise (traite des êtres humains)"],"distractors":["Être contrôlé par la police dans la rue","Être licencié avec un préavis","Payer des impôts sur le revenu"],"explanation":"Portent atteinte à la dignité : la traite, l'esclavage moderne, le travail non rémunéré ou dans des conditions dégradantes, la torture.","why":["Un contrôle d'identité est légal.","Un licenciement avec préavis est légal.","Payer l'impôt est un devoir."],"explanationEasy":"Des conditions de travail ou de vie dégradantes portent atteinte à la dignité. Voici des exemples : la traite, l'esclavage moderne, le travail non payé et la torture.","whyEasy":["Un contrôle d'identité est légal.","Un licenciement avec préavis est légal.","Payer l'impôt est un devoir, pas une atteinte à la dignité."]},{"id":108,"question":"Qu'est-ce que la liberté d'expression ?","answers":["Le droit de communiquer ses idées et opinions, dans le respect de la loi","La liberté de communication des pensées, sauf abus réprimés par la loi"],"distractors":["Le droit de dire n'importe quoi, même d'insulter, sans aucune limite","Le droit de s'exprimer uniquement dans les médias","Le droit de parler seulement des sujets autorisés par l'État"],"explanation":"La liberté d'expression : communiquer ses idées et opinions, sauf abus réprimés par la loi (injure, diffamation, haine).","why":["Elle a des limites.","Elle s'exerce partout, pas seulement dans les médias.","L'État ne choisit pas les sujets."],"explanationEasy":"La liberté d'expression permet de dire ses idées et ses opinions. La loi punit les abus : injure, diffamation, haine.","whyEasy":["Elle a des limites fixées par la loi.","Elle s'exerce partout, pas seulement dans les médias.","L'État ne choisit pas les sujets dont on peut parler."]},{"id":109,"question":"Suite à une interpellation par la police, il est possible de :","answers":["Être assisté par un avocat","Garder le silence (ne pas répondre aux questions)","Faire prévenir un proche (ou son employeur)","Demander à voir un médecin"],"distractors":["Refuser de donner son identité","Exiger d'être jugé immédiatement","Choisir soi-même les policiers qui l'interrogent"],"explanation":"Après une interpellation, on peut être assisté d'un avocat, garder le silence, faire prévenir un proche et demander un médecin.","why":["Il faut décliner son identité.","On ne peut pas exiger d'être jugé immédiatement.","On ne choisit pas les policiers qui mènent l'interrogatoire."],"explanationEasy":"Après une interpellation, on peut avoir un avocat et garder le silence. On peut aussi faire prévenir un proche et demander un médecin.","whyEasy":["On doit donner son identité.","On ne peut pas exiger d'être jugé tout de suite.","On ne choisit pas les policiers qui posent les questions."]},{"id":110,"question":"Tous les citoyens français ont-ils une religion ?","answers":["Non, la religion est un choix individuel (liberté de conscience)","Non, chacun est libre de croire ou de ne pas croire"],"distractors":["Oui, tous les citoyens français sont de religion catholique","Oui, chaque citoyen doit déclarer sa religion à l'état civil","Oui, la religion est obligatoire pour obtenir la nationalité"],"explanation":"La liberté de conscience : chacun est libre de croire, de ne pas croire, d'avoir ou non une religion.","why":["Il n'y a pas de religion obligatoire en France.","La religion n'est jamais déclarée à l'état civil.","La nationalité ne dépend pas de la religion."],"explanationEasy":"La liberté de conscience permet de croire ou de ne pas croire. On peut avoir une religion ou non.","whyEasy":["En France, aucune religion n'est obligatoire.","On ne déclare jamais sa religion à l'état civil.","La nationalité ne dépend pas de la religion."]},{"id":111,"question":"À quel âge est la majorité numérique en France ?","answers":["15 ans"],"distractors":["13 ans","16 ans","18 ans"],"explanation":"La majorité numérique est fixée à 15 ans par la loi de 2023 : en dessous, l'accord d'un parent est prévu pour s'inscrire sur un réseau social. Cette règle n'est pas encore appliquée en pratique.","why":["13 ans est le seuil minimal possible dans l'Union européenne, pas celui choisi par la France.","16 ans est le seuil par défaut du RGPD, mais la France l'a fixé à 15 ans.","18 ans est la majorité civile, pas la majorité numérique."],"explanationEasy":"La majorité numérique est de 15 ans. Avant 15 ans, la loi prévoit l'accord d'un parent pour s'inscrire sur un réseau social. Cette règle n'est pas encore appliquée en pratique.","whyEasy":["13 ans est le minimum possible en Europe. La France a choisi 15 ans.","16 ans est l'âge par défaut en Europe. La France a choisi 15 ans.","18 ans est la majorité civile, pas la majorité numérique."]},{"id":112,"question":"Dans lequel de ces endroits est-on autorisé à fumer ?","answers":["Dans la rue (en dehors des lieux où c'est interdit : abords des écoles, parcs, plages, abribus…)","Dans un lieu privé. (domicile par exemple)"],"distractors":["Dans un restaurant","Dans les transports en commun","Dans les locaux d'une administration"],"explanation":"On peut fumer dans la rue et dans un lieu privé, sauf dans certains espaces extérieurs (abords des écoles, parcs, plages, abribus). C'est interdit dans les lieux fermés accueillant du public, les transports en commun et les locaux de travail collectifs.","why":["Interdit dans les lieux fermés et couverts accueillant du public.","Interdit dans les transports en commun.","Interdit dans les locaux de travail collectifs."],"explanationEasy":"On peut fumer dans la rue et dans un lieu privé, sauf près des écoles, dans les parcs, sur les plages et aux abribus. C'est interdit dans les lieux fermés qui accueillent du public. C'est aussi interdit dans les transports en commun et dans les locaux de travail collectifs.","whyEasy":["Fumer est interdit dans les lieux fermés et couverts qui accueillent du public.","Fumer est interdit dans les transports en commun.","Fumer est interdit dans les locaux de travail collectifs."]},{"id":113,"question":"En France, la conduite sans permis d'une moto est :","answers":["Une infraction grave","Un délit (puni par la loi)","Interdite et passible de prison et d'amende (jusqu'à 15 000 €)"],"distractors":["Une simple erreur sans sanction possible","Autorisée pour les trajets de moins de 10 km","Une contravention de 11 euros"],"explanation":"Conduire une moto sans permis est un délit, puni de prison et d'amende (jusqu'à 1 an et 15 000 euros).","why":["C'est une infraction sanctionnée.","La distance du trajet ne change rien.","Ce n'est pas une simple contravention : c'est un délit."],"explanationEasy":"Conduire une moto sans permis est un délit. La loi punit de prison et d'amende : jusqu'à 1 an et 15 000 euros.","whyEasy":["La loi punit cette infraction.","La longueur du trajet ne change rien.","Ce n'est pas une simple contravention. C'est un délit."]},{"id":114,"question":"En quoi consiste le devoir de solidarité ?","answers":["À contribuer au bien commun (impôts, cotisations) et à porter secours","Contribuer au financement de la protection sociale et porter secours","Payer l'impôt et assister les personnes en danger"],"distractors":["À donner la moitié de ses revenus à des associations","À héberger chez soi toute personne qui en fait la demande","À faire du bénévolat obligatoire chaque semaine"],"explanation":"Le devoir de solidarité : contribuer au bien commun (impôts, cotisations) et porter secours à une personne en danger.","why":["La loi n'impose pas de donner la moitié de ses revenus.","Elle n'impose pas d'héberger des inconnus.","Le bénévolat n'est pas obligatoire."],"explanationEasy":"Le devoir de solidarité, c'est contribuer au bien commun (impôts, cotisations). C'est aussi porter secours à une personne en danger.","whyEasy":["La loi n'oblige pas à donner la moitié de ses revenus.","La loi n'oblige pas à loger des inconnus.","Le bénévolat n'est pas obligatoire."]},{"id":115,"question":"Est-ce légal d'être marié à plusieurs personnes en même temps ?","answers":["Non, la polygamie est interdite en France"],"distractors":["Oui, si les deux mariages ont lieu dans des pays différents","Oui, si la religion des époux l'autorise","Oui, à condition de le déclarer à la mairie"],"explanation":"La polygamie est interdite : on ne peut pas être marié à plusieurs personnes en même temps.","why":["Le Code civil interdit un second mariage avant la fin du premier, et la bigamie est un délit, même si le second mariage a lieu à l'étranger.","La loi civile prime sur les règles religieuses.","Une déclaration en mairie ne légalise pas un second mariage."],"explanationEasy":"La polygamie est interdite. On ne peut pas être marié à plusieurs personnes en même temps.","whyEasy":["Le Code civil interdit un second mariage. La bigamie est un délit, même si le second mariage a lieu à l'étranger.","La loi civile passe avant les règles religieuses.","Une déclaration en mairie ne rend pas un second mariage légal."]},{"id":116,"question":"Est-ce obligatoire de déclarer ses impôts chaque année en France ?","answers":["Oui, la déclaration est obligatoire chaque année pour toute personne qui a perçu des revenus (même non imposable)"],"distractors":["Non, seulement tous les trois ans","Non, uniquement pour les personnes qui paient de l'impôt","Non, seulement pour les personnes qui ont plus de 25 ans"],"explanation":"Chaque année, toute personne qui a perçu des revenus doit les déclarer, même si elle n'est pas imposable. Avec la déclaration automatique, il suffit de vérifier les informations préremplies si elles sont exactes.","why":["La déclaration est annuelle.","Même sans impôt à payer, la déclaration est obligatoire.","Il n'y a pas de condition d'âge."],"explanationEasy":"Chaque année, il faut déclarer ses revenus, même sans impôt à payer. Si la déclaration est automatique, il faut seulement vérifier les informations.","whyEasy":["La déclaration se fait chaque année.","Même sans impôt à payer, la déclaration est obligatoire.","Il n'y a pas de condition d'âge."]},{"id":117,"question":"Est-il obligatoire de porter secours à une personne en danger ?","answers":["Oui, c'est une obligation légale"],"distractors":["Non, c'est seulement un conseil moral","Non, seulement pour les médecins et les secouristes","Oui, mais seulement si on est de la famille de la personne"],"explanation":"Porter secours à une personne en danger est une obligation légale quand on peut le faire sans risque pour soi ou pour les autres (on peut aussi appeler les secours). Ne pas le faire est un délit : la non-assistance à personne en danger.","why":["Ce n'est pas qu'un conseil moral : c'est puni par la loi.","L'obligation concerne tout le monde, pas seulement les professionnels.","Il n'est pas nécessaire d'être de la famille."],"explanationEasy":"Porter secours à une personne en danger est une obligation de la loi, si on peut le faire sans danger pour soi. On peut aussi appeler les secours. Ne pas le faire est un délit : la non-assistance à personne en danger.","whyEasy":["Ce n'est pas seulement un conseil moral. La loi punit.","Cette obligation concerne tout le monde, pas seulement les professionnels.","Il n'est pas nécessaire d'être de la famille."]},{"id":118,"question":"Être juré d'assises est :","answers":["Un devoir civique obligatoire","Une participation directe des citoyens à la justice criminelle"],"distractors":["Un métier rémunéré par l'État","Un choix libre : on peut toujours refuser sans raison","Un poste réservé aux magistrats professionnels"],"explanation":"Être juré d'assises est un devoir civique : des citoyens tirés au sort participent au jugement des crimes, aux côtés de magistrats.","why":["Ce n'est pas un métier.","On ne peut pas refuser sans motif valable.","Ce ne sont pas uniquement des magistrats."],"explanationEasy":"Être juré d'assises est un devoir civique. Des citoyens tirés au sort jugent les crimes avec des magistrats.","whyEasy":["Ce n'est pas un métier.","On ne peut pas refuser sans bonne raison.","Les jurés ne sont pas tous des magistrats."]},{"id":119,"question":"La vente d'alcool en France est interdite aux personnes de moins de :","answers":["18 ans"],"distractors":["16 ans","17 ans","21 ans"],"explanation":"La vente et l'offre d'alcool aux mineurs (moins de 18 ans) sont interdites en France.","why":["16 ans est trop bas : l'interdiction concerne tous les mineurs, jusqu'à 18 ans.","17 ans est trop bas : l'interdiction concerne tous les mineurs, jusqu'à 18 ans.","21 ans est l'âge limite aux États-Unis, pas en France."],"explanationEasy":"En France, la loi interdit de vendre ou d'offrir de l'alcool aux mineurs. Les mineurs ont moins de 18 ans.","whyEasy":["16 ans est trop bas. L'interdiction va jusqu'à 18 ans.","17 ans est trop bas. L'interdiction va jusqu'à 18 ans.","21 ans est l'âge limite aux États-Unis, pas en France."]},{"id":120,"question":"Le non-respect du code de la route est :","answers":["Une infraction qui entraîne des sanctions (amende, retrait de points)","Une contravention ou un délit selon la gravité"],"distractors":["Un simple conseil, sans aucune sanction","Une faute qui n'est sanctionnée que par un avertissement","Une infraction qui n'est sanctionnée qu'en cas d'accident"],"explanation":"Le non-respect du code de la route est une infraction : amende, retrait de points, voire suspension du permis, ou délit selon la gravité.","why":["C'est sanctionné.","Les sanctions ne se limitent pas à un avertissement.","On est sanctionné même sans accident (excès de vitesse…)."],"explanationEasy":"Ne pas respecter le code de la route est une infraction. La sanction peut être une amende, un retrait de points ou une suspension du permis. Selon la gravité, c'est parfois un délit.","whyEasy":["C'est puni par une sanction.","Il y a plus qu'un simple avertissement.","On est puni même sans accident, par exemple pour un excès de vitesse."]},{"id":121,"question":"Lequel de ces crimes ou délits peut entrainer la privation des droits civils et politiques par un juge ?","answers":["Un viol ou une agression sexuelle","Des actes de terrorisme","Une fraude électorale (tricher lors d'une élection)","Des faits de corruption ou de détournement de fonds publics (utiliser l'argent public pour soi)"],"distractors":["Un excès de vitesse de 10 km/h","Un stationnement gênant","Un tapage nocturne"],"explanation":"Un juge peut prononcer l'interdiction des droits civiques, civils et de famille pour certains crimes ou délits graves : viol, terrorisme, fraude électorale, corruption… Elle ne s'applique pas aux simples contraventions.","why":["Un petit excès de vitesse est une contravention.","Un stationnement gênant est une contravention.","Un tapage nocturne est une contravention."],"explanationEasy":"Un juge peut retirer les droits civils et politiques pour des crimes ou délits graves. Par exemple : viol, terrorisme, fraude électorale, corruption.","whyEasy":["Un petit excès de vitesse est une contravention. Ce n'est pas assez grave.","Un stationnement gênant est une contravention.","Un tapage nocturne est une contravention."]},{"id":122,"question":"Pour obtenir une carte d'identité, il faut :","answers":["Être de nationalité française"],"distractors":["Avoir plus de 18 ans","Être inscrit sur les listes électorales","Être titulaire d'un permis de conduire"],"explanation":"Pour obtenir une carte nationale d'identité, il faut être de nationalité française.","why":["Il n'y a pas d'âge minimum : même les enfants peuvent en avoir une.","L'inscription électorale n'est pas nécessaire.","Le permis de conduire n'est pas nécessaire."],"explanationEasy":"Pour obtenir une carte nationale d'identité, il faut être de nationalité française.","whyEasy":["Il n'y a pas d'âge minimum. Même les enfants peuvent en avoir une.","Il n'est pas nécessaire d'être inscrit sur les listes électorales.","Il n'est pas nécessaire d'avoir le permis de conduire."]},{"id":123,"question":"Pour quel motif peut-on limiter la liberté d'expression ?","answers":["Pour éviter la diffusion de propos discriminatoires","Pour sanctionner les provocations à la haine ou à la violence","Pour punir les injures ou la diffamation","Pour punir l'incitation à la haine ou au racisme"],"distractors":["Pour empêcher la critique du gouvernement","Pour interdire les opinions politiques minoritaires","Pour protéger les hommes politiques de toute critique"],"explanation":"La liberté d'expression peut être limitée pour réprimer les propos discriminatoires, la provocation à la haine ou à la violence, les injures et la diffamation.","why":["Critiquer le gouvernement est permis.","Les opinions minoritaires sont protégées.","Les hommes politiques peuvent être critiqués."],"explanationEasy":"On peut limiter la liberté d'expression pour punir les propos discriminatoires. C'est aussi possible pour la provocation à la haine ou à la violence. C'est possible pour les injures et la diffamation.","whyEasy":["On a le droit de critiquer le gouvernement.","Les opinions minoritaires sont protégées.","On peut critiquer les hommes politiques."]},{"id":124,"question":"Que doit faire un citoyen s'il est appelé à être juré dans un procès d'assises ?","answers":["Il est obligé de siéger, sauf motif grave reconnu valable","C'est une obligation civique, on ne peut pas refuser (sauf motif grave)","Il est obligé de siéger sous peine d'amende (3 750 €)"],"distractors":["Il peut refuser librement, sans avoir à se justifier","Il peut envoyer un remplaçant de son choix","Il doit siéger seulement s'il possède un diplôme de droit"],"explanation":"Un citoyen tiré au sort est obligé de siéger, sauf motif grave reconnu valable (amende de 3 750 euros en cas de refus).","why":["Il ne peut pas refuser sans motif.","On ne peut pas se faire remplacer.","Aucun diplôme n'est exigé."],"explanationEasy":"Un citoyen tiré au sort doit siéger, sauf motif grave reconnu valable. S'il refuse, il paie une amende de 3 750 euros.","whyEasy":["Il ne peut pas refuser sans motif.","On ne peut pas envoyer quelqu'un à sa place.","On n'a pas besoin d'un diplôme."]},{"id":125,"question":"Quel est l'âge de la majorité civile en France ?","answers":["18 ans"],"distractors":["16 ans","20 ans","21 ans"],"explanation":"La majorité civile est fixée à 18 ans.","why":["16 ans : on peut être émancipé, mais on reste mineur.","20 ans n'est pas l'âge de la majorité.","21 ans était l'âge de la majorité avant 1974."],"explanationEasy":"La majorité civile est fixée à 18 ans en France.","whyEasy":["À 16 ans, on peut être émancipé, mais on reste mineur.","20 ans n'est pas l'âge de la majorité.","21 ans était l'âge de la majorité avant 1974."]},{"id":126,"question":"Quel est l'un des devoirs principaux d'un citoyen français ?","answers":["Respecter la loi et les droits des autres","Contribuer au financement des services publics (payer l'impôt)","Participer à la défense du pays (Journée défense et citoyenneté, défense en cas de crise ou de guerre)"],"distractors":["Voter à toutes les élections sous peine d'amende","Adhérer à un parti politique ou à un syndicat","Pratiquer une religion reconnue par l'État"],"explanation":"Devoirs du citoyen : respecter la loi et les droits des autres, payer l'impôt, participer à la défense du pays (Journée défense et citoyenneté).","why":["Voter est un droit, pas une obligation.","Adhérer à un parti ou à un syndicat est libre.","La religion est libre : personne n'y est obligé."],"explanationEasy":"Un citoyen doit respecter la loi et les droits des autres. Il paie l'impôt. Il participe à la défense du pays (Journée défense et citoyenneté).","whyEasy":["Voter est un droit, pas une obligation.","On est libre d'adhérer à un parti ou à un syndicat.","La religion est libre. Personne n'est obligé d'en pratiquer une."]},{"id":127,"question":"Quelle est l'infraction la plus grave ?","answers":["Le crime"],"distractors":["Le délit","La contravention","L'incivilité"],"explanation":"Les infractions se classent en trois niveaux : contravention (la moins grave), délit, crime (le plus grave).","why":["Le délit est moins grave que le crime.","La contravention est la moins grave.","Une incivilité n'est pas une infraction pénale."],"explanationEasy":"Il y a trois niveaux d'infractions. La contravention est la moins grave, puis vient le délit. Le crime est le plus grave.","whyEasy":["Le délit est moins grave que le crime.","La contravention est la moins grave.","Une incivilité n'est pas une infraction pénale."]},{"id":128,"question":"Qu'est-ce que la citoyenneté numérique ?","answers":["Faire un usage responsable, éthique et sûr des technologies numériques","L'utilisation responsable des outils numériques pour participer à la vie démocratique","Respecter la loi et la politesse dans l'espace numérique"],"distractors":["Le droit d'avoir un compte sur tous les réseaux sociaux","L'obligation de s'inscrire sur un site de l'administration","L'obligation de posséder une adresse e-mail pour être citoyen"],"explanation":"La citoyenneté numérique : un usage responsable, éthique et sûr du numérique, dans le respect des lois et des autres.","why":["Ce n'est pas un droit à tout posséder.","Il n'existe pas d'obligation de ce type.","Il n'est pas nécessaire d'avoir une adresse e-mail pour être citoyen."],"explanationEasy":"La citoyenneté numérique est un usage responsable, éthique et sûr du numérique. On respecte les lois et les autres.","whyEasy":["Ce n'est pas un droit de tout posséder.","Il n'existe pas d'obligation de ce type.","On n'a pas besoin d'adresse e-mail pour être citoyen."]},{"id":129,"question":"Qu'est-ce que le devoir de mémoire ?","answers":["Une obligation morale de se souvenir des souffrances du passé pour éviter qu'elles ne se reproduisent","Se souvenir des événements tragiques du passé pour défendre la démocratie","L'obligation morale de ne pas oublier les victimes de l'histoire (Guerres, Shoah, Esclavage)"],"distractors":["L'obligation légale d'apprendre par cœur les dates de l'histoire de France","Le devoir d'honorer les chefs d'État du passé","Le droit d'oublier les événements douloureux de l'histoire"],"explanation":"Le devoir de mémoire : ne pas oublier les victimes et les tragédies du passé (Shoah, esclavage, guerres) pour qu'elles ne se reproduisent pas.","why":["Ce n'est pas un devoir juridique d'apprendre des dates par cœur.","Ce n'est pas un hommage aux dirigeants.","C'est au contraire l'obligation de ne pas oublier."],"explanationEasy":"Le devoir de mémoire, c'est ne pas oublier les victimes et les drames du passé : la Shoah, l'esclavage, les guerres. Ainsi, ils ne se reproduisent pas.","whyEasy":["La loi n'oblige pas à apprendre des dates par cœur.","Ce n'est pas un hommage aux chefs d'État.","C'est au contraire un devoir de ne pas oublier."]},{"id":130,"question":"Qui peut être appelé à faire partie d'un jury d'assises en France ?","answers":["Les citoyens français tirés au sort","Des citoyens inscrits sur les listes électorales et tirés au sort"],"distractors":["Uniquement des juges professionnels","Des citoyens désignés par le préfet","Des citoyens étrangers résidant en France depuis plus de cinq ans"],"explanation":"Les jurés d'assises sont des citoyens français tirés au sort sur les listes électorales.","why":["Il y a des magistrats et des jurés.","Le préfet ne désigne pas les jurés.","Seuls les citoyens français peuvent être jurés."],"explanationEasy":"Les jurés d'assises sont des citoyens français. On les tire au sort sur les listes électorales.","whyEasy":["Il y a des magistrats et aussi des jurés.","Le préfet ne désigne pas les jurés.","Seuls les citoyens français peuvent être jurés."]},{"id":131,"question":"Une personne est privée de ses droits civils et politiques pendant 5 ans suite à une condamnation. Parmi ces propositions laquelle est correcte ? Pendant 5 ans,...","answers":["Elle ne peut plus voter ni se présenter aux élections"],"distractors":["Elle peut voter mais ne peut pas se présenter aux élections","Elle peut se présenter aux élections mais ne peut pas voter","Elle perd sa nationalité française"],"explanation":"La privation des droits civiques et politiques empêche à la fois de voter et de se présenter aux élections. Le juge peut toutefois limiter la peine à une partie de ces droits ; ici, la question vise la privation de l'ensemble.","why":["Elle prive aussi du droit de vote.","Elle prive aussi du droit d'être élu.","Elle ne retire pas la nationalité."],"explanationEasy":"La perte des droits civils et politiques empêche de voter. Elle empêche aussi de se présenter aux élections.","whyEasy":["Elle retire aussi le droit de voter.","Elle retire aussi le droit de se présenter.","Elle ne retire pas la nationalité."]}]},{"theme":"Histoire, géographie et culture","questions":[{"id":132,"question":"Parmi ces textes, lequel a été adopté sous Napoléon Ier ?","answers":["Le Code civil"],"distractors":["La loi de 1905","La Constitution de 1958","La Déclaration de 1789"],"explanation":"Le Code civil (1804), aussi appelé Code Napoléon, est adopté sous Napoléon Ier.","why":["La loi de 1905 sépare les Églises et l'État (IIIe République).","La Constitution de 1958 fonde la Ve République.","La Déclaration de 1789 date de la Révolution."],"explanationEasy":"Le Code civil date de 1804. On l'appelle aussi « Code Napoléon ». Il est adopté sous Napoléon Ier.","whyEasy":["La loi de 1905 sépare les Églises et l'État. Elle date de la IIIe République.","La Constitution de 1958 crée la Ve République. Ce n'est pas sous Napoléon Ier.","La Déclaration de 1789 date de la Révolution. Ce n'est pas sous Napoléon Ier."]},{"id":133,"question":"Qui a été président de la Ve République ?","answers":["Charles de Gaulle","Georges Pompidou","Valéry Giscard d'Estaing","François Mitterrand","Jacques Chirac","Nicolas Sarkozy","François Hollande","Emmanuel Macron"],"distractors":["René Coty","Léon Blum","Pierre Mendès France"],"explanation":"Ont été présidents de la Ve République : de Gaulle, Pompidou, Giscard d'Estaing, Mitterrand, Chirac, Sarkozy, Hollande, Macron.","why":["René Coty fut le dernier président de la IVe République.","Léon Blum a dirigé le gouvernement du Front populaire (1936), il n'a pas été président de la République.","Pierre Mendès France fut président du Conseil sous la IVe République."],"explanationEasy":"Il y a eu huit présidents de la Ve République. Ce sont de Gaulle, Pompidou, Giscard d'Estaing, Mitterrand, Chirac, Sarkozy, Hollande et Macron.","whyEasy":["René Coty est le dernier président de la IVe République.","Léon Blum dirige le gouvernement du Front populaire en 1936. Il n'est pas président de la République.","Pierre Mendès France est président du Conseil sous la IVe République. Il n'est pas président de la Ve."]},{"id":134,"question":"Quel est l'objectif des lois scolaires de la IIIe République ?","answers":["Rendre l'école publique gratuite, laïque et obligatoire","Créer une école publique, gratuite et laïque"],"distractors":["Rendre l'école payante et la confier à l'Église","Réserver l'enseignement public aux garçons","Rendre l'école facultative et religieuse"],"explanation":"Les lois Jules Ferry (1881-1882) rendent l'école publique gratuite, laïque et obligatoire.","why":["L'école devient au contraire gratuite et laïque.","L'école publique accueille aussi les filles.","L'école devient obligatoire."],"explanationEasy":"Les lois de Jules Ferry (1881-1882) rendent l'école publique gratuite, laïque et obligatoire.","whyEasy":["Au contraire, l'école devient gratuite et laïque.","L'école publique accueille aussi les filles. Elle n'est pas réservée aux garçons.","L'école devient obligatoire. Elle n'est pas facultative."]},{"id":135,"question":"Que signifie la date du 14 juillet pour les Français ?","answers":["C'est la fête nationale (Prise de la Bastille et Fête de la Fédération)","La prise de la Bastille (14 juillet 1789) et l'union nationale (14 juillet 1790)"],"distractors":["La fin de la Première Guerre mondiale (armistice de 1918)","La fin de l'esclavage en France (abolition de 1848)","La Libération de Paris (25 août 1944)"],"explanation":"Le 14 juillet, fête nationale, rappelle la prise de la Bastille (1789) et la fête de la Fédération (1790).","why":["L'armistice de 1918 est commémoré le 11 novembre.","L'abolition définitive de l'esclavage date de 1848.","La Libération de Paris date du 25 août 1944."],"explanationEasy":"Le 14 juillet est la fête nationale. On se souvient de la prise de la Bastille (1789). On se souvient aussi de la fête de la Fédération (1790).","whyEasy":["On rappelle l'armistice de 1918 le 11 novembre.","L'abolition définitive de l'esclavage date de 1848.","La Libération de Paris date du 25 août 1944."]},{"id":136,"question":"Pourquoi l'année 1958 est importante pour la France ?","answers":["Elle marque la naissance de la Cinquième République","L'adoption de la Constitution de la Ve République"],"distractors":["La naissance de la Quatrième République","L'abolition de la peine de mort","La création de l'Union européenne"],"explanation":"En 1958 naît la Ve République : la Constitution est adoptée par référendum (28 septembre) et de Gaulle est élu président en décembre.","why":["La IVe République naît en 1946.","La peine de mort est abolie en 1981.","L'Union européenne date de 1992."],"explanationEasy":"En 1958, la Ve République naît. On adopte la Constitution. De Gaulle devient président.","whyEasy":["La IVe République naît en 1946, pas en 1958.","La peine de mort est abolie en 1981, pas en 1958.","L'Union européenne date de 1992, pas de 1958."]},{"id":137,"question":"Lequel de ces pays est un pays fondateur de l'Union Européenne ?","answers":["L'Italie","La France","L'Allemagne","La Belgique","Les Pays-Bas","Le Luxembourg"],"distractors":["L'Espagne","Le Royaume-Uni","Le Danemark"],"explanation":"Les six pays fondateurs (CECA 1951, puis CEE 1957) sont la France, l'Allemagne, l'Italie, la Belgique, les Pays-Bas et le Luxembourg. L'Union européenne proprement dite naît en 1992 avec le traité de Maastricht.","why":["L'Espagne adhère en 1986.","Le Royaume-Uni adhère en 1973 et quitte l'UE en 2020.","Le Danemark adhère en 1973."],"explanationEasy":"Six pays fondent les Communautés européennes (CECA en 1951, puis CEE en 1957). Ce sont la France, l'Allemagne, l'Italie, la Belgique, les Pays-Bas et le Luxembourg. L'Union européenne naît en 1992.","whyEasy":["L'Espagne entre dans l'Union en 1986. Elle n'est pas fondatrice.","Le Royaume-Uni entre en 1973 et quitte l'UE en 2020. Il n'est pas fondateur.","Le Danemark entre en 1973. Il n'est pas fondateur."]},{"id":138,"question":"Simone Veil est une figure importante de l'histoire française. Elle a notamment :","answers":["Fait voter la loi autorisant l'avortement en France","Défendu la loi sur l'Interruption Volontaire de Grossesse (IVG)"],"distractors":["Obtenu le droit de vote pour les femmes en 1944","Fait abolir la peine de mort en 1981","Fait voter la loi sur le mariage pour tous"],"explanation":"Simone Veil, ministre de la Santé, a défendu et fait voter la loi sur l'interruption volontaire de grossesse (1975).","why":["Les femmes votent depuis 1944-1945.","La peine de mort est abolie en 1981 (loi défendue par Robert Badinter).","Le mariage pour tous date de 2013."],"explanationEasy":"Simone Veil est ministre de la Santé. Elle défend la loi sur l'interruption volontaire de grossesse (IVG) en 1975. La loi est votée.","whyEasy":["Les femmes votent depuis 1944-1945. Ce n'est pas l'action de Simone Veil.","La peine de mort est abolie en 1981. C'est une loi défendue par Robert Badinter.","Le mariage pour tous date de 2013. Ce n'est pas Simone Veil."]},{"id":139,"question":"Dans quelle région est située une partie des plages du débarquement ayant permis d'engager la libération de la France ?","answers":["La Normandie"],"distractors":["La Bretagne","Les Hauts-de-France","La Provence-Alpes-Côte d'Azur"],"explanation":"Les plages du Débarquement du 6 juin 1944 sont en Normandie.","why":["La Bretagne est à l'ouest de la Normandie : ses côtes ne sont pas celles du Débarquement.","Les Hauts-de-France sont au nord-est, loin des plages du Débarquement.","La Provence est dans le sud-est : le débarquement de Provence date d'août 1944, pas du 6 juin."],"explanationEasy":"Les plages du Débarquement du 6 juin 1944 sont en Normandie.","whyEasy":["La Bretagne est à l'ouest de la Normandie. Les plages du 6 juin ne sont pas là.","Les Hauts-de-France sont loin des plages du Débarquement.","La Provence est dans le sud-est. Le débarquement de Provence a lieu en août 1944, pas le 6 juin."]},{"id":140,"question":"Dans quelle ville les rois de France étaient-ils couronnés ?","answers":["Reims"],"distractors":["Paris","Versailles","Lyon"],"explanation":"Les rois de France étaient sacrés à la cathédrale de Reims ; Clovis y fut baptisé.","why":["Napoléon fut sacré à Notre-Dame de Paris.","Le château de Versailles est une résidence royale, mais on n'y a jamais sacré de roi.","Lyon n'a jamais été la ville du sacre des rois de France."],"explanationEasy":"Les rois de France sont sacrés à la cathédrale de Reims. Clovis y est baptisé.","whyEasy":["Napoléon est sacré à Notre-Dame de Paris. Ce n'est pas un roi de France.","Le château de Versailles est une résidence du roi, mais on n'y sacre pas les rois.","Lyon n'est pas la ville du sacre des rois de France."]},{"id":141,"question":"Quel roi de France a été guillotiné pendant la Révolution française ?","answers":["Louis XVI"],"distractors":["Louis XIV","Louis XV","Louis XVIII"],"explanation":"Louis XVI est guillotiné le 21 janvier 1793, pendant la Révolution.","why":["Louis XIV est le Roi-Soleil (mort en 1715).","Louis XV est mort en 1774.","Louis XVIII a régné après la chute de Napoléon."],"explanationEasy":"Louis XVI est guillotiné le 21 janvier 1793, pendant la Révolution.","whyEasy":["Louis XIV est le Roi-Soleil. Il meurt en 1715.","Louis XV meurt en 1774, avant la Révolution.","Louis XVIII règne après la chute de Napoléon."]},{"id":142,"question":"En quelle année a débuté la Révolution française ?","answers":["1789"],"distractors":["1776","1792","1799"],"explanation":"La Révolution française commence en 1789, avec la prise de la Bastille le 14 juillet.","why":["1776 : indépendance des États-Unis.","1792 : proclamation de la Première République.","1799 : coup d'État de Bonaparte, qui met fin à la Révolution."],"explanationEasy":"La Révolution française commence en 1789. Le 14 juillet, le peuple prend la Bastille.","whyEasy":["1776 est l'année de l'indépendance des États-Unis.","En 1792, on proclame la Première République.","En 1799, un coup d'État de Bonaparte met fin à la Révolution."]},{"id":143,"question":"En quelle année Napoléon Ier est-il devenu empereur ?","answers":["1804"],"distractors":["1799","1802","1814"],"explanation":"Napoléon Bonaparte est proclamé empereur en 1804 (sacre le 2 décembre).","why":["1799 : coup d'État qui le porte au pouvoir (Consulat).","1802 : il devient consul à vie.","1814 : première abdication."],"explanationEasy":"Napoléon Bonaparte devient empereur en 1804. Son sacre a lieu le 2 décembre.","whyEasy":["En 1799, un coup d'État le porte au pouvoir (Consulat). Il n'est pas encore empereur.","En 1802, il devient consul à vie. Il n'est pas encore empereur.","En 1814, il abdique pour la première fois."]},{"id":144,"question":"Lequel de ces personnages a un lien avec la République française ?","answers":["Marianne (le symbole de la République)","Jules Ferry (L'école)","Charles de Gaulle (Le libérateur)","Victor Hugo (L'écrivain engagé)"],"distractors":["Louis XIV (le Roi-Soleil)","Charlemagne (l'empereur)","Clovis (le roi des Francs)"],"explanation":"Marianne, Jules Ferry (école), de Gaulle (Libération) et Victor Hugo (écrivain engagé) sont liés à la République.","why":["Louis XIV était un roi absolu.","Charlemagne fut empereur au IXe siècle.","Clovis fut roi des Francs au Ve siècle."],"explanationEasy":"Quatre personnes sont liées à la République. Marianne, Jules Ferry (l'école), de Gaulle (la Libération), Victor Hugo (écrivain engagé).","whyEasy":["Louis XIV est un roi absolu. Il n'est pas lié à la République.","Charlemagne est empereur au IXe siècle. Il vit bien avant la République.","Clovis est roi des Francs au Ve siècle. Il vit bien avant la République."]},{"id":145,"question":"De quand date l'appel à la résistance du général de Gaulle ?","answers":["18 juin 1940"],"distractors":["22 juin 1940","6 juin 1944","8 mai 1945"],"explanation":"Le 18 juin 1940, de Gaulle lance depuis Londres son appel à poursuivre le combat.","why":["Le 22 juin 1940 : signature de l'armistice avec l'Allemagne.","Le 6 juin 1944 : Débarquement en Normandie.","Le 8 mai 1945 : fin de la guerre en Europe."],"explanationEasy":"Le 18 juin 1940, de Gaulle parle depuis Londres. Il appelle à continuer le combat.","whyEasy":["Le 22 juin 1940, on signe l'armistice avec l'Allemagne. Ce n'est pas l'appel.","Le 6 juin 1944, c'est le Débarquement en Normandie.","Le 8 mai 1945, la guerre finit en Europe."]},{"id":146,"question":"Qu'est-ce que la Shoah ?","answers":["Le génocide des Juifs par les Nazis pendant la Seconde Guerre mondiale","L'extermination (ou le génocide) des Juifs d'Europe par le régime nazi","Le génocide systématique commis contre le peuple juif pendant la Seconde Guerre mondiale"],"distractors":["Le génocide des Arméniens pendant la Première Guerre mondiale","Le génocide des Tutsis au Rwanda en 1994","L'occupation de la France par l'Allemagne entre 1940 et 1944"],"explanation":"La Shoah est le génocide des Juifs d'Europe par le régime nazi pendant la Seconde Guerre mondiale (environ 6 millions de morts).","why":["Le génocide des Arméniens a eu lieu en 1915.","Le génocide des Tutsis a eu lieu au Rwanda en 1994.","L'Occupation désigne la présence allemande en France, pas la Shoah."],"explanationEasy":"La Shoah est le génocide des Juifs d'Europe par le régime nazi. Il a lieu pendant la Seconde Guerre mondiale. Il fait environ 6 millions de morts.","whyEasy":["Le génocide des Arméniens a lieu en 1915. Ce n'est pas la Shoah.","Le génocide des Tutsis a lieu au Rwanda en 1994. Ce n'est pas la Shoah.","L'Occupation, c'est la présence allemande en France. Ce n'est pas la Shoah."]},{"id":147,"question":"Quel pays a été une colonie française ?","answers":["L'Algérie","Le Vietnam","Madagascar","Le Maroc","La Tunisie"],"distractors":["Le Congo belge","L'Angola","Le Nigeria"],"explanation":"Plusieurs pays ont été des colonies ou des protectorats français, par exemple l'Algérie, la Tunisie, le Maroc, Madagascar ou le Vietnam.","why":["Le Congo belge était une colonie de la Belgique.","L'Angola était portugais.","Le Nigeria était britannique."],"explanationEasy":"Plusieurs pays ont été des colonies ou des protectorats français. Par exemple : l'Algérie, la Tunisie, le Maroc, Madagascar, le Vietnam.","whyEasy":["Le Congo belge était une colonie de la Belgique.","L'Angola était une colonie du Portugal.","Le Nigeria était une colonie britannique."]},{"id":148,"question":"Qui a rendu l'école gratuite, laïque et obligatoire ?","answers":["Jules Ferry"],"distractors":["Napoléon III","Léon Gambetta","Georges Clemenceau"],"explanation":"Jules Ferry, ministre de l'Instruction publique, a fait voter les lois scolaires de 1881-1882.","why":["Napoléon III fut empereur (Second Empire).","Gambetta fut une grande figure républicaine, mais ces lois sont de Ferry.","Clemenceau a dirigé le gouvernement pendant la Première Guerre mondiale."],"explanationEasy":"Jules Ferry est ministre de l'Instruction publique. Il fait voter les lois scolaires de 1881-1882.","whyEasy":["Napoléon III est empereur sous le Second Empire. Ce n'est pas lui.","Gambetta est une grande figure républicaine. Mais ces lois sont de Ferry.","Clemenceau dirige le gouvernement pendant la Première Guerre mondiale. Ce n'est pas lui."]},{"id":149,"question":"Depuis quand les Français élisent-ils le président de la République au suffrage universel direct ?","answers":["1962"],"distractors":["1958","1969","1981"],"explanation":"Depuis le référendum de 1962 (sous de Gaulle), le Président est élu au suffrage universel direct ; la première élection a lieu en 1965.","why":["1958 : naissance de la Ve République.","1969 : élection de Pompidou.","1981 : élection de Mitterrand."],"explanationEasy":"Le référendum de 1962 a lieu sous de Gaulle. Depuis, tous les électeurs votent directement pour le Président.","whyEasy":["En nt.","Zanzibar appartient à la Tanzanie."],"explanationEasy":"La Réunion et Mayotte sont des îles françaises. Elles sont près du sud-est de l'Afrique.","whyEasy":["Madagascar est un pays indépendant, pas une île française.","L'île Maurice est un pays indépendant, pas une île française.","Zanzibar fait partie de la Tanzanie, pas de la France."]},{"id":209,"question":"Quel est le chef-lieu de la région Auvergne-Rhône-Alpes ?","answers":["Lyon"],"distractors":["Grenoble","Annecy","Dijon"],"explanation":"Lyon est le chef-lieu de la région Auvergne-Rhône-Alpes.","why":["Grenoble est la préfecture de l'Isère.","Annecy est en Haute-Savoie.","Dijon est le chef-lieu de Bourgogne-Franche-Comté."],"explanationEasy":"Lyon est le chef-lieu de la région Auvergne-Rhône-Alpes. Le chef-lieu de région est la ville où se trouve la préfecture de région.","whyEasy":["Grenoble est la préfecture de l'Isère, pas de la région.","Annecy est une ville de Haute-Savoie, pas le chef-lieu de la région.","Dijon est le chef-lieu d'une autre région : Bourgogne-Franche-Comté."]},{"id":210,"question":"Quel est le chef-lieu de la région Bretagne ?","answers":["Rennes"],"distractors":["Nantes","Brest","Quimper"],"explanation":"Rennes est le chef-lieu de la Bretagne.","why":["Nantes est en Pays de la Loire.","Brest est un grand port breton, mais pas la préfecture.","Quimper est la préfecture du Finistère."],"explanationEasy":"Rennes est le chef-lieu de la région Bretagne. Le chef-lieu de région est la ville où se trouve la préfecture de région.","whyEasy":["Nantes est dans la région Pays de la Loire.","Brest est un grand port breton, mais ce n'est pas la préfecture.","Quimper est la préfecture du Finistère, pas de la région."]},{"id":211,"question":"Quel est le chef-lieu de la région Provence-Alpes-Côte d'Azur ?","answers":["Marseille"],"distractors":["Nice","Toulon","Avignon"],"explanation":"Marseille est le chef-lieu de la région Provence-Alpes-Côte d'Azur.","why":["Nice est la préfecture des Alpes-Maritimes.","Toulon est la préfecture du Var.","Avignon est la préfecture du Vaucluse."],"explanationEasy":"Marseille est le chef-lieu de la région Provence-Alpes-Côte d'Azur. Le chef-lieu de région est la ville où se trouve la préfecture de région.","whyEasy":["Nice est la préfecture des Alpes-Maritimes, pas de la région.","Toulon est la préfecture du Var, pas de la région.","Avignon est la préfecture du Vaucluse, pas de la région."]},{"id":212,"question":"Quel est le 101ème département français depuis 2011 ?","answers":["Mayotte"],"distractors":["La Réunion","La Guyane","Saint-Martin"],"explanation":"Mayotte est devenue le 101e département français en 2011.","why":["La Réunion est un département depuis 1946.","La Guyane est un département depuis 1946.","Saint-Martin est une collectivité d'outre-mer."],"explanationEasy":"Mayotte est devenue le 101e département français en 2011.","whyEasy":["La Réunion est un département depuis 1946.","La Guyane est un département depuis 1946.","Saint-Martin est une collectivité d'outre-mer, pas un département."]},{"id":213,"question":"Quelle région française est réputée pour ses stations de ski ?","answers":["Auvergne-Rhône-Alpes"],"distractors":["La Bretagne","La Normandie","Les Pays de la Loire"],"explanation":"La région Auvergne-Rhône-Alpes est connue pour ses stations de ski, dans les Alpes.","why":["Il n'y a pas de grandes stations de ski en Bretagne.","Il n'y a pas de haute montagne en Normandie.","Les Pays de la Loire n'ont pas de haute montagne."],"explanationEasy":"La région Auvergne-Rhône-Alpes est connue pour ses stations de ski. Elles sont dans les Alpes.","whyEasy":["Il n'y a pas de grande station de ski en Bretagne.","Il n'y a pas de haute montagne en Normandie.","Il n'y a pas de haute montagne dans les Pays de la Loire."]},{"id":214,"question":"Quel fleuve traverse Paris ?","answers":["La Seine"],"distractors":["La Loire","La Garonne","Le Rhône"],"explanation":"La Seine traverse Paris ; c'est le fleuve de la capitale, qui se jette dans la Manche près du Havre.","why":["La Loire passe par Orléans, Tours et Nantes.","La Garonne passe par Toulouse et Bordeaux.","Le Rhône passe par Lyon."],"explanationEasy":"La Seine traverse Paris. C'est le fleuve de la capitale. Elle se jette dans la Manche, près du Havre.","whyEasy":["La Loire passe par Orléans, Tours et Nantes, pas par Paris.","La Garonne passe par Toulouse et Bordeaux, pas par Paris.","Le Rhône passe par Lyon, pas par Paris."]}]},{"theme":"Vivre dans la société française","questions":[{"id":215,"question":"Où faut-il déclarer la naissance d'un enfant ?","answers":["À la mairie du lieu de naissance"],"distractors":["À la préfecture du département","Au tribunal judiciaire","À la caisse d'allocations familiales"],"explanation":"La naissance se déclare à la mairie du lieu de naissance, dans les 5 jours.","why":["La préfecture ne tient pas l'état civil.","Le tribunal ne reçoit pas les déclarations de naissance.","La CAF intervient ensuite pour les allocations."],"explanationEasy":"On déclare la naissance à la mairie du lieu de naissance. Il faut le faire dans les 5 jours.","whyEasy":["La préfecture ne s'occupe pas de l'état civil.","Le tribunal ne reçoit pas les déclarations de naissance.","La CAF vient après, pour les allocations. Elle ne reçoit pas la déclaration."]},{"id":216,"question":"Quelle action peut réaliser le locataire d'un logement sans l'autorisation du propriétaire ?","answers":["Faire des travaux décoratifs, comme peindre les murs","Repeindre les murs","Changer la tapisserie (poser du papier peint)","Poser des étagères"],"distractors":["Abattre une cloison","Remplacer la chaudière collective","Agrandir une fenêtre"],"explanation":"Un locataire peut faire de petits travaux décoratifs (peinture, papier peint, étagères), mais pas de gros travaux sans l'accord du propriétaire.","why":["Abattre une cloison modifie la structure du logement.","La chaudière appartient au propriétaire.","Agrandir une fenêtre modifie le gros œuv
