ins la veille par un courrier écrit","Non, mais cette protection n'existe que pendant les mois d'hiver, entre novembre et mars"],"explanation":"Un propriétaire ne peut pas expulser seul son locataire. Il doit obtenir une décision du juge, puis un commissaire de justice exécute l'expulsion. Changer les serrures sans décision est interdit et puni de 3 ans de prison et 30 000 euros d'amende.","why":["Un propriétaire ne peut pas reprendre son logement à tout moment : il doit donner un congé avec préavis, et seul un juge peut ordonner le départ.","Prévenir la veille ne remplace pas la décision d'un juge.","Cette protection existe toute l'année ; la trêve hivernale s'ajoute pendant l'hiver."],"explanationEasy":"Un propriétaire ne peut pas te mettre dehors seul. Il faut la décision d'un juge. Changer les serrures est interdit.","whyEasy":["Le propriétaire ne décide pas seul.","Prévenir la veille ne suffit pas.","La protection existe toute l'année."]},{"id":1034,"question":"Après la visite d'un démarcheur, vous avez signé chez vous un abonnement. Le lendemain, vous regrettez. Pouvez-vous annuler ?","answers":["Oui : pour un contrat conclu à domicile ou à distance, on dispose de 14 jours pour se rétracter"],"distractors":["Non : une fois le contrat signé, la signature est définitive et on ne peut plus l'annuler","Oui, mais seulement pendant les 24 heures qui suivent la signature, pas plus longtemps","Non, sauf si le vendeur est d'accord pour annuler le contrat de son côté, sans pénalité"],"explanation":"Pour un contrat conclu à domicile, à distance ou en ligne, la loi donne en général 14 jours pour se rétracter, sans avoir à donner de raison.","why":["La loi prévoit un droit de rétractation pour ce type de contrat.","Le délai est de 14 jours, pas de 24 heures.","Le droit de rétractation ne dépend pas de l'accord du vendeur."],"explanationEasy":"Si tu signes un contrat chez toi ou sur Internet, tu as en général 14 jours pour changer d'avis. Tu n'as pas besoin d'expliquer pourquoi.","whyEasy":["Un droit de rétractation existe.","Le délai est de 14 jours.","Le vendeur n'a pas à être d'accord."]}]}]}</script>

let missed = new Set(store.get('civique_missed_v2', []));

// Répétition espacée (boîtes de Leitner) : une bonne réponse monte la question d'une boîte, une erreur la renvoie en boîte 0.
// Une question est « à revoir » quand le délai de sa boîte est écoulé ; elle est « maîtrisée » à partir de la boîte 3.
let prog = store.get('civique_prog_v1', {});
const DAYS = [0, 1, 3, 7, 14], MASTERED = 3, SESSION = 15;
const seen = id => !!prog[id];
const boxOf = id => prog[id] ? prog[id].b : 0;
const mastered = id => seen(id) && boxOf(id) >= MASTERED;
const isDue = id => { const p = prog[id]; return !!p && Date.now() - p.t >= DAYS[p.b] * 864e5; };
function record(id, ok){
  const p = prog[id] || {b: 0, n: 0, t: 0};
  p.n++; p.b = ok ? Math.min(p.b + 1, 4) : 0; p.t = Date.now();
  prog[id] = p; store.set('civique_prog_v1', prog);
}
const priority = id => seen(id) ? boxOf(id) : 0.5;   // erreurs d'abord, puis nouvelles, puis le reste
function dailyList(){
  const due = shuffle(QUESTIONS.filter(q => isDue(q.id))).sort((a, b) => boxOf(a.id) - boxOf(b.id)).slice(0, SESSION);
  const fresh = shuffle(QUESTIONS.filter(q => !seen(q.id)));
  return due.concat(fresh).slice(0, SESSION);
}
function stats(list){
  return {n: list.length, m: list.filter(q => mastered(q.id)).length, s: list.filter(q => seen(q.id)).length};
}

function loadData(json){
  QUESTIONS = [];
  for (const t of json.data) for (const q of t.questions) {
    if (q.answers.length && q.distractors.length >= 3)
      QUESTIONS.push({id: q.id, theme: t.theme, q: q.question, a: q.answers, d: q.distractors,
                      e: q.explanation || '', w: q.why || [],
                      ee: q.explanationEasy || '', we: q.whyEasy || []});
  }
  return QUESTIONS.length;
}
const themes = () => [...new Set(QUESTIONS.map(q => q.theme))];
const tcol = name => `var(--t${themes().indexOf(name) % 6})`;
const SIT_THEME = 'Mises en situation';
const themeLabel = item => item.theme === SIT_THEME ? item.theme + ' · écrite pour l\'appli' : item.theme;

// Une bonne réponse (au hasard parmi les formulations acceptées) + 3 fausses réponses propres à la question.
function buildChoices(item){
  const correct = item.a[Math.floor(Math.random() * item.a.length)];
  const wrong = shuffle(item.d.map((t, i) => ({t, i, ok: false, why: whyOf(item, i)}))).slice(0, 3);
  return {
    correct,
    choices: shuffle([{t: correct, ok: true, why: ''}, ...wrong])
  };
}

// Français facile : préférence mémorisée ; retombe sur la version complète si la version facile manque.
let easy = !!store.get('civique_easy_v1', false);
const setEasy = v => { easy = v; store.set('civique_easy_v1', v); };
const expl = item => (easy && item.ee) || item.e;
const whyOf = (item, i) => (easy && item.we[i]) || item.w[i] || '';

// Lecture à voix haute (synthèse vocale du navigateur, hors ligne selon l'appareil). Les textes longs sont découpés en phrases :
// certains navigateurs coupent un énoncé de plus d'une quinzaine de secondes.
const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
let slow = !!store.get('civique_slow_v1', false);
let speakKey = null;
const SPK = '<svg viewBox="0 0 20 20" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8v4h3l4 3V5L6 8z"/><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10"/></svg>';
const listenBtn = (id, label) => canSpeak ? `<button class="btn listen" id="${id}" aria-pressed="false">${SPK}<span>${label}</span></button>` : '';
function stopSpeech(){ speakKey = null; if (canSpeak) { try { speechSynthesis.cancel(); } catch(e){} } document.querySelectorAll('.listen').forEach(b => b.setAttribute('aria-pressed', 'false')); }
function frVoice(){
  const v = speechSynthesis.getVoices().filter(x => /^fr/i.test(x.lang));
  return v.find(x => /fr[-_]FR/i.test(x.lang)) || v[0];
}
// Lit `text` ; un second clic sur le même bouton arrête la lecture.
function toggleSpeak(key, text, btn){
  if (!canSpeak) return;
  if (speakKey === key) { stopSpeech(); return; }
  stopSpeech();
  speakKey = key; btn.setAttribute('aria-pressed', 'true');
  const parts = text.split(/(?<=[.!?;])\s+/).filter(Boolean);
  const voice = frVoice();
  parts.forEach((s, i) => {
    const u = new SpeechSynthesisUtterance(s);
    u.lang = 'fr-FR'; if (voice) u.voice = voice; u.rate = slow ? 0.75 : 0.95;
    if (i === parts.length - 1) { u.onend = u.onerror = () => { if (speakKey === key) stopSpeech(); }; }
    speechSynthesis.speak(u);
  });
}
const ORD = ['Première', 'Deuxième', 'Troisième', 'Quatrième'];

// ---------- Écrans ----------
let timerId = null;
function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }

function themeRow(t){
  const s = stats(QUESTIONS.filter(q => q.theme === t));
  return `<span class="name">${esc(t)}<small>${s.m} maîtrisée${s.m>1?'s':''} sur ${s.n}</small><span class="pbar" aria-hidden="true"><i class="s" style="width:${Math.round(s.s/s.n*100)}%"></i><i style="width:${Math.round(s.m/s.n*100)}%"></i></span></span><span class="chev" aria-hidden="true">›</span>`;
}
function dailyCard(){
  const due = QUESTIONS.filter(q => isDue(q.id)).length;
  const fresh = QUESTIONS.filter(q => !seen(q.id)).length;
  const g = stats(QUESTIONS);
  const size = Math.min(SESSION, due + fresh);
  const sub = !Object.keys(prog).length ? 'Première session : on commence par des questions nouvelles.'
    : size ? `${due} question${due>1?'s':''} à revoir${fresh ? ' · ' + fresh + ' pas encore vue' + (fresh>1?'s':'') : ''}.` : 'Tout est à jour. Reviens demain, ou entraîne-toi par thème.';
  return `<div class="ticket daily">
      <div class="top"><h2>Session du jour</h2>
        <p class="mut">Les questions ratées reviennent tout de suite, puis après 1, 3, 7 et 14 jours quand tu les réussis. ${esc(sub)}</p></div>
      <div class="facts"><div><b>${g.m}</b><span>maîtrisées</span></div><div><b>${g.s}</b><span>déjà vues</span></div><div><b>${g.n}</b><span>au total</span></div></div>
      <div class="cta" style="padding-top:14px"><div class="pbar" style="--tc:var(--ok);margin:0 0 14px" aria-hidden="true"><i class="s" style="width:${Math.round(g.s/g.n*100)}%"></i><i style="width:${Math.round(g.m/g.n*100)}%"></i></div>
        <button class="btn primary" id="daily" ${size?'':'disabled'}>${size ? 'Commencer (' + size + ' questions)' : 'Rien à revoir aujourd\'hui'}</button></div>
    </div>`;
}

function home(){
  stopSpeech();
  stopTimer();
  const th = themes();
  app.innerHTML = `
    <h1>Examen civique</h1>
    <p class="lead">Entraîne-toi aux questions officielles de la mention naturalisation, avec les explications à chaque réponse.</p>
    <button class="switch" id="easy" role="switch" aria-checked="${easy}"><span class="tg" aria-hidden="true"></span><span><b>Explications en français facile</b><span class="d">Phrases courtes et mots simples. Les questions restent celles de l'examen.</span></span></button>
    ${canSpeak ? `<button class="switch" id="slow" role="switch" aria-checked="${slow}"><span class="tg" aria-hidden="true"></span><span><b>Lecture à voix haute plus lente</b><span class="d">Pour le bouton « Écouter » des questions et des explications.</span></span></button>` : ''}
    ${dailyCard()}
    <div class="ticket">
      <div class="top"><h2>Simulation d'examen</h2>
        <p class="mut" style="margin:0">Comme à l'examen : 28 questions de connaissance et 12 mises en situation. Les vraies mises en situation ne sont pas publiées : celles de l'application sont écrites pour s'entraîner.</p></div>
      <div class="facts"><div><b>40</b><span>questions</span></div><div><b>45 min</b><span>de chrono</span></div><div><b>80 %</b><span>pour réussir</span></div></div>
      <div class="cta" style="padding-top:14px"><button class="btn primary" id="sim">Lancer la simulation</button></div>
    </div>
    <h2 class="sect">S'entraîner par thème</h2>
    <div class="legend"><span>Couleur pleine : maîtrisées</span><span>Pâle : déjà vues</span></div>
    <div class="themes">
      ${th.map((t,i) => `<button class="btn theme" data-th="${i}" style="--tc:${tcol(t)}">${themeRow(t)}</button>`).join('')}
    </div>
    <h2 class="sect">Autres façons de réviser</h2>
    <div class="modes">
      <button class="btn" id="cards"><b>Fiches</b><span>Lis la question, réfléchis, puis découvre la réponse.</span></button>
      <button class="btn" id="errs" ${missed.size?'':'disabled'}><b>Revoir mes erreurs</b><span>${missed.size ? missed.size + ' question' + (missed.size>1?'s':'') + ' à retravailler.' : 'Rien à revoir pour le moment.'}</span></button>
      <button class="btn" id="reset" ${Object.keys(prog).length?'':'disabled'}><b>Réinitialiser ma progression</b><span>Efface les questions vues et maîtrisées sur cet appareil.</span></button>
    </div>
    ${footer()}`;
  $('#easy').onclick = () => { setEasy(!easy); $('#easy').setAttribute('aria-checked', easy); };
  if ($('#slow')) $('#slow').onclick = () => { slow = !slow; store.set('civique_slow_v1', slow); $('#slow').setAttribute('aria-checked', slow); };
  if ($('#daily')) $('#daily').onclick = () => startQuiz(dailyList(), {});
  $('#reset').onclick = () => { if (confirm('Effacer toute ta progression sur cet appareil ?')) { prog = {}; missed = new Set(); store.set('civique_prog_v1', {}); store.set('civique_missed_v2', []); home(); } };
  $('#sim').onclick = () => startQuiz(shuffle(shuffle(QUESTIONS.filter(q => q.theme !== SIT_THEME)).slice(0, 28).concat(shuffle(QUESTIONS.filter(q => q.theme === SIT_THEME)).slice(0, 12))), {exam: true});
  app.querySelectorAll('[data-th]').forEach(b => b.onclick = () => startQuiz(shuffle(QUESTIONS.filter(q => q.theme === th[+b.dataset.th])).sort((a, c) => priority(a.id) - priority(c.id)), {}));
  $('#cards').onclick = () => startCards(shuffle(QUESTIONS));
  $('#errs').onclick = () => startQuiz(shuffle(QUESTIONS.filter(q => missed.has(q.id))), {});
}

function startQuiz(list, opt){
  if (!list.length) return home();
  const S = {list, i: 0, answers: [], opt, left: 45*60};
  stopTimer();
  if (opt.exam) timerId = setInterval(() => {
    S.left--; const el = $('#time');
    if (el) { el.textContent = fmt(S.left); el.classList.toggle('low', S.left <= 300); }
    if (S.left <= 0) { if (S.commit) S.commit(); result(S); }
  }, 1000);
  showQ(S);
}
const fmt = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');

const ICONS = `<svg class="i-check" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5 8.5 15 16.5 5.5"/></svg><svg class="i-cross" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 4.5 15.5 15.5M15.5 4.5 4.5 15.5"/></svg>`;

function showQ(S){
  stopSpeech();
  const item = S.list[S.i];
  const {correct, choices} = buildChoices(item);
  const pct = Math.round(S.i / S.list.length * 100);
  app.innerHTML = `
    <div class="top-row"><span class="counter">Question ${S.i+1} sur ${S.list.length}</span>${S.opt.exam ? `<b class="timer${S.left<=300?' low':''}" id="time" role="timer">${fmt(S.left)}</b>` : '<button class="link" id="quit">Quitter</button>'}</div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${S.list.length}" aria-valuenow="${S.i}"><i style="width:${pct}%"></i></div>
    <div class="ballot">
      <span class="badge" style="--tc:${tcol(item.theme)}">${esc(themeLabel(item))}</span>
      <div class="q">${esc(item.q)}</div>
      <p class="hint">Une seule bonne réponse par question. Tu peux changer de réponse avant de valider.</p>
      ${listenBtn('listenQ', 'Écouter la question')}
      <div id="choices">${choices.map((c,i) => `<button class="btn choice" data-i="${i}"><span class="box">${ICONS}</span><span>${esc(c.t)}</span></button>`).join('')}</div>
    </div>
    <div id="fb" aria-live="polite"></div>`;
  if ($('#quit')) $('#quit').onclick = home;
  if ($('#listenQ')) $('#listenQ').onclick = e => toggleSpeak('q', item.q + ' ' + choices.map((c, i) => `${ORD[i]} proposition : ${c.t}.`).join(' '), e.currentTarget);
  // Le choix reste modifiable jusqu'à la validation : un second clic sur la même proposition l'annule.
  const btns = [...app.querySelectorAll('#choices .btn')];
  const last = S.i === S.list.length - 1;
  let sel = null;
  const goNext = () => { if (last) result(S); else { S.i++; showQ(S); window.scrollTo(0, 0); } };
  const commit = () => {
    const c = choices[sel];
    S.commit = null;
    S.answers.push({item, ok: c.ok, given: c.t, correct});
    record(item.id, c.ok);
    if (c.ok) missed.delete(item.id); else missed.add(item.id);
    store.set('civique_missed_v2', [...missed]);
    return c;
  };
  const paintSel = () => {
    btns.forEach((x, k) => { x.classList.toggle('picked', k === sel); x.setAttribute('aria-pressed', String(k === sel)); });
    if (sel === null) { S.commit = null; $('#fb').innerHTML = ''; return; }
    S.commit = S.opt.exam ? () => commit() : null;
    $('#fb').innerHTML = S.opt.exam
      ? `<button class="btn primary" id="go">${last ? 'Voir le résultat' : 'Question suivante'}</button>`
      : `<button class="btn primary" id="go">Valider ma réponse</button>`;
    $('#go').onclick = S.opt.exam ? () => { commit(); goNext(); } : validate;
  };
  const validate = () => {
    const c = commit();
    btns.forEach((x, k) => {
      x.disabled = true; x.classList.remove('picked'); x.removeAttribute('aria-pressed');
      if (choices[k].ok) x.classList.add('ok'); else if (k === sel) x.classList.add('ko');
    });
    const renderFb = first => {
      let fb = c.ok ? '<p class="verdict ok">Bonne réponse.</p>' : `<p class="verdict ko">Pas tout à fait.</p><p style="margin:0 0 4px"><b>Réponse attendue :</b> ${esc(correct)}</p>`;
      const others = item.a.filter(x => x !== correct);
      if (others.length) fb += `<p class="also">Autres réponses acceptées : ${others.map(esc).join(' · ')}</p>`;
      fb += explainBlock(item, choices, c);
      fb += listenBtn('listenFb', 'Écouter l\'explication');
      fb += `<button class="btn primary" id="next">${last ? 'Voir le résultat' : 'Question suivante'}</button>`;
      $('#fb').innerHTML = fb;
      if (first) { $('#next').focus({preventScroll: true}); $('#next').scrollIntoView({block: 'nearest', behavior: 'smooth'}); }
      $('#next').onclick = goNext;
      if ($('#listenFb')) $('#listenFb').onclick = e => {
        const wr = choices.filter(x => !x.ok && x.why);
        const txt = (c.ok ? 'Bonne réponse.' : 'Pas tout à fait. La réponse attendue : ' + correct + '.')
          + (expl(item) ? ' À retenir : ' + expl(item) : '')
          + (wr.length ? ' Pourquoi les autres propositions sont fausses. ' + wr.map(x => x.t + ' : ' + x.why).join(' ') : '');
        toggleSpeak('fb', txt, e.currentTarget);
      };
      const tg = $('#easyToggle');
      if (tg) tg.onclick = () => { stopSpeech(); setEasy(!easy); choices.forEach(x => { if (!x.ok) x.why = whyOf(item, x.i); }); renderFb(false); $('#easyToggle').focus({preventScroll: true}); };
    };
    renderFb(true);
  };
  btns.forEach((b, k) => { b.setAttribute('aria-pressed', 'false'); b.onclick = () => { sel = (sel === k) ? null : k; paintSel(); if (sel !== null) $('#go').scrollIntoView({block: 'nearest', behavior: 'smooth'}); }; });
}

// Bloc « Pourquoi ? » : explication de la bonne réponse + raison pour laquelle chaque proposition fausse l'est (quand elle est utile).
function explainBlock(item, choices, picked){
  const wrongs = choices.filter(x => !x.ok && x.why);
  if (!expl(item) && !wrongs.length) return '';
  let h = '<div class="note">';
  if (expl(item)) h += `<p><span class="lbl">À retenir.</span> ${esc(expl(item))}</p>`;
  if (wrongs.length) h += `<h3>Pourquoi les autres propositions sont fausses</h3><ul>${wrongs.map(x => `<li><b>${esc(x.t)}</b>${x === picked ? ' <span class="you">(ta réponse)</span>' : ''} : ${esc(x.why)}</li>`).join('')}</ul>`;
  h += `<button class="link mode-link" id="easyToggle">${easy ? 'Voir l\'explication complète' : 'Voir en français facile'}</button>`;
  return h + '</div>';
}

function result(S){
  stopSpeech();
  stopTimer();
  const n = S.answers.length, good = S.answers.filter(a => a.ok).length;
  const pct = n ? Math.round(good / n * 100) : 0;
  const byTheme = {};
  S.answers.forEach(a => { const t = byTheme[a.item.theme] ||= {g:0, n:0}; t.n++; if (a.ok) t.g++; });
  const bad = S.answers.filter(a => !a.ok);
  const stamp = S.opt.exam ? (pct >= 80 ? ['ok', 'Objectif<br>atteint'] : ['ko', 'À<br>retravailler']) : ['neutral', 'Série<br>terminée'];
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="result">
      <div class="stamp ${stamp[0]}">${stamp[1]}</div>
      <div class="score">${good}<small> / ${n}</small></div>
      <p class="pct">${pct} % de bonnes réponses${S.opt.exam ? ' · il en fallait 80 %' : ''}</p>
      ${Object.entries(byTheme).map(([t,v]) => `<div class="tb" style="--tc:${tcol(t)}"><div class="l"><span>${esc(t)}</span><b>${v.g} / ${v.n}</b></div><div class="t"><i style="width:${Math.round(v.g/v.n*100)}%"></i></div></div>`).join('')}
    </div>
    ${bad.length ? `<h2 class="sect">À revoir (${bad.length})</h2>${bad.map(a => `<div class="review"><p class="rq">${esc(a.item.q)}</p><p><span class="you">Ta réponse :</span> ${esc(a.given)}</p><p class="good">Attendu : ${esc(a.correct)}</p>${expl(a.item) ? `<p class="kn">${esc(expl(a.item))}</p>` : ''}</div>`).join('')}` : '<p class="perfect">Aucune erreur, bravo !</p>'}
    <button class="btn primary" id="home">Retour à l'accueil</button>
    ${footer()}`;
  $('#home').onclick = home;
  window.scrollTo(0, 0);
}

function startCards(list){
  let i = 0, shown = false;
  const draw = () => {
    stopSpeech();
    const it = list[i];
    app.innerHTML = `
      <div class="top-row"><span class="counter">Fiche ${i+1} sur ${list.length}</span><button class="link" id="quit">Quitter</button></div>
      <div class="bar"><i style="width:${Math.round(i/list.length*100)}%"></i></div>
      <div class="flash">
        <span class="badge" style="--tc:${tcol(it.theme)}">${esc(themeLabel(it))}</span>
        <div class="q">${esc(it.q)}</div>
        ${listenBtn('listen', shown ? 'Écouter la réponse' : 'Écouter la question')}
        ${shown ? `<p class="ans">${it.a.map(esc).join('<br>')}</p>${expl(it) ? `<p class="mut" style="margin:0;font-family:var(--serif);font-size:1rem">${esc(expl(it))}</p>` : ''}` : '<button class="btn primary" id="show">Voir la réponse</button>'}
      </div>
      <div class="pair"><button class="btn" id="prev" ${i?'':'disabled'}>Précédente</button><button class="btn" id="nx" ${i<list.length-1?'':'disabled'}>Suivante</button></div>`;
    $('#quit').onclick = home;
    if ($('#listen')) $('#listen').onclick = e => toggleSpeak('c' + i + shown, shown ? it.q + ' Réponse : ' + it.a.join('. ou ') + '. ' + expl(it) : it.q, e.currentTarget);
    if ($('#show')) $('#show').onclick = () => { shown = true; draw(); };
    $('#prev').onclick = () => { i--; shown = false; draw(); };
    $('#nx').onclick = () => { i++; shown = false; draw(); };
  };
  draw();
}

function footer(){
  return `<footer>
    <p>Les questions viennent de la liste officielle du ministère de l'Intérieur. Les bonnes réponses sont des propositions pédagogiques, non officielles. Les fausses propositions, les explications et les mises en situation ont été rédigées pour cette application. Rien de tout cela n'engage l'administration, et l'application ne remplace ni le livret du citoyen ni l'examen officiel.</p>
    <p>Réponses suggérées par <a href="https://leqcmcivique.fr" target="_blank" rel="noopener">leqcmcivique.fr</a> (données sous Licence Ouverte 2.0).</p>
  </footer>`;
}

// ---------- Démarrage ----------
loadData(JSON.parse(document.getElementById('qdata').textContent));
home();
</script>
<script>if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
